<!DOCTYPE html>
<!-- =========================================================================
     SV2 · VIDEO 2 (TRANG 2 - KINH DOANH): NHẮC THANH TOÁN 4 BƯỚC & TRỢ LÝ AI-2
     Kiến trúc chuẩn InvoicePilot: IIFE Namespace window.IP (AI, DB, UI, Pages)
     ========================================================================= -->
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SV2 · Trang 2 — Trình soạn Nhắc thanh toán 4 Bước & Trợ lý AI-2 | InvoicePilot</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --ip-bg: #F7F6F2;
      --ip-surface: #FFFFFF;
      --ip-sidebar: #0F1F1C;
      --ip-primary: #0B5D50;
      --ip-accent: #E8B44A;
      --ip-border: #E4E2DC;
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: var(--ip-bg);
      color: #14201D;
      margin: 0;
    }

    .ip-shell {
      display: flex;
      min-height: 100vh;
    }

    .ip-sidebar {
      width: 250px;
      background: var(--ip-sidebar);
      color: #EAF2EF;
      padding: 1.25rem 1rem;
      flex-shrink: 0;
    }

    .ip-brand {
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .ip-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(234, 242, 239, 0.75);
      padding: 9px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .ip-nav-link:hover,
    .ip-nav-link.active {
      background: rgba(232, 180, 74, 0.16);
      color: var(--ip-accent);
      font-weight: 600;
    }

    .ip-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .ip-topbar {
      height: 60px;
      background: var(--ip-surface);
      border-bottom: 1px solid var(--ip-border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ip-content {
      padding: 1.5rem;
      max-width: 1360px;
    }

    .ip-card {
      background: var(--ip-surface);
      border: 1px solid var(--ip-border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .ip-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .preview-box {
      background: #FBFBF9;
      border: 1px dashed #B7D7CE;
      border-radius: 10px;
      padding: 1rem;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }

    #ip-toast-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 3000;
    }
  </style>
</head>

<body data-page="sales-payment-reminders" data-roles="sales">
  <div class="ip-shell">
    <aside class="ip-sidebar">
      <a class="ip-brand" href="#"><i class="bi bi-receipt-cutoff text-warning fs-4"></i> InvoicePilot</a>
      <div class="small text-uppercase text-white-50 mb-2 px-2" style="font-size:0.72rem;">SV2 · Phân hệ Kinh doanh &
        Admin</div>
      <a class="ip-nav-link" href="SV2-Trang1-sales-customer-balance.html"><i class="bi bi-building-check"></i> 1. Công
        nợ KH & Tuổi nợ</a>
      <a class="ip-nav-link active" href="SV2-Trang2-sales-payment-reminders.html"><i class="bi bi-envelope-paper"></i>
        2. Nhắc thanh toán & AI-2</a>
      <a class="ip-nav-link" href="SV2-Trang3-admin-customer-management.html"><i class="bi bi-people-fill"></i> 3.
        [Admin] Quản trị KH B2B</a>
      <hr class="border-secondary my-3">
      <div class="small text-white-50 px-2">Đăng nhập: <strong>Trần Minh Quân</strong><br><span class="text-info">Trưởng
          phòng Kinh doanh B2B</span></div>
    </aside>

    <div class="ip-main">
      <header class="ip-topbar">
        <div class="small text-muted">Kinh doanh B2B / <strong class="text-dark">Trình soạn Nhắc thanh toán 4 Bước & Trợ
            lý AI-2 (Email/SMS)</strong></div>
        <a class="btn btn-sm btn-outline-secondary" href="SV2-Trang1-sales-customer-balance.html"><i
            class="bi bi-arrow-left"></i> Về Sổ Công nợ</a>
      </header>
      <main id="main-content" class="ip-content"></main>
    </div>
  </div>
  <div id="ip-toast-box"></div>

  <script>
    /**
     * @owner SV2
     * @spec §8.2, §9.3 Trình soạn Nhắc thanh toán 4 Bước & Động cơ Trợ lý AI-2 (3 Giọng điệu)
     */
    (function (window) {
      'use strict';
      const IP = (window.IP = window.IP || {});
      const REMINDER_KEY = 'invoicepilot.sv2.reminders.v1';

      IP.Fmt = { vnd: (n) => Math.round(Number(n || 0)).toLocaleString('vi-VN') + ' ₫' };

      const CUSTOMERS = [
        {
          id: 'c1', name: 'Tập đoàn Bán lẻ Phú Thái', email: 'ketoan@phuthai.vn', invoices: [
            { id: 'i1', code: 'IP-2026-0012', dueDate: '2026-10-20', amount: 95000000 },
            { id: 'i2', code: 'IP-2026-0008', dueDate: '2026-09-01', amount: 110000000 }
          ]
        },
        {
          id: 'c3', name: 'Công ty CP Dược phẩm Tâm Bình', email: 'taichinh@tambinh.vn', invoices: [
            { id: 'i4', code: 'IP-2026-0003', dueDate: '2026-07-10', amount: 260000000 }
          ]
        }
      ];

      // 1. ĐỘNG CƠ TRỢ LÝ AI-2: TỰ ĐỘNG SOẠN EMAIL / SMS THEO 3 GIỌNG ĐIỆU (IP.AI.generateReminderDraft)
      IP.AI = {
        generateReminderDraft: function (cust, selectedInvs, channel, tone) {
          const codes = selectedInvs.map((i) => i.code).join(', ');
          const total = IP.Fmt.vnd(selectedInvs.reduce((s, i) => s + i.amount, 0));
          const earliestDue = selectedInvs.map((i) => i.dueDate).sort()[0] || '2026-10-20';
          const bank = 'Vietcombank - TK 0011004567899 (CTCP Giải pháp Số hóa Hòa Bình)';

          // Nếu kênh là SMS Brandname: tự động chuyển sang chuỗi ngắn gọn dưới 160 ký tự
          if (channel === 'SMS') {
            const prefix = tone === 'firm' ? '[THONG BAO QUAN TRONG]' : '[HOA BINH CORP]';
            return {
              subject: `SMS Brandname nhắc công nợ (${codes})`,
              body: `${prefix} Kinh gui ${cust.name}, hoa don ${codes} tong so du ${total} (han ${earliestDue}) chua ghi nhan thanh toan. Quy doi tac vui long UNC qua VCB 0011004567899.`
            };
          }

          // Nếu kênh là Email: biến thiên câu chữ theo 3 giọng điệu B2B
          if (tone === 'friendly') {
            return {
              subject: `[Nhắc lịch thanh toán] Hóa đơn GTGT ${codes} - ${cust.name}`,
              body: `Kính gửi Phòng Kế toán - ${cust.name},\n\nHòa Bình Digital trân trọng cảm ơn sự hợp tác của Quý đối tác. Chúng tôi xin phép nhắc nhẹ khoản thanh toán thuộc hóa đơn ${codes} (Ký hiệu: 1C26TAA) với tổng số dư ${total}, hạn thanh toán ngày ${earliestDue}.\n\nQuý đơn vị vui lòng chuyển khoản về: ${bank}.\n\nTrân trọng,\nPhòng Kinh doanh & Công nợ Hòa Bình`
            };
          } else if (tone === 'formal') {
            return {
              subject: `[Đề nghị đối chiếu & thanh toán] Hóa đơn ${codes} - ${cust.name}`,
              body: `Kính gửi Ban Giám đốc và Phòng Tài chính Kế toán - ${cust.name},\n\nCăn cứ hợp đồng kinh tế và sổ theo dõi công nợ đến hôm nay, các hóa đơn ${codes} với tổng giá trị ${total} (đáo hạn ${earliestDue}) hiện đã đến kỳ tất toán.\n\nĐề nghị Quý đơn vị sắp xếp ủy nhiệm chi về tài khoản: ${bank} và phản hồi lịch thanh toán dự kiến.\n\nTrân trọng cảm ơn!`
            };
          } else {
            return {
              subject: `[THÔNG BÁO QUÁ HẠN LẦN CUỐI] Đề nghị tất toán hóa đơn ${codes} - ${cust.name}`,
              body: `Kính gửi Ban Giám đốc - ${cust.name},\n\nKhoản công nợ thuộc hóa đơn ${codes} với tổng số dư ${total} (hạn thanh toán ${earliestDue}) đã quá hạn theo thỏa thuận hợp đồng và ảnh hưởng trực tiếp đến hạn mức tín dụng B2B của Quý đơn vị.\n\nĐề nghị Quý công ty thực hiện thanh toán ngay về ${bank} trước ngày mai để tránh gián đoạn cung cấp dịch vụ.\n\nTrân trọng!`
            };
          }
        }
      };

      // 2. QUẢN LÝ LỊCH SỬ NHẮC NỢ LOCALSTORAGE (IP.DB)
      function getReminders() {
        const raw = localStorage.getItem(REMINDER_KEY);
        return raw ? JSON.parse(raw) : [
          { id: 'r1', customerName: 'Tập đoàn Bán lẻ Phú Thái', codes: 'IP-2026-0012', total: 95000000, channel: 'Email', tone: 'Thân thiện', status: 'sent', time: '2026-10-22 09:30' },
          { id: 'r2', customerName: 'Công ty CP Dược phẩm Tâm Bình', codes: 'IP-2026-0003', total: 260000000, channel: 'SMS', tone: 'Cứng rắn lịch sự', status: 'failed', time: '2026-10-23 14:15' }
        ];
      }
      function saveReminders(list) { localStorage.setItem(REMINDER_KEY, JSON.stringify(list)); }

      // 3. STATE TRÌNH SOẠN 4 BƯỚC & RENDER GIAO DIỆN
      let state = { customerId: 'c1', selectedIds: ['i1', 'i2'], channel: 'Email', tone: 'friendly', subject: '', body: '' };

      function runAiCompose() {
        const cust = CUSTOMERS.find((c) => c.id === state.customerId);
        const selInvs = cust.invoices.filter((i) => state.selectedIds.includes(i.id));
        if (selInvs.length === 0) { state.subject = ''; state.body = 'Vui lòng chọn ít nhất 1 hóa đơn ở Bước 2.'; return; }
        const draft = IP.AI.generateReminderDraft(cust, selInvs, state.channel, state.tone);
        state.subject = draft.subject;
        state.body = draft.body;
      }
      runAiCompose();

      function toast(title, msg, type = 'success') {
        const el = document.createElement('div');
        el.className = `alert alert-${type} shadow border-0 py-2 px-3 mb-2`;
        el.innerHTML = `<div class="fw-bold small">${title}</div><div class="small">${msg}</div>`;
        document.getElementById('ip-toast-box').appendChild(el);
        setTimeout(() => el.remove(), 3200);
      }

      function renderPage() {
        const root = document.getElementById('main-content');
        const cust = CUSTOMERS.find((c) => c.id === state.customerId);
        const selInvs = cust.invoices.filter((i) => state.selectedIds.includes(i.id));
        const totalSelected = selInvs.reduce((s, i) => s + i.amount, 0);
        const history = getReminders();

        root.innerHTML = `
        <div class="row g-4 mb-4">
          <div class="col-lg-6">
            <div class="ip-card">
              <h5 class="fw-bold mb-3">Quy trình 4 Bước Soạn Nhắc Thanh toán</h5>
              <div class="mb-3">
                <label class="form-label small fw-bold text-primary">Bước 1 · Chọn Khách hàng Doanh nghiệp</label>
                <select id="sel-cust" class="form-select">
                  ${CUSTOMERS.map((c) => `<option value="${c.id}" ${c.id === state.customerId ? 'selected' : ''}>${c.name} (${c.email})</option>`).join('')}
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold text-primary">Bước 2 · Chọn các Hóa đơn cần nhắc (${selInvs.length} HĐ · Tổng: ${IP.Fmt.vnd(totalSelected)})</label>
                <div class="list-group">
                  ${cust.invoices.map((inv) => `
                    <label class="list-group-item d-flex justify-content-between align-items-center">
                      <div>
                        <input class="form-check-input me-2" type="checkbox" data-inv="${inv.id}" ${state.selectedIds.includes(inv.id) ? 'checked' : ''}>
                        <strong class="ip-num">${inv.code}</strong> · Đáo hạn: <span class="ip-num">${inv.dueDate}</span>
                      </div>
                      <span class="ip-num fw-bold text-danger">${IP.Fmt.vnd(inv.amount)}</span>
                    </label>`).join('')}
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-sm-5">
                  <label class="form-label small fw-bold text-primary">Bước 3 · Kênh gửi</label>
                  <select id="sel-channel" class="form-select">
                    <option value="Email" ${state.channel === 'Email' ? 'selected' : ''}>Email B2B</option>
                    <option value="SMS" ${state.channel === 'SMS' ? 'selected' : ''}>SMS Brandname</option>
                  </select>
                </div>
                <div class="col-sm-7">
                  <label class="form-label small fw-bold text-primary">Giọng điệu AI-2</label>
                  <select id="sel-tone" class="form-select">
                    <option value="friendly" ${state.tone === 'friendly' ? 'selected' : ''}>Thân thiện (Nhắc nhẹ)</option>
                    <option value="formal" ${state.tone === 'formal' ? 'selected' : ''}>Trang trọng (Đề nghị đối chiếu)</option>
                    <option value="firm" ${state.tone === 'firm' ? 'selected' : ''}>Cứng rắn lịch sự (Quá hạn lâu)</option>
                  </select>
                </div>
              </div>
              <button class="btn btn-success w-100" id="btn-ai2"><i class="bi bi-stars"></i> Dùng Trợ lý AI-2 Soạn lại Thông điệp</button>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="ip-card h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <label class="form-label small fw-bold text-primary mb-0">Bước 4 · Xem trước Trực tiếp (Live Preview) & Phát hành</label>
                  <span class="badge bg-info-subtle text-info-emphasis">${state.channel}</span>
                </div>
                <input id="inp-subj" class="form-control fw-bold mb-2" value="${state.subject}">
                <textarea id="inp-body" class="form-control preview-box mb-3" rows="8">${state.body}</textarea>
              </div>
              <div class="d-flex gap-2 justify-content-end">
                <button class="btn btn-outline-primary" id="btn-schedule"><i class="bi bi-calendar-event"></i> Đặt lịch gửi (Scheduled)</button>
                <button class="btn btn-primary" id="btn-send-now"><i class="bi bi-send-check"></i> Gửi nhắc thanh toán ngay</button>
              </div>
            </div>
          </div>
        </div>

        <div class="ip-card">
          <h6 class="fw-bold mb-2">Nhật ký Gửi Nhắc Thanh toán (${history.length} bản ghi)</h6>
          <table class="table align-middle mb-0">
            <thead><tr><th>Thời gian</th><th>Khách hàng</th><th>Hóa đơn</th><th class="text-end">Tổng tiền nhắc</th><th>Kênh</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead>
            <tbody>
              ${history.map((h) => `
                <tr>
                  <td class="ip-num small">${h.time}</td><td class="fw-semibold">${h.customerName}</td><td class="ip-num">${h.codes}</td>
                  <td class="ip-num text-end fw-bold">${IP.Fmt.vnd(h.total)}</td><td>${h.channel}</td>
                  <td>${h.status === 'sent' ? '<span class="badge bg-success-subtle text-success-emphasis">Đã gửi</span>' : h.status === 'scheduled' ? '<span class="badge bg-info-subtle text-info-emphasis">Đã lên lịch</span>' : '<span class="badge bg-danger-subtle text-danger-emphasis">Gửi lỗi (Failed)</span>'}</td>
                  <td class="text-end">${h.status !== 'sent' ? `<button class="btn btn-sm btn-outline-success" data-retry="${h.id}"><i class="bi bi-arrow-repeat"></i> Gửi lại ngay</button>` : '<span class="small text-muted">Hoàn tất</span>'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;

        root.querySelector('#sel-cust').addEventListener('change', (e) => {
          state.customerId = e.target.value;
          state.selectedIds = CUSTOMERS.find((c) => c.id === state.customerId).invoices.map((i) => i.id);
          runAiCompose(); renderPage();
        });
        root.querySelectorAll('[data-inv]').forEach((chk) => chk.addEventListener('change', () => {
          const id = chk.dataset.inv;
          state.selectedIds = chk.checked ? [...state.selectedIds, id] : state.selectedIds.filter((x) => x !== id);
          runAiCompose(); renderPage();
        }));
        root.querySelector('#sel-channel').addEventListener('change', (e) => { state.channel = e.target.value; runAiCompose(); renderPage(); });
        root.querySelector('#sel-tone').addEventListener('change', (e) => { state.tone = e.target.value; runAiCompose(); renderPage(); });
        root.querySelector('#btn-ai2').addEventListener('click', () => { runAiCompose(); renderPage(); toast('AI-2 đã soạn thảo xong', 'Đã tổng hợp mã hóa đơn, số tiền và TK ngân hàng.'); });

        function pushHistory(statusLabel) {
          if (selInvs.length === 0) return toast('Chưa chọn hóa đơn', 'Hãy chọn ít nhất 1 hóa đơn ở Bước 2.', 'danger');
          const list = getReminders();
          list.unshift({ id: 'r_' + Date.now(), customerName: cust.name, codes: selInvs.map((i) => i.code).join(', '), total: totalSelected, channel: state.channel, tone: state.tone, status: statusLabel, time: '2026-10-24 10:00' });
          saveReminders(list); renderPage();
          toast(statusLabel === 'sent' ? 'Đã gửi thông điệp nhắc nợ' : 'Đã đặt lịch gửi tự động', `${cust.name} (${IP.Fmt.vnd(totalSelected)})`);
        }
        root.querySelector('#btn-send-now').addEventListener('click', () => pushHistory('sent'));
        root.querySelector('#btn-schedule').addEventListener('click', () => pushHistory('scheduled'));
        root.querySelectorAll('[data-retry]').forEach((b) => b.addEventListener('click', () => {
          const list = getReminders();
          const item = list.find((x) => x.id === b.dataset.retry);
          if (item) { item.status = 'sent'; saveReminders(list); renderPage(); toast('Đã gửi lại thành công', item.customerName); }
        }));
      }

      document.addEventListener('DOMContentLoaded', renderPage);
    })(window);
  </script>
</body>

</html>
