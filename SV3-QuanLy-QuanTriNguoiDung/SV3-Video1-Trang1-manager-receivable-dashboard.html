       lên trang web khi nhấn F5!

  <script id="code-trong-tam-sinh-vien">
  window.__SV_REGISTER_MAIN_PAGE_CODE__ = function (window) {
    'use strict';
// === [1] ĐỘNG CƠ TRỢ LÝ AI-3 PHÂN TÍCH DÒNG TIỀN & ĐỘ TẬP TRUNG CÔNG NỢ ===
/**
 * @owner SV3
 * @spec §9.4 AI-3 Cashflow Summary & Scenario Analysis Engine (ai-cashflow.js)
 */
(function (window) {
  'use strict';
  const IP = window.IP;

  IP.AI.register('cashflow', {
    id: 'cashflow',
    label: 'Tóm tắt dòng tiền & Rủi ro công nợ (AI-3)',
    description: 'Phân tích độ tập trung công nợ, tuổi nợ quá hạn và dự báo dòng tiền theo kịch bản giả định đang chọn.',
    ctaText: 'Tạo tóm tắt bằng AI',

    run: function (ctx, scenarioMode) {
      if (scenarioMode === 'error') {
        return {
          status: 'error',
          title: 'Không thể xử lý lúc này',
          summary: 'Không thể tổng hợp báo cáo phân tích do gián đoạn tạm thời. Bạn có thể bấm Thử lại hoặc xem trực tiếp bảng số liệu.'
        };
      }

      const c = ctx || {};
      const openInvoices = IP.DB.listInvoices({ includeArchived: false }).filter(function (inv) {
        const eff = IP.Calc.effectiveStatus(inv);
        return ['sent', 'partial', 'overdue'].includes(eff) && IP.Calc.remaining(inv) > 0;
      });

      if (scenarioMode === 'insufficient' || openInvoices.length < 3) {
        return {
          status: 'insufficient',
          title: 'Không đủ dữ liệu để đưa ra đề xuất',
          summary: 'Cần tối thiểu 3 hóa đơn chưa thu trong kỳ phân tích để tạo bản tóm tắt có ý nghĩa thống kê. Vui lòng mở rộng kỳ lọc hoặc bổ sung dữ liệu.'
        };
      }

      const ag = IP.Calc.aging(openInvoices);
      const fc = IP.Calc.forecastCashflow({
        horizonDays: c.horizonDays || 60,
        scenario: c.scenario || 'base',
        recoveryRate: c.recoveryRate,
        delayDays: c.delayDays,
        includePending: c.includePending
      });

      const byCus = {};
      openInvoices.forEach(function (inv) {
        byCus[inv.customerId] = (byCus[inv.customerId] || 0) + IP.Calc.remaining(inv);
      });
      const sortedCus = Object.keys(byCus)
        .map(function (cid) {
          const cus = IP.DB.getCustomer(cid);
          return { id: cid, name: cus ? cus.name : cid, balance: byCus[cid] };
        })
        .sort(function (a, b) { return b.balance - a.balance; });

      const top2Sum = sortedCus.slice(0, 2).reduce(function (s, x) { return s + x.balance; }, 0);
      const top2Share = ag.totalReceivable > 0 ? Math.round((top2Sum / ag.totalReceivable) * 100) : 0;
      const over60Sum = ag.b61_90 + ag.b90plus;
      const over60Count = ag.counts.b61_90 + ag.counts.b90plus;
      const lowCashPeriods = fc.periods.filter(function (p) { return p.isLowCash; });

      const scenarioNames = { base: 'Cơ sở', conservative: 'Thận trọng', optimistic: 'Lạc quan' };
      const scenLabel = scenarioNames[fc.scenario] || 'Cơ sở';

      const summary = 'Trong tổng dư nợ phải thu ' + IP.Fmt.currency(ag.totalReceivable) + ' (' + openInvoices.length + ' hóa đơn mở), có ' +
        IP.Fmt.currency(ag.totalOverdue) + ' đang quá hạn. Ở kịch bản ' + scenLabel + ' (' + fc.horizonDays + ' ngày, tỷ lệ thu hồi quá hạn ' +
        fc.assumptions.recoveryRate + '%, độ trễ ' + fc.assumptions.delayDays + ' ngày), tổng dòng tiền dự kiến thu đạt ' +
        IP.Fmt.currency(fc.totals.cumulative) + '. Đáng chú ý, ' + top2Share + '% tổng công nợ đang tập trung ở 2 khách hàng lớn nhất.';

      const highlights = [
        {
          label: 'Mức độ tập trung khách hàng',
          value: top2Share + '% dư nợ ở 2 KH đầu',
          detail: (sortedCus[0] ? sortedCus[0].name : '') + (sortedCus[1] ? (' và ' + sortedCus[1].name) : '') + ' chiếm ' + IP.Fmt.currency(top2Sum) + '.'
        },
        {
          label: 'Công nợ quá hạn trên 60 ngày',
          value: over60Count + ' hóa đơn (' + IP.Fmt.currency(over60Sum) + ')',
          detail: 'Cần giao phụ trách Kinh doanh đôn đốc trực tiếp để giảm áp lực dòng tiền.'
        },
        {
          label: lowCashPeriods.length > 0 ? 'Cảnh báo kỳ thu thấp' : 'Nhịp thu dự kiến ổn định',
          value: lowCashPeriods.length > 0 ? (lowCashPeriods.length + ' kỳ dự kiến dưới ngưỡng') : ('Đạt ' + IP.Fmt.currency(fc.totals.cumulative)),
          detail: 'Thu từ hóa đơn trong hạn: ' + IP.Fmt.currency(fc.totals.dueExpected) + ' · Thu hồi quá hạn: ' + IP.Fmt.currency(fc.totals.overdueRecovery) + '.'
        }
      ];

      return {
        status: 'ok',
        title: 'Bản tóm tắt dòng tiền kịch bản ' + scenLabel + ' (' + fc.horizonDays + ' ngày)',
        summary: summary,
        highlights: highlights,
        reportPayload: {
          type: c.mode === 'forecast' ? 'forecast' : 'dashboard',
          period: c.period || (fc.horizonDays + 'd'),
          horizon: fc.horizonDays,
          scenario: fc.scenario,
          summary: summary,
          highlights: highlights,
          assumptions: fc.assumptions,
          confidence: openInvoices.length >= 10 ? 'high' : 'medium'
        },
        confidence: openInvoices.length >= 10 ? 'high' : 'medium',
        explanation: {
          dataUsed: [
            openInvoices.length + ' hóa đơn chưa tất toán (Tổng phải thu: ' + IP.Fmt.currency(ag.totalReceivable) + ')',
            'Phân bổ tuổi nợ: Trong hạn ' + IP.Fmt.currency(ag.current) + ', Quá hạn ' + IP.Fmt.currency(ag.totalOverdue)
          ],
          rules: [
            'Kịch bản: ' + scenLabel + ' · Tỷ lệ thu hồi nợ quá hạn: ' + fc.assumptions.recoveryRate + '% · Độ trễ bình quân: ' + fc.assumptions.delayDays + ' ngày',
            'Khoản chờ đối chiếu ngân hàng: ' + (fc.assumptions.includePending ? 'Có cộng vào kỳ đầu' : 'Không cộng (mặc định thận trọng)'),
            'Báo cáo dự báo dựa trên sổ theo dõi công nợ nội bộ, phục vụ điều hành dòng tiền'
          ],
          evidence: [
            '2 khách hàng dư nợ cao nhất chiếm ' + top2Share + '% (' + IP.Fmt.currency(top2Sum) + ')',
            'Dòng tiền lũy kế dự kiến ' + fc.horizonDays + ' ngày: ' + IP.Fmt.currency(fc.totals.cumulative)
          ]
        }
      };
    },

    renderResultBody: function (res) {
      const hlHtml = (res.highlights || []).map(function (h) {
        return (
          '<div class="ip-ai-finding">' +
            '<div class="d-flex justify-content-between align-items-center mb-1">' +
              '<span class="small fw-bold">' + IP.Utils.escapeHtml(h.label) + '</span>' +
              '<span class="badge bg-warning-subtle text-warning-emphasis ip-num">' + IP.Utils.escapeHtml(h.value) + '</span>' +
            '</div>' +
            '<div class="small text-muted">' + IP.Utils.escapeHtml(h.detail) + '</div>' +
          '</div>'
        );
      }).join('');

      return (
        '<p class="small mb-2">' + IP.Utils.escapeHtml(res.summary) + '</p>' +
        '<div class="mb-2">' + hlHtml + '</div>'
      );
    },

    renderActions: function () {
      return (
        '<button type="button" class="btn btn-primary btn-sm" data-ai-cmd="save-report"><i class="bi bi-bookmark-check"></i> Lưu báo cáo</button>' +

/**
 * @owner SV3
 * @spec §8.3, §9.4, §10.4 AI Reports Persistence Domain API
 */
(function (window) {
  'use strict';
  const IP = window.IP;
  const DB = IP.DB;

  DB.extend('reports', {
    listAIReports: function (filter) {
      const f = filter || {};
      const st = DB._rawState();
      let list = st.aiReports.slice();
      if (f.type && f.type !== 'all') {
        list = list.filter(function (r) { return r.type === f.type; });
      }
      return list;
    },

    getAIReport: function (id) {
      if (!id) return null;
      const st = DB._rawState();
      return st.aiReports.find(function (r) { return r.id === id; }) || null;
    },

    saveAIReport: function (report) {
      const st = DB._rawState();
      const r = report || {};
      if (!r.summary || !String(r.summary).trim()) {
        return DB.err('VALIDATION', 'Báo cáo AI không có nội dung tóm tắt để lưu.');
      }

      const record = {
        id: IP.Utils.uid('rpt'),
        type: r.type === 'forecast' ? 'forecast' : 'dashboard',
        period: r.period || '90d',
        horizon: Number(r.horizon || 90),
        scenario: r.scenario || 'base',
        summary: String(r.summary).trim(),
        highlights: Array.isArray(r.highlights) ? r.highlights : [],
        assumptions: r.assumptions || { recoveryRate: 65, delayDays: 10, includePending: false },
        confidence: ['high', 'medium', 'low'].includes(r.confidence) ? r.confidence : 'high',
        createdAt: new Date().toISOString(),
        createdBy: DB.currentActorId()
      };

      st.aiReports.unshift(record);
      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'settings',
          entityId: record.id,
          type: 'ai_report',
          message: 'Đã lưu báo cáo tóm tắt dòng tiền AI (' + (record.type === 'forecast' ? 'Dự báo kịch bản' : 'Tổng quan công nợ') + ').'
        });
      }
      if (DB.addNotification) {
        DB.addNotification({
          role: 'manager',
          type: 'system',
          title: 'Đã lưu báo cáo dòng tiền AI (' + record.period + ')',
          message: record.summary.slice(0, 110) + '...',
          targetRouteKey: record.type === 'forecast' ? 'manager.forecast' : 'manager.dashboard',
          targetParams: {}
        });
      }

      DB._commit();
      return DB.ok(record);
    },

    deleteAIReport: function (id) {
      const st = DB._rawState();
      const idx = st.aiReports.findIndex(function (r) { return r.id === id; });
      if (idx < 0) return DB.err('NOT_FOUND', 'Không tìm thấy báo cáo AI.');
      st.aiReports.splice(idx, 1);
      DB._commit();
      return DB.ok({ deletedId: id });
    }
  });
})(window);

            type: 'bar',
            data: {
              labels: cusBalances.map(function (x) { return x.customer.name.replace('Công ty ', ''); }),
              datasets: [{
                label: 'Dư nợ (VND)',
                data: cusBalances.map(function (x) { return x.balance; }),
                backgroundColor: '#0E7A68',
                borderRadius: 6
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { color: textColor }, grid: { color: gridColor } },
                y: { ticks: { color: textColor }, grid: { display: false } }
              }
            }
          }));
        }
      }

      window.addEventListener('ip:themechange', function () {
        render();
      });

      IP.UI.withLoading(root, render);

      root.addEventListener('click', function (ev) {
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        const id = btn.getAttribute('data-id');

        if (action === 'set-period') {
          currentPeriod = btn.getAttribute('data-period');
          IP.Utils.setQueryParams({ period: currentPeriod });
          render();
        } else if (action === 'refresh-dash') {
          IP.UI.toast({ title: 'Đã cập nhật số liệu', message: 'Biểu đồ và chỉ số đã được tính toán lại từ DB.', type: 'info' });
          render();
        } else if (action === 'go-overdue') {
          window.location.href = 'manager-overdue-invoices.html';
        } else if (action === 'view-report') {
          const r = IP.DB.getAIReport(id);
          if (!r) return;
          IP.UI.confirmModal({
            title: 'Báo cáo AI đã lưu (' + r.period + ')',
            message: r.summary,
            confirmText: 'Đóng',
            cancelText: 'Thoát'
          });
        } else if (action === 'delete-report') {
          IP.UI.confirmModal({
            title: 'Xóa báo cáo AI đã lưu?',
            message: 'Bản chụp báo cáo này sẽ bị xóa khỏi danh sách đã lưu.',
            confirmText: 'Xóa báo cáo',
            variant: 'danger',
            onConfirm: function () {
              IP.DB.deleteAIReport(id);
              IP.UI.toast({ title: 'Đã xóa báo cáo', message: 'Danh sách báo cáo đã được cập nhật.', type: 'success' });
              render();
            }
          });
        }
      });
    }
  });
})(window);

  };
  </script>

  padding: 12px 16px;
  border-bottom: 1px solid var(--ip-border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 2;
}
.table tbody td {
  padding: 13px 16px;
  vertical-align: middle;
  border-bottom: 1px solid var(--ip-border);
  font-size: 0.92rem;
}
.table tbody tr:hover {
  background-color: var(--ip-surface-raised);
}
.ip-sort-btn {
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
  text-transform: inherit;
  letter-spacing: inherit;
  padding: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.ip-sort-btn:hover {
  color: var(--ip-primary);
}

/* Status Badges */
.ip-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--ip-radius-pill);
  font-size: 0.78rem;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  border: 1px solid transparent;
}
.ip-badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: currentColor;
}
.ip-badge-paid, .ip-badge-confirmed, .ip-badge-active, .ip-badge-low {
  background-color: var(--ip-success-tint);
  color: var(--ip-success);
  border-color: var(--ip-success-border);
}
.ip-badge-overdue, .ip-badge-rejected, .ip-badge-failed, .ip-badge-high {
  background-color: var(--ip-danger-tint);
  color: var(--ip-danger);
  border-color: var(--ip-danger-border);
}
.ip-badge-partial, .ip-badge-pending, .ip-badge-scheduled, .ip-badge-invited, .ip-badge-medium {
  background-color: var(--ip-warning-tint);
  color: var(--ip-warning);
  border-color: var(--ip-warning-border);
}
.ip-badge-sent, .ip-badge-watching {
  background-color: var(--ip-info-tint);
  color: var(--ip-info);
  border-color: var(--ip-info-border);
}
.ip-badge-draft, .ip-badge-archived, .ip-badge-voided, .ip-badge-cancelled, .ip-badge-disabled, .ip-badge-closed {
  background-color: var(--ip-surface-raised);
  color: var(--ip-muted);
  border-color: var(--ip-border);
}

/* AI Panel Styling (§9.1) */
.ip-ai-panel {
  background-color: var(--ip-accent-tint);
  border: 1px solid var(--ip-accent-border);
  border-radius: var(--ip-radius-card);
  padding: 18px 20px;
}
.ip-ai-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.ip-ai-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--ip-radius-pill);
  background: var(--ip-surface);
  border: 1px solid var(--ip-accent-border);
  color: var(--ip-accent-ink);
  font-size: 0.76rem;
  font-weight: 700;
}
.ip-ai-disclaimer {
  font-size: 0.78rem;
  color: var(--ip-muted);
  margin-bottom: 12px;
}
.ip-ai-finding {
  background: var(--ip-surface);
  border: 1px solid var(--ip-border);
  border-radius: var(--ip-radius-sm);
  padding: 12px;
  margin-bottom: 8px;
}

/* Skeleton Loader */
@keyframes ip-shimmer {
  0% { opacity: 0.45; }
  50% { opacity: 0.85; }
  100% { opacity: 0.45; }
}
.ip-skeleton {
  background-color: var(--ip-border);
  border-radius: var(--ip-radius-sm);
  animation: ip-shimmer 1.4s ease-in-out infinite;
}

/* Empty & Error States */
.ip-state-box {
  text-align: center;
  padding: 48px 24px;
  max-width: 460px;
  margin: 0 auto;
}
.ip-state-box svg {
  width: 64px;
  height: 64px;
  margin-bottom: 16px;
  color: var(--ip-primary);
}

/* Toast Container */
.ip-toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2050;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 380px;
  width: calc(100% - 40px);
}
.ip-toast {
  background: var(--ip-surface);
  color: var(--ip-ink);
  border: 1px solid var(--ip-border-strong);
  border-left: 4px solid var(--ip-primary);
  border-radius: var(--ip-radius-md);
  padding: 12px 16px;
  box-shadow: var(--ip-shadow-card);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.ip-toast-danger { border-left-color: var(--ip-danger); }
.ip-toast-warning { border-left-color: var(--ip-warning); }
.ip-toast-success { border-left-color: var(--ip-success); }

/* Offcanvas / Drawer restyle */
.offcanvas,
.modal-content {
  background-color: var(--ip-surface);
  color: var(--ip-ink);
  border-color: var(--ip-border);
}
.offcanvas-header,
.modal-header,
.modal-footer {
  border-color: var(--ip-border);
}
.ip-drawer-wide {
  width: 520px !important;
  max-width: 100vw;
}
.ip-drawer-xl {
  width: 780px !important;
  max-width: 100vw;
}

/* Print Styles (§8.2, §11) */
.ip-print-only {
  display: none;
}
@media print {
  body {
    background: #FFFFFF !important;
    color: #000000 !important;
  }
  .ip-sidebar,
  .ip-topbar,
  .ip-page-actions,
  .ip-filter-bar,
  .ip-no-print,
  .ip-ai-panel,
  .ip-toast-container,
  .modal-footer,
  .btn {
    display: none !important;
  }
  .ip-main-wrap {
    margin-left: 0 !important;
  }
  .ip-content {
    padding: 0 !important;
    max-width: 100% !important;
  }
  .ip-print-only {
    display: block !important;
  }
  .ip-card, .card {
    box-shadow: none !important;
    border: 1px solid #CCCCCC !important;
  }
}


/**
 * @owner CORE

 */

/* ================================================================

   ================================================================ */
html { scroll-padding-top: calc(var(--ip-topbar-height) + 12px); }

pre, code, .text-break, .ip-page-subtitle { overflow-wrap: anywhere; }
.table-responsive, .ip-table-wrap { max-width: 100%; -webkit-overflow-scrolling: touch; }

/* AI chatbot floating window */
.ip-chatbot-root { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 2080; font-family: var(--ip-font-sans); color: var(--ip-ink); }
.ip-chatbot-toggle { position: relative; display: inline-flex; align-items: center; gap: 9px; min-height: 52px; padding: 0 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: var(--ip-sidebar); color: #fff; font: 700 .92rem var(--ip-font-sans); box-shadow: 0 10px 28px rgba(4,25,21,.27); cursor: pointer; transition: transform var(--ip-transition), box-shadow var(--ip-transition); }
.ip-chatbot-toggle:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(4,25,21,.32); }
.ip-chatbot-toggle-icon { font-size: 1.2rem; color: var(--ip-accent); }
.ip-chatbot-toggle-pulse { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #47CD89; top: 8px; right: 10px; border: 2px solid var(--ip-sidebar); }
.ip-chatbot-panel { width: min(420px, calc(100vw - 32px)); height: min(680px, calc(100dvh - 112px)); min-height: 390px; margin-bottom: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--ip-border); border-radius: 18px; background: var(--ip-surface); box-shadow: 0 18px 60px rgba(0,0,0,.22); }
.ip-chatbot-panel[hidden] { display: none !important; }
.ip-chatbot-head { display: flex; align-items: center; gap: 10px; padding: 15px; background: var(--ip-sidebar); color: #fff; flex-shrink: 0; }
.ip-chatbot-brand-mark { width: 38px; height: 38px; display: grid; place-items: center; flex-shrink: 0; border-radius: 12px; background: rgba(232,180,74,.16); color: var(--ip-accent); font-size: 1.2rem; }
.ip-chatbot-title-wrap { display: flex; flex: 1; flex-direction: column; min-width: 0; gap: 2px; }
.ip-chatbot-title-wrap strong { font-size: .98rem; }
.ip-chatbot-title-wrap span { color: #BFD0CA; font-size: .73rem; }
.ip-chatbot-status-dot { width: 6px; height: 6px; display: inline-block; margin-right: 4px; border-radius: 50%; background: #47CD89; }
.ip-chatbot-head-btn { width: 34px; height: 34px; display: grid; place-items: center; flex-shrink: 0; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; background: rgba(255,255,255,.06); color: #fff; cursor: pointer; }
.ip-chatbot-head-btn:hover { background: rgba(255,255,255,.15); }
.ip-chatbot-context { padding: 8px 14px; border-bottom: 1px solid var(--ip-border); background: var(--ip-surface-raised); font-size: .74rem; color: var(--ip-muted); }
.ip-chatbot-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 15px 13px; display: flex; flex-direction: column; gap: 13px; overscroll-behavior: contain; }
.ip-chat-message { display: flex; align-items: flex-start; gap: 8px; max-width: 100%; }
.ip-chat-message.is-user { justify-content: flex-end; }
.ip-chat-avatar { width: 28px; height: 28px; display: grid; place-items: center; flex-shrink: 0; border-radius: 9px; background: var(--ip-primary-tint); color: var(--ip-primary); font-size: .82rem; }
.ip-chat-bubble { max-width: calc(100% - 36px); padding: 10px 12px; border: 1px solid var(--ip-border); border-radius: 4px 13px 13px 13px; background: var(--ip-surface-raised); color: var(--ip-ink); font-size: .84rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.ip-chat-message.is-user .ip-chat-bubble { border-color: var(--ip-primary); border-radius: 13px 4px 13px 13px; background: var(--ip-primary); color: var(--ip-primary-ink); }
.ip-chatbot-suggestions { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 13px 11px; }
.ip-chatbot-suggestions button { max-width: 100%; padding: 6px 9px; border: 1px solid var(--ip-border-strong); border-radius: 999px; background: var(--ip-surface); color: var(--ip-ink); font: 500 .73rem var(--ip-font-sans); text-align: left; cursor: pointer; }
.ip-chatbot-suggestions button:hover { border-color: var(--ip-primary); background: var(--ip-primary-tint); color: var(--ip-primary); }
.ip-chatbot-composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px; border-top: 1px solid var(--ip-border); background: var(--ip-surface); }
.ip-chatbot-composer textarea { flex: 1; min-width: 0; max-height: 110px; resize: none; padding: 10px 11px; border: 1px solid var(--ip-border-strong); border-radius: 12px; outline: none; background: var(--ip-surface-raised); color: var(--ip-ink); font: 400 .85rem/1.45 var(--ip-font-sans); }
.ip-chatbot-composer textarea:focus { border-color: var(--ip-primary); box-shadow: 0 0 0 3px var(--ip-primary-tint); }
.ip-chatbot-composer button { width: 42px; height: 42px; display: grid; place-items: center; flex-shrink: 0; border: 0; border-radius: 12px; background: var(--ip-primary); color: #fff; cursor: pointer; }
.ip-chatbot-composer button:disabled { opacity: .55; cursor: wait; }
.ip-chatbot-foot { padding: 0 12px 10px; color: var(--ip-muted); font-size: .67rem; line-height: 1.4; }
.ip-chatbot-typing { color: var(--ip-muted); font-style: italic; }

      const target = document.querySelector(str);
      if (target) target.scrollIntoView({ behavior: 'smooth' });
      return;
    }
    const hashParts = str.split('#');
    const qParts = hashParts[0].split('?');
    const fileName = qParts[0].split('/').pop() || 'manager-receivable-dashboard.html';
    const meta = FILE_TO_META[fileName] || FILE_TO_META['404.html'];

    window.__IP_VIRTUAL_PATH = '/' + fileName;

    if (!o.strictRole && meta.autoRole && window.IP && window.IP.Auth) {
      const sess = window.IP.Auth.getSession();
      const allowedList = meta.roles.split(',');
      if (!sess || !allowedList.includes(sess.role)) {
        window.IP.Auth.switchRole(meta.autoRole, false);
        if (window.IP.UI && window.IP.UI.toast) {

          });
        }
      }
    }

    const oldShell = document.querySelector('.ip-app-shell');
    let mainEl = document.getElementById('main-content');
    if (oldShell && mainEl) {
      oldShell.parentNode.insertBefore(mainEl, oldShell);
      oldShell.remove();
    }
    if (!mainEl) {

      document.body.appendChild(mainEl);

      return;
    }

/**
 * @owner CORE
 * @spec §2.6, §2.11, §10.4 Utilities, Bilingual (VI/EN) Engine & Daily USD/VND Exchange Rate (IP.Utils, IP.I18n, IP.Fmt)
 */
(function (window) {
  'use strict';
  const IP = (window.IP = window.IP || {});

  const LANG_KEY = 'invoicepilot.lang.v2';
  const FX_DATE_KEY = 'invoicepilot.fxdate.v2';
  // Reference rate anchored on Vietcombank & State Bank of Vietnam USD/VND rate (25,610 - 26,020 VND/USD, mid 25,815)
  const BASE_USD_VND_RATE = 25815;

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function uid(prefix) {
    const p = prefix || 'id';
    const rand = Math.random().toString(36).substring(2, 7);
    const ts = Date.now().toString(36).slice(-4);
    return p + '_' + ts + rand;
  }

  function debounce(fn, wait) {
    let t = null;
    return function () {
      const ctx = this;
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait || 200);
    };
  }

  function getQueryParams() {
    const params = {};
    const search = window.location.search || '';
    const usp = new URLSearchParams(search);
    usp.forEach(function (val, key) {
      params[key] = val;
    });
    return params;
  }

  function setQueryParams(updates, replace) {
    const usp = new URLSearchParams(window.location.search || '');
    Object.keys(updates || {}).forEach(function (k) {
      const v = updates[k];
      if (v === null || v === undefined || v === '') {
        usp.delete(k);
      } else {
        usp.set(k, String(v));
      }
    });
    const qs = usp.toString();
    const newUrl = window.location.pathname + (qs ? '?' + qs : '') + (window.location.hash || '');
    try {
      if (replace !== false && window.history && window.history.replaceState) {
        window.history.replaceState(null, '', newUrl);
      } else if (window.history && window.history.pushState) {
        window.history.pushState(null, '', newUrl);
      }
    } catch (e) {}
  }

  // =========================================================================
  // Language & Daily USD/VND Exchange Rate Engine (IP.I18n)
  // =========================================================================
  function getLang() {
    try {
      const saved = window.localStorage.getItem(LANG_KEY);
      return saved === 'en' ? 'en' : 'vi';
    } catch (e) {
      return 'vi';
    }
  }

  function getSelectedRateDate() {
    try {
      const saved = window.localStorage.getItem(FX_DATE_KEY);
      if (saved && /^\d{4}-\d{2}-\d{2}$/.test(saved)) return saved;
    } catch (e) {}
    return (IP.Seed && typeof IP.Seed.todayISO === 'function')
      ? IP.Seed.todayISO()
      : new Date().toISOString().slice(0, 10);
  }

  function setSelectedRateDate(dateISO) {
    const clean = String(dateISO || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(clean)) return;
    try {
      window.localStorage.setItem(FX_DATE_KEY, clean);
    } catch (e) {}
    window.dispatchEvent(new CustomEvent('ip:langchange', {
      detail: { lang: getLang(), fxDate: clean, rate: getExchangeRateForDate(clean) }
    }));
  }

  /**
   * Computes a deterministic daily USD/VND exchange rate for any calendar date YYYY-MM-DD.
   * Each date has its own realistic Vietcombank/SBV market rate between 25,460 and 26,020 VND/USD.
   */
  function getExchangeRateForDate(dateISO) {
    const targetDate = (dateISO && /^\d{4}-\d{2}-\d{2}/.test(String(dateISO)))
      ? String(dateISO).slice(0, 10)
      : getSelectedRateDate();

    const parts = targetDate.split('-');
    const y = Number(parts[0] || 2026);
    const m = Number(parts[1] || 10);
    const d = Number(parts[2] || 24);
    const daySeed = y * 372 + m * 31 + d;
    const wave1 = Math.sin(daySeed * 0.43) * 145;
    const wave2 = Math.cos(daySeed * 0.19) * 65;
    const rawRate = BASE_USD_VND_RATE + Math.round(wave1 + wave2);
    // Round to nearest 5 VND like commercial bank FX boards
    return Math.round(rawRate / 5) * 5;
  }

  function getDailyRateTable(daysCount) {
    const count = Number(daysCount || 14);
    const baseToday = (IP.Seed && typeof IP.Seed.todayISO === 'function')
      ? IP.Seed.todayISO()
      : new Date().toISOString().slice(0, 10);
    const rows = [];
    for (let i = 0; i < count; i++) {
      const dateStr = (IP.Seed && typeof IP.Seed.addDays === 'function')
        ? IP.Seed.addDays(-i, baseToday)
        : baseToday;
      const rate = getExchangeRateForDate(dateStr);
      const prevDate = (IP.Seed && typeof IP.Seed.addDays === 'function')
        ? IP.Seed.addDays(-(i + 1), baseToday)
        : baseToday;
      const prevRate = getExchangeRateForDate(prevDate);
      rows.push({
        date: dateStr,
        buyTransfer: rate - 190,
        midRate: rate,
        sellRate: rate + 205,
        delta: rate - prevRate
      });
    }
    return rows;
  }

  function formatNumberVND(n) {
    const num = Math.round(Number(n || 0));
    const sign = num < 0 ? '-' : '';
    const abs = Math.abs(num);
    return sign + String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function formatNumberEN(n, decimals) {
    const dec = decimals !== undefined ? decimals : 0;
    const num = Number(n || 0);
    return num.toLocaleString('en-US', {
      minimumFractionDigits: dec,
      maximumFractionDigits: dec
    });
  }

  function formatNumber(n) {
    if (getLang() === 'en') {
      return formatNumberEN(Math.round(Number(n || 0)), 0);
    }
    return formatNumberVND(n);
  }

  function convertVNDToUSD(amountVND, dateISO) {
    const rate = getExchangeRateForDate(dateISO);
    return Number(amountVND || 0) / (rate || BASE_USD_VND_RATE);
  }

  function formatCurrency(amount, compact, dateISO) {
    const num = Math.round(Number(amount || 0));
    const lang = getLang();

    if (lang === 'en') {
      const rate = getExchangeRateForDate(dateISO);
      const usd = num / rate;
      const absUsd = Math.abs(usd);
      const sign = usd < 0 ? '-' : '';
      if (compact) {
        if (absUsd >= 1000000) {
          return sign + '$' + (absUsd / 1000000).toFixed(2) + 'M';
        }
        if (absUsd >= 1000) {
          return sign + '$' + (absUsd / 1000).toFixed(1) + 'K';
        }
      }
      return sign + '$' + formatNumberEN(absUsd, 2);
    }

    if (compact) {
      const abs = Math.abs(num);
      const sign = num < 0 ? '-' : '';
      if (abs >= 1000000000) {
        return sign + (abs / 1000000000).toFixed(2).replace('.', ',') + '\u00A0tỷ\u00A0₫';
      }
      if (abs >= 1000000) {
        return sign + (abs / 1000000).toFixed(1).replace(',0', '').replace('.', ',') + '\u00A0tr\u00A0₫';
      }
    }
    return formatNumberVND(num) + '\u00A0₫';
  }

  function formatPercent(val) {
    const num = Number(val || 0);
    const rounded = Math.round(num * 10) / 10;
    if (getLang() === 'en') {
      return rounded.toString() + '%';
    }
    return rounded.toString().replace('.', ',') + '%';
  }

  function formatDate(iso) {
    if (!iso) return '—';
    const clean = String(iso).slice(0, 10);
    const parts = clean.split('-');
    if (parts.length !== 3) return escapeHtml(iso);
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function formatDateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return formatDate(iso);
    const pad = function (x) { return String(x).padStart(2, '0'); };
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatRelative(iso) {
    const isEn = getLang() === 'en';
    if (!iso) return isEn ? 'None' : 'Chưa có';
    const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso);
    if (isNaN(d.getTime())) return formatDate(iso);
    const diffMs = Date.now() - d.getTime();
    const diffMin = Math.round(diffMs / 60000);
    if (diffMin < 1 && diffMin > -1) return isEn ? 'Just now' : 'Vừa xong';
    if (diffMin > 0) {
      if (diffMin < 60) return isEn ? (diffMin + ' mins ago') : (diffMin + ' phút trước');
      const diffHours = Math.round(diffMin / 60);
      if (diffHours < 24) return isEn ? (diffHours + ' hours ago') : (diffHours + ' giờ trước');
      const diffDays = Math.round(diffHours / 24);
      if (diffDays <= 30) return isEn ? (diffDays + ' days ago') : (diffDays + ' ngày trước');
      return formatDate(iso);
    } else {
      const futureDays = Math.round(Math.abs(diffMin) / (60 * 24));
      if (futureDays === 0) return isEn ? 'Due today' : 'Trong hôm nay';
      return isEn ? ('In ' + futureDays + ' days') : ('Còn ' + futureDays + ' ngày');
    }
  }

  /**
   * Converts inline VND strings inside descriptive text (e.g., "66.960.000 ₫" or "1,48 tỷ ₫")
   * into USD using the daily rate when language is 'en'.
   */
  function convertInlineVNDInText(str, dateISO) {
    if (!str || getLang() !== 'en') return str;
    const rate = getExchangeRateForDate(dateISO);
    let out = String(str);

    // Match compact "1,48 tỷ ₫" or "412 tr ₫"
    out = out.replace(/(-?\d+(?:[.,]\d+)?)\s*tỷ\s*₫/gi, function (_, numStr) {
      const valVnd = parseFloat(numStr.replace(',', '.')) * 1000000000;
      const usd = valVnd / rate;
      return '$' + (usd >= 1000000 ? (usd / 1000000).toFixed(2) + 'M' : (usd / 1000).toFixed(1) + 'K');
    });
    out = out.replace(/(-?\d+(?:[.,]\d+)?)\s*tr(?:iệu)?\s*₫/gi, function (_, numStr) {
      const valVnd = parseFloat(numStr.replace(',', '.')) * 1000000;
      const usd = valVnd / rate;
      return '$' + (usd >= 1000 ? (usd / 1000).toFixed(1) + 'K' : usd.toFixed(2));
    });
    // Match full "66.960.000 ₫"
    out = out.replace(/(-?\d{1,3}(?:\.\d{3})+)\s*₫/g, function (_, numStr) {
      const rawVnd = Number(numStr.replace(/\./g, ''));
      if (isNaN(rawVnd)) return _;
      const usd = rawVnd / rate;
      return '$' + formatNumberEN(usd, 2);
    });
    return out;
  }

  function translateString(rawStr, dateISO) {
    if (!rawStr || getLang() !== 'en') return rawStr;
    const trimmed = String(rawStr).trim();
    if (!trimmed) return rawStr;

    let result = String(rawStr);
    if (EXACT_DICT[trimmed]) {
      result = rawStr.replace(trimmed, EXACT_DICT[trimmed]);
      return convertInlineVNDInText(result, dateISO);
    }

    for (let i = 0; i < PHRASE_RULES.length; i++) {
      result = result.replace(PHRASE_RULES[i][0], PHRASE_RULES[i][1]);
    }

    // Replace remaining exact keys if they appear as substrings after separators
    Object.keys(EXACT_DICT).forEach(function (k) {
      if (k.length >= 6 && result.includes(k)) {
        result = result.split(k).join(EXACT_DICT[k]);
      }
    });

    return convertInlineVNDInText(result, dateISO);
  }

  /**
   * Extracts a contextual ISO date (YYYY-MM-DD) from a table row or element if present
   * so that each invoice/payment row converts USD using its own issue/payment date!
   */
  function extractRowDateISO(el) {
    if (!el || !el.closest) return null;
    const row = el.closest('tr, .acc-tx-item, .acc-match-card, .lnd-slide-card, [data-fx-date]');
    if (!row) return null;
    if (row.getAttribute && row.getAttribute('data-fx-date')) {
      return row.getAttribute('data-fx-date');
    }
    const text = row.textContent || '';
    const m = text.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
    if (m) {
      return m[3] + '-' + m[2] + '-' + m[1];
    }
    return null;
  }

  let _isTranslatingDOM = false;

  function translateDOM(rootEl) {
    if (_isTranslatingDOM) return;
    const lang = getLang();
    document.documentElement.setAttribute('lang', lang);
    if (lang !== 'en') return;

    const target = rootEl || document.body;
    if (!target) return;

    _isTranslatingDOM = true;
    try {
      // 1. Translate attributes (placeholder, title, aria-label, data-label)
      const attrEls = target.querySelectorAll('[placeholder], [title], [aria-label], [data-label]');
      attrEls.forEach(function (el) {
        ['placeholder', 'title', 'aria-label', 'data-label'].forEach(function (attr) {
          const val = el.getAttribute(attr);
          if (val) {
            const tr = translateString(val);
            if (tr !== val) el.setAttribute(attr, tr);
          }
        });
      });

      // 2. Walk text nodes and translate + apply row-specific daily USD exchange rate
      const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT, null, false);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) {
        const parentTag = n.parentNode ? n.parentNode.tagName : '';
        if (parentTag === 'SCRIPT' || parentTag === 'STYLE' || parentTag === 'CODE') continue;
        if (n.nodeValue && n.nodeValue.trim()) {
          nodes.push(n);
        }
      }

      nodes.forEach(function (textNode) {

        });
      }
      DB._commit();
      return DB.ok(record);
    },

    updateCustomer: function (id, patch) {
      const st = DB._rawState();
      const idx = st.customers.findIndex(function (c) { return c.id === id; });
      if (idx < 0) return DB.err('NOT_FOUND', 'Không tìm thấy khách hàng cần cập nhật.');
      const cur = st.customers[idx];
      const p = patch || {};

      const name = p.name !== undefined ? String(p.name).trim() : cur.name;
      const contactName = p.contactName !== undefined ? String(p.contactName).trim() : cur.contactName;
      const email = p.email !== undefined ? String(p.email).trim() : cur.email;
      const phone = p.phone !== undefined ? String(p.phone).trim() : cur.phone;
      const taxCode = p.taxCode !== undefined ? String(p.taxCode).trim() : cur.taxCode;
      const code = p.code !== undefined ? String(p.code).trim().toUpperCase() : cur.code;

      if (!name) return DB.err('VALIDATION', 'Tên doanh nghiệp không được để trống.', 'name');
      if (!contactName) return DB.err('VALIDATION', 'Người liên hệ không được để trống.', 'contactName');
      if (!email || !IP.Utils.isValidEmail(email)) return DB.err('VALIDATION', 'Email không đúng định dạng.', 'email');
      if (phone && !IP.Utils.isValidPhone(phone)) return DB.err('VALIDATION', 'Số điện thoại không hợp lệ.', 'phone');
      if (taxCode && !IP.Utils.isValidTaxCode(taxCode)) return DB.err('VALIDATION', 'Mã số thuế phải gồm 10 hoặc 13 chữ số.', 'taxCode');

      if (st.customers.some(function (c) { return c.id !== id && c.code.toLowerCase() === code.toLowerCase(); })) {
        return DB.err('DUPLICATE_CODE', 'Mã khách hàng "' + code + '" đã được sử dụng.', 'code');
      }
      if (taxCode && st.customers.some(function (c) { return c.id !== id && c.taxCode === taxCode; })) {
        return DB.err('DUPLICATE_CODE', 'Mã số thuế "' + taxCode + '" đã tồn tại.', 'taxCode');
      }
      if (st.customers.some(function (c) { return c.id !== id && c.email.toLowerCase() === email.toLowerCase(); })) {
        return DB.err('DUPLICATE_CODE', 'Email "' + email + '" đã tồn tại.', 'email');
      }

      const termDays = p.paymentTermDays !== undefined ? Number(p.paymentTermDays) : cur.paymentTermDays;
      if (isNaN(termDays) || termDays < 0 || termDays > 90) {
        return DB.err('VALIDATION', 'Số ngày hạn thanh toán phải từ 0 đến 90 ngày.', 'paymentTermDays');
      }
      const creditLimit = p.creditLimit !== undefined ? Number(p.creditLimit) : cur.creditLimit;
      if (isNaN(creditLimit) || creditLimit < 0) {
        return DB.err('VALIDATION', 'Hạn mức tín dụng không hợp lệ.', 'creditLimit');
      }

      Object.assign(cur, p, {
        name: name,
        code: code,
        contactName: contactName,
        email: email,
        phone: phone,
        taxCode: taxCode,
        paymentTermDays: Math.round(termDays),
        creditLimit: Math.round(creditLimit),
        updatedAt: new Date().toISOString()
      });

      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'customer',
          entityId: cur.id,
          type: 'update',
          message: 'Đã cập nhật thông tin khách hàng ' + cur.name + '.'
        });
      }
      DB._commit();
      return DB.ok(cur);
    },

    archiveCustomer: function (id) {
      const st = DB._rawState();
      const cus = st.customers.find(function (c) { return c.id === id; });
      if (!cus) return DB.err('NOT_FOUND', 'Không tìm thấy khách hàng.');

      const outstanding = computeCustomerOutstanding(st, id);
      if (outstanding > 0) {
        return DB.err(
          'CUSTOMER_HAS_BALANCE',
          'Không thể lưu trữ khách hàng "' + cus.name + '" vì đang còn dư nợ chưa thu ' + IP.Fmt.currency(outstanding) + '. Vui lòng tất toán các hóa đơn mở trước.'
        );
      }

      cus.status = 'archived';
      cus.updatedAt = new Date().toISOString();
      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'customer',
          entityId: cus.id,
          type: 'archive',
          message: 'Đã lưu trữ khách hàng ' + cus.name + ' (' + cus.code + ').'
        });
      }
      DB._commit();
      return DB.ok(cus);
    },

    unarchiveCustomer: function (id) {
      const st = DB._rawState();
      const cus = st.customers.find(function (c) { return c.id === id; });
      if (!cus) return DB.err('NOT_FOUND', 'Không tìm thấy khách hàng.');
      cus.status = 'active';
      cus.updatedAt = new Date().toISOString();
      DB._commit();
      return DB.ok(cus);
    }
  });
})(window);

(function (window) {

    const st = DB._rawState();

  }

  DB.extend('users', {
    listUsers: function (filter) {
      const f = filter || {};
      const st = DB._rawState();
      let list = st.users.slice();
      if (f.role && f.role !== 'all') {
        list = list.filter(function (u) { return u.role === f.role; });
      }
      if (f.status && f.status !== 'all') {
        list = list.filter(function (u) { return u.status === f.status; });
      }
      if (f.q) {
        const q = String(f.q).trim().toLowerCase();
        list = list.filter(function (u) {

    inviteUser: function (data) {

      }
      if (st.users.some(function (u) { return u.email.toLowerCase() === email; })) {

          message: 'Đã gửi lại thông tin kích hoạt tài khoản cho ' + u.email + '.'
        });
      }
      DB._commit();
      return DB.ok(u);
    },

    updateUser: function (id, patch) {
      const st = DB._rawState();
      const u = st.users.find(function (x) { return x.id === id; });
      if (!u) return DB.err('NOT_FOUND', 'Không tìm thấy tài khoản người dùng.');
      const p = patch || {};
      const actorId = DB.currentActorId();
      const isAdmin = isCurrentActorAdmin();

      // Non-admin can only edit their own basic profile (not other users and not roles)
      if (!isAdmin && u.id !== actorId) {
        return DB.err('FORBIDDEN_NOT_ADMIN', 'Chỉ Quản trị viên (Admin) mới được phép điều chỉnh tài khoản của nhân sự khác.');
      }
      if (!isAdmin && p.role && p.role !== u.role) {
        return DB.err('FORBIDDEN_NOT_ADMIN', 'Chỉ Quản trị viên (Admin) mới được phép thay đổi phân quyền nghiệp vụ.');
      }

      if (p.role && p.role !== u.role) {
        if (u.id === actorId) {
          return DB.err('SELF_ACTION_FORBIDDEN', 'Bạn không thể tự hạ quyền hoặc đổi vai trò của chính tài khoản đang đăng nhập.', 'role');
        }
        if (u.role === 'admin' && u.status === 'active') {
          const activeAdmins = st.users.filter(function (x) { return x.role === 'admin' && x.status === 'active'; });
          if (activeAdmins.length <= 1) {
            return DB.err('LAST_ACTIVE_ADMIN', 'Hệ thống phải duy trì ít nhất 1 Quản trị viên đang hoạt động.', 'role');
          }
        }
      }

      if (p.email !== undefined && String(p.email).trim().toLowerCase() !== u.email.toLowerCase()) {
        if (!isAdmin) {
          return DB.err('FORBIDDEN_NOT_ADMIN', 'Chỉ Quản trị viên mới được phép điều chỉnh email đăng nhập.', 'email');
        }
        const nextEmail = String(p.email).trim().toLowerCase();
        if (!IP.Utils.isValidEmail(nextEmail)) {
          return DB.err('VALIDATION', 'Email mới không đúng định dạng.', 'email');
        }
        if (st.users.some(function (other) { return other.id !== id && other.email.toLowerCase() === nextEmail; })) {
          return DB.err('DUPLICATE_CODE', 'Email "' + nextEmail + '" đã được gán cho tài khoản khác.', 'email');
        }
        u.email = nextEmail;
      }

      if (p.password !== undefined && String(p.password).trim() !== '') {
        if (!isAdmin && u.id !== actorId) {
          return DB.err('FORBIDDEN_NOT_ADMIN', 'Chỉ Quản trị viên mới được đặt lại mật khẩu của tài khoản khác.', 'password');

      const name = p.name !== undefined ? String(p.name).trim() : u.name;

      if (idx < 0) return DB.err('NOT_FOUND', 'Không tìm thấy tài khoản cần xóa.');
      const u = st.users[idx];

      if (u.id === actorId) {
        return DB.err('SELF_ACTION_FORBIDDEN', 'Bạn không thể tự xóa tài khoản Quản trị viên đang đăng nhập của chính mình.');

        }

          type: 'delete',
          message: 'Quản trị viên đã xóa tài khoản ' + u.name + ' (' + u.email + ').'

      const permErr = requireAdminPermission();
      if (permErr) return permErr;

      const st = DB._rawState();
      const u = st.users.find(function (x) { return x.id === id; });
      if (!u) return DB.err('NOT_FOUND', 'Không tìm thấy tài khoản người dùng.');

      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'user',
          entityId: u.id,

        return DB.err('VALIDATION', 'Mật khẩu hiện tại không chính xác.', 'currentPassword');

      }
      u.password = String(newPassword);
      u.updatedAt = new Date().toISOString();
      DB._commit();
      return DB.ok(u);

        }
        Object.assign(cur.company, c);
      }

      if (p.invoiceDefaults) {

        }
        const nextNum = Number(d.nextNumber !== undefined ? d.nextNumber : cur.invoiceDefaults.nextNumber);
        if (isNaN(nextNum) || nextNum < 1) {
          return DB.err('VALIDATION', 'Số thứ tự bắt đầu tiếp theo phải lớn hơn 0.', 'invoiceDefaults.nextNumber');
        }
        const termDays = Number(d.defaultTermDays !== undefined ? d.defaultTermDays : cur.invoiceDefaults.defaultTermDays);
        if (isNaN(termDays) || termDays < 1 || termDays > 365) {
          return DB.err('VALIDATION', 'Số ngày hạn thanh toán mặc định phải từ 1 đến 365 ngày.', 'invoiceDefaults.defaultTermDays');
        }

      if (!body) return DB.err('VALIDATION', 'Nội dung mẫu nhắc không được để trống.', 'body');

(function (window) {

    const d = defaults || { prefix: 'IP', format: 'IP-{YYYY}-{0000}', nextNumber: 53 };
    const year = new Date().getFullYear();

    }
    let subtotal = 0;
    let discountTotal = 0;
    let vatTotal = 0;
    const items = [];

    for (let i = 0; i < rawItems.length; i++) {
      const r = rawItems[i] || {};
      const desc = String(r.description || '').trim();
      const qty = Number(r.quantity);
      const price = Number(r.unitPrice);
      const disc = Number(r.discountPercent || 0);
      const vat = Number(r.vatRate !== undefined ? r.vatRate : 10);

      if (!desc) {
        return { ok: false, error: { code: 'VALIDATION', message: 'Dòng hàng thứ ' + (i + 1) + ' thiếu mô tả hàng hóa/dịch vụ.', field: 'items' } };
      }
      if (isNaN(qty) || qty <= 0) {
        return { ok: false, error: { code: 'VALIDATION', message: 'Số lượng ở dòng thứ ' + (i + 1) + ' phải lớn hơn 0.', field: 'items' } };
      }
      if (isNaN(price) || price < 0) {
        return { ok: false, error: { code: 'VALIDATION', message: 'Đơn giá ở dòng thứ ' + (i + 1) + ' không hợp lệ.', field: 'items' } };
      }
      if (isNaN(disc) || disc < 0 || disc > 100) {
        return { ok: false, error: { code: 'VALIDATION', message: 'Chiết khấu (%) ở dòng thứ ' + (i + 1) + ' phải từ 0 đến 100%.', field: 'items' } };
      }

      }

      const gross = Math.round(qty * price);
      const discAmt = Math.round((gross * disc) / 100);
      const afterDisc = gross - discAmt;
      const vatAmt = Math.round((afterDisc * vat) / 100);
      const lineTotal = afterDisc + vatAmt;

      subtotal += gross;
      discountTotal += discAmt;
      vatTotal += vatAmt;

        id: r.id || IP.Utils.uid('itm'),
        description: desc,
        quantity: qty,
        unit: String(r.unit || 'Gói').trim(),

        vatRate: vat,

      const d = data || {};
      const inv = st.invoices.find(function (x) { return x.id === d.invoiceId; });
      if (!inv) return DB.err('NOT_FOUND', 'Không tìm thấy hóa đơn cần ghi nhận thanh toán.', 'invoiceId');
      if (inv.voided) return DB.err('INVOICE_VOIDED', 'Hóa đơn đã hủy không nhận thêm thanh toán.', 'invoiceId');
      if (inv.archived) return DB.err('VALIDATION', 'Hóa đơn đã lưu trữ không thể ghi nhận thanh toán.', 'invoiceId');

      const remaining = Math.max(0, Number(inv.total || 0) - Number(inv.paidAmount || 0));
      const amount = Math.round(Number(d.amount || 0));
      if (isNaN(amount) || amount <= 0) {
        return DB.err('VALIDATION', 'Số tiền thanh toán phải lớn hơn 0 ₫.', 'amount');
      }
      if (amount > remaining) {
        return DB.err('PAYMENT_EXCEEDS_REMAINING', 'Số tiền thu (' + IP.Fmt.currency(amount) + ') không được vượt quá số còn phải thu (' + IP.Fmt.currency(remaining) + ').', 'amount');
      }

      const today = IP.Seed.todayISO();
      const paidAt = String(d.paidAt || today).slice(0, 10);
      if (paidAt > today) {
        return DB.err('PAYMENT_DATE_INVALID', 'Ngày nhận thanh toán không được ở tương lai.', 'paidAt');
      }
      if (paidAt < inv.issueDate) {
        return DB.err('PAYMENT_DATE_INVALID', 'Ngày nhận thanh toán không được trước ngày phát hành hóa đơn (' + IP.Fmt.date(inv.issueDate) + ').', 'paidAt');
      }

      if (!inv.sentAt) {
        inv.sentAt = new Date().toISOString();
      }

      const payment = {
        id: IP.Utils.uid('pay'),
        source: d.source || 'manual',
        invoiceId: inv.id,
        suggestedCustomerId: inv.customerId,
        customerId: inv.customerId,
        amount: amount,
        allocatedAmount: amount,
        method: ['transfer', 'cash', 'ewallet'].includes(d.method) ? d.method : 'transfer',
        reference: String(d.reference || ('PT-' + Date.now().toString().slice(-6))).trim(),
        transferContent: String(d.transferContent || ('Thanh toan HD ' + inv.number)).trim(),
        paidAt: paidAt,
        status: 'confirmed',
        discrepancy: false,
        discrepancyNote: '',
        note: String(d.note || '').trim(),
        reconciledAt: new Date().toISOString()
      };

      st.payments.unshift(payment);
      DB.recomputePaid(inv.id);

      const cus = DB.getCustomer(inv.customerId);
      const cusName = cus ? cus.name : inv.customerId;

      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'invoice',
          entityId: inv.id,
          type: 'payment',
          message: 'Đã ghi nhận thanh toán ' + IP.Fmt.currency(amount) + ' cho hóa đơn ' + inv.number + ' (' + IP.Fmt.methodLabel(payment.method) + ').'
        });
      }
      if (DB.addNotification) {
        DB.addNotification({
          role: 'all',
          type: 'payment',
          title: 'Đã thu ' + IP.Fmt.currency(amount) + ' · ' + inv.number,
          message: 'Khách hàng ' + cusName + ' đã thanh toán qua ' + IP.Fmt.methodLabel(payment.method) + '.',
          targetRouteKey: 'invoice.view',
          targetParams: { id: inv.id }
        });
      }

      DB._commit();
      return DB.ok({ payment: payment, invoice: inv });
    },

    reconcilePayment: function (id, invoiceId, allocatedAmount, note) {
      const st = DB._rawState();
      const pay = st.payments.find(function (p) { return p.id === id; });
      if (!pay) return DB.err('NOT_FOUND', 'Không tìm thấy giao dịch ngân hàng.');
      const inv = st.invoices.find(function (x) { return x.id === invoiceId; });
      if (!inv) return DB.err('NOT_FOUND', 'Vui lòng chọn hóa đơn cần đối chiếu.', 'invoiceId');
      if (inv.voided || inv.archived) {
        return DB.err('VALIDATION', 'Không thể đối chiếu vào hóa đơn đã hủy hoặc đã lưu trữ.', 'invoiceId');
      }

      const remaining = Math.max(0, Number(inv.total || 0) - Number(inv.paidAmount || 0));
      const alloc = Math.round(Number(allocatedAmount !== undefined ? allocatedAmount : Math.min(pay.amount, remaining)));

      if (isNaN(alloc) || alloc <= 0) {
        return DB.err('VALIDATION', 'Số tiền phân bổ đối chiếu phải lớn hơn 0 ₫.', 'allocatedAmount');
      }
      if (alloc > remaining) {
        return DB.err('PAYMENT_EXCEEDS_REMAINING', 'Số tiền phân bổ (' + IP.Fmt.currency(alloc) + ') vượt quá số còn phải thu của hóa đơn (' + IP.Fmt.currency(remaining) + ').', 'allocatedAmount');
      }
      if (alloc > pay.amount) {
        return DB.err('VALIDATION', 'Số tiền phân bổ không được vượt quá giá trị giao dịch ngân hàng (' + IP.Fmt.currency(pay.amount) + ').', 'allocatedAmount');
      }

      const diff = Math.abs(pay.amount - alloc);
      if (diff > 0 && (!note || !String(note).trim())) {
        return DB.err('VALIDATION', 'Giao dịch có chênh lệch số tiền (' + IP.Fmt.currency(diff) + '), vui lòng nhập ghi chú giải trình trước khi xác nhận.', 'note');
      }

      if (!inv.sentAt) inv.sentAt = new Date().toISOString();

      pay.invoiceId = inv.id;
      pay.customerId = inv.customerId;
      pay.allocatedAmount = alloc;
      pay.status = 'confirmed';
      pay.discrepancy = false;
      pay.note = String(note || pay.note || 'Đã đối chiếu khớp với hóa đơn ' + inv.number).trim();
      pay.reconciledAt = new Date().toISOString();

      DB.recomputePaid(inv.id);

      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'invoice',
          entityId: inv.id,
          type: 'reconcile',
          message: 'Đã đối chiếu giao dịch ' + pay.reference + ' (' + IP.Fmt.currency(alloc) + ') vào hóa đơn ' + inv.number + '.'
        });
      }
      if (DB.addNotification) {
        DB.addNotification({
          role: 'all',
          type: 'payment',
          title: 'Đối chiếu thành công ' + pay.reference + ' → ' + inv.number,
          message: 'Đã khớp ' + IP.Fmt.currency(alloc) + ' vào hóa đơn ' + inv.number + '.',
          targetRouteKey: 'invoice.view',
          targetParams: { id: inv.id }
        });
      }

      DB._commit();
      return DB.ok({ payment: pay, invoice: inv });
    },

    unreconcilePayment: function (id) {
      const st = DB._rawState();
      const pay = st.payments.find(function (p) { return p.id === id; });
      if (!pay) return DB.err('NOT_FOUND', 'Không tìm thấy giao dịch cần hoàn tác.');
      if (pay.status !== 'confirmed') {
        return DB.err('VALIDATION', 'Chỉ có thể hoàn tác đối chiếu với giao dịch đã xác nhận.');
      }

      const oldInvoiceId = pay.invoiceId;
      pay.status = 'pending';
      pay.allocatedAmount = 0;
      pay.invoiceId = null;
      pay.reconciledAt = null;
      pay.note = 'Đã hoàn tác đối chiếu, chờ xử lý lại';

      if (oldInvoiceId) {
        DB.recomputePaid(oldInvoiceId);
      }

      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'invoice',
          entityId: oldInvoiceId || pay.id,
          type: 'unreconcile',
          message: 'Đã hoàn tác đối chiếu giao dịch ' + pay.reference + ', trả giao dịch về trạng thái Chờ đối chiếu.'
        });
      }
      if (DB.addNotification && oldInvoiceId) {
        DB.addNotification({
          role: 'all',
          type: 'payment',
          title: 'Hoàn tác đối chiếu giao dịch ' + pay.reference,
          message: 'Số đã thu của hóa đơn liên quan đã được tính lại.',
          targetRouteKey: 'invoice.view',
          targetParams: { id: oldInvoiceId }
        });
      }

      DB._commit();
      return DB.ok(pay);
    },

    markPaymentDiscrepancy: function (id, note) {
      const st = DB._rawState();
      const pay = st.payments.find(function (p) { return p.id === id; });
      if (!pay) return DB.err('NOT_FOUND', 'Không tìm thấy giao dịch.');
      const cleanNote = String(note || '').trim();
      if (!cleanNote) return DB.err('VALIDATION', 'Vui lòng nhập ghi chú mô tả sai lệch.', 'note');

      const oldInvoiceId = pay.invoiceId;
      pay.discrepancy = true;
      pay.discrepancyNote = cleanNote;
      pay.status = 'pending';
      pay.allocatedAmount = 0;
      if (oldInvoiceId) {
        pay.invoiceId = null;
        DB.recomputePaid(oldInvoiceId);
      }

      DB._commit();
      return DB.ok(pay);
    },

    rejectPayment: function (id, reason) {
      const st = DB._rawState();
      const pay = st.payments.find(function (p) { return p.id === id; });
      if (!pay) return DB.err('NOT_FOUND', 'Không tìm thấy giao dịch.');
      const cleanReason = String(reason || '').trim();
      if (!cleanReason) return DB.err('VALIDATION', 'Vui lòng nhập lý do từ chối giao dịch.', 'reason');

      const oldInvoiceId = pay.invoiceId;
      pay.status = 'rejected';
      pay.discrepancy = true;
      pay.discrepancyNote = cleanReason;
      pay.allocatedAmount = 0;
      pay.reconciledAt = new Date().toISOString();
      if (oldInvoiceId) {
        pay.invoiceId = null;
        DB.recomputePaid(oldInvoiceId);
      }

      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'payment',
          entityId: pay.id,
          type: 'reject',
          message: 'Đã từ chối giao dịch ngân hàng ' + pay.reference + '. Lý do: ' + cleanReason
        });
      }
      DB._commit();
      return DB.ok(pay);
    }
  });
})(window);


/**
 * @owner SV2
 * @spec §8.2, §10.1, §10.3, §10.4 Payment Reminders Domain API
 */
(function (window) {
  'use strict';
  const IP = window.IP;
  const DB = IP.DB;

  DB.extend('reminders', {
    listReminders: function (filter) {
      const f = filter || {};
      const st = DB._rawState();
      let list = st.reminders.slice();

      if (f.customerId && f.customerId !== 'all') {
        list = list.filter(function (r) { return r.customerId === f.customerId; });
      }
      if (f.invoiceId) {
        list = list.filter(function (r) { return Array.isArray(r.invoiceIds) && r.invoiceIds.includes(f.invoiceId); });
      }
      if (f.status && f.status !== 'all') {
        list = list.filter(function (r) { return r.status === f.status; });
      }
      if (f.channel && f.channel !== 'all') {
        list = list.filter(function (r) { return r.channel === f.channel; });
      }
      if (f.q) {
        const q = String(f.q).trim().toLowerCase();
        list = list.filter(function (r) {
          const cus = st.customers.find(function (c) { return c.id === r.customerId; });
          const cusName = cus ? cus.name.toLowerCase() : '';
          return cusName.includes(q) ||
            (r.subject && r.subject.toLowerCase().includes(q)) ||
            (r.body && r.body.toLowerCase().includes(q));
        });
      }
      return list;
    },

    getReminder: function (id) {
      if (!id) return null;
      const st = DB._rawState();
      return st.reminders.find(function (r) { return r.id === id; }) || null;
    },

    createReminder: function (data) {
      const st = DB._rawState();
      const d = data || {};
      const cus = st.customers.find(function (c) { return c.id === d.customerId; });
      if (!cus) return DB.err('VALIDATION', 'Vui lòng chọn khách hàng nhận thông báo nhắc.', 'customerId');

      const invoiceIds = Array.isArray(d.invoiceIds) ? d.invoiceIds.filter(Boolean) : [];
      if (invoiceIds.length === 0) {
        return DB.err('VALIDATION', 'Vui lòng chọn ít nhất 1 hóa đơn chưa tất toán để nhắc thanh toán.', 'invoiceIds');
      }

      const unpaidInvoices = invoiceIds
        .map(function (id) { return st.invoices.find(function (inv) { return inv.id === id; }); })
        .filter(function (inv) { return inv && !inv.voided && !inv.archived && (inv.total - inv.paidAmount) > 0; });

      if (unpaidInvoices.length === 0) {
        return DB.err('VALIDATION', 'Các hóa đơn đã chọn đều đã thanh toán đủ hoặc không còn dư nợ cần nhắc.', 'invoiceIds');
      }

      const channel = d.channel === 'sms' ? 'sms' : 'email';
      if (channel === 'email' && (!cus.email || !IP.Utils.isValidEmail(cus.email))) {
        return DB.err('VALIDATION', 'Khách hàng chưa có địa chỉ Email hợp lệ để gửi qua kênh Email.', 'channel');
      }

      const subject = String(d.subject || ('Nhắc thanh toán hóa đơn - ' + cus.name)).trim();
      if (subject.length > 120) {
        return DB.err('VALIDATION', 'Tiêu đề thông báo nhắc không được vượt quá 120 ký tự.', 'subject');
      }
      const body = String(d.body || '').trim();
      if (!body) {
        return DB.err('VALIDATION', 'Nội dung thông báo nhắc không được để trống.', 'body');
      }
      if (body.length > 2000) {
        return DB.err('VALIDATION', 'Nội dung thông báo nhắc không được vượt quá 2.000 ký tự.', 'body');
      }

      const mode = d.mode || d.status || 'draft';
      let scheduledAt = d.scheduledAt || null;
      let sentAt = null;
      let finalStatus = 'draft';

      if (mode === 'scheduled') {
        if (!scheduledAt) {
          return DB.err('VALIDATION', 'Vui lòng chọn thời gian hẹn gửi.', 'scheduledAt');
        }
        const schedDate = new Date(scheduledAt);
        if (isNaN(schedDate.getTime()) || schedDate.getTime() <= Date.now()) {
          return DB.err('VALIDATION', 'Thời gian hẹn gửi phải nằm ở tương lai.', 'scheduledAt');
        }
        finalStatus = 'scheduled';
        scheduledAt = schedDate.toISOString();
      } else if (mode === 'sent') {
        finalStatus = 'sent';
        sentAt = new Date().toISOString();
        scheduledAt = sentAt;
      }

      const nowIso = new Date().toISOString();
      const rem = {
        id: IP.Utils.uid('rem'),
        customerId: cus.id,
        invoiceIds: unpaidInvoices.map(function (i) { return i.id; }),
        channel: channel,
        tone: ['friendly', 'formal', 'firm'].includes(d.tone) ? d.tone : 'friendly',
        subject: subject,
        body: body,
        scheduledAt: scheduledAt,
        sentAt: sentAt,
        status: finalStatus,
        failReason: null,
        aiGenerated: Boolean(d.aiGenerated),
        createdBy: DB.currentActorId(),
        createdAt: nowIso,
        updatedAt: nowIso
      };

      st.reminders.unshift(rem);

      if (finalStatus === 'sent') {
        if (DB.addActivity) {
          rem.invoiceIds.forEach(function (invId) {
            DB.addActivity({
              entityType: 'invoice',
              entityId: invId,
              type: 'reminder',
              message: 'Đã gửi nhắc thanh toán (' + IP.Fmt.channelLabel(rem.channel) + ') tới ' + cus.name + '.'
            });
          });
        }
        if (DB.addNotification) {
          DB.addNotification({
            role: 'all',
            type: 'reminder',
            title: 'Đã gửi nhắc thanh toán cho ' + cus.name,
            message: rem.subject + ' (' + IP.Fmt.channelLabel(rem.channel) + ')',
            targetRouteKey: 'sales.reminders',
            targetParams: { open: rem.id }
          });
        }
      }

      DB._commit();
      return DB.ok(rem);
    },

    updateReminder: function (id, patch) {
      const st = DB._rawState();
      const rem = st.reminders.find(function (r) { return r.id === id; });
      if (!rem) return DB.err('NOT_FOUND', 'Không tìm thấy bản nhắc thanh toán.');
      const p = patch || {};

      if (p.subject !== undefined) {
        const sub = String(p.subject).trim();
        if (sub.length > 120) return DB.err('VALIDATION', 'Tiêu đề không được vượt quá 120 ký tự.', 'subject');
        rem.subject = sub;
      }
      if (p.body !== undefined) {
        const b = String(p.body).trim();
        if (!b || b.length > 2000) return DB.err('VALIDATION', 'Nội dung phải từ 1 đến 2.000 ký tự.', 'body');
        rem.body = b;
      }
      if (p.channel) rem.channel = p.channel;
      if (p.tone) rem.tone = p.tone;
      if (Array.isArray(p.invoiceIds) && p.invoiceIds.length > 0) rem.invoiceIds = p.invoiceIds;
      if (p.scheduledAt !== undefined) rem.scheduledAt = p.scheduledAt;
      if (p.status) rem.status = p.status;
      rem.updatedAt = new Date().toISOString();

      DB._commit();
      return DB.ok(rem);
    },

    sendReminder: function (id, forceFail) {
      const st = DB._rawState();
      const rem = st.reminders.find(function (r) { return r.id === id; });
      if (!rem) return DB.err('NOT_FOUND', 'Không tìm thấy bản nhắc cần gửi.');
      const cus = st.customers.find(function (c) { return c.id === rem.customerId; });

      const stillUnpaid = (rem.invoiceIds || []).some(function (invId) {
        const inv = st.invoices.find(function (x) { return x.id === invId; });
        return inv && !inv.voided && !inv.archived && (inv.total - inv.paidAmount) > 0;
      });
      if (!stillUnpaid) {
        return DB.err('VALIDATION', 'Tất cả hóa đơn trong bản nhắc này đã được thanh toán đủ, không cần gửi nhắc.');
      }

      if (forceFail) {
        rem.status = 'failed';
        rem.failReason = 'Cổng gửi tin doanh nghiệp báo gián đoạn kết nối tạm thời (Vui lòng bấm Gửi lại)';
        rem.updatedAt = new Date().toISOString();
        DB._commit();
        return DB.err('SEND_FAILED', rem.failReason);
      }

      rem.status = 'sent';
      rem.sentAt = new Date().toISOString();
      rem.failReason = null;
      rem.updatedAt = rem.sentAt;

      if (DB.addActivity) {
        (rem.invoiceIds || []).forEach(function (invId) {
          DB.addActivity({
            entityType: 'invoice',
            entityId: invId,
            type: 'reminder',
            message: 'Đã gửi thông báo nhắc thanh toán (' + IP.Fmt.channelLabel(rem.channel) + ') tới ' + (cus ? cus.name : rem.customerId) + '.'
          });
        });
      }
      if (DB.addNotification) {
        DB.addNotification({
          role: 'all',
          type: 'reminder',
          title: 'Đã gửi nhắc thanh toán · ' + (cus ? cus.name : ''),
          message: rem.subject,
          targetRouteKey: 'sales.reminders',
          targetParams: { open: rem.id }
        });
      }

      DB._commit();
      return DB.ok(rem);
    },

    cancelReminder: function (id) {
      const st = DB._rawState();
      const rem = st.reminders.find(function (r) { return r.id === id; });
      if (!rem) return DB.err('NOT_FOUND', 'Không tìm thấy bản nhắc.');
      rem.status = 'cancelled';
      rem.updatedAt = new Date().toISOString();
      DB._commit();
      return DB.ok(rem);
    },

    deleteReminder: function (id) {
      const st = DB._rawState();
      const idx = st.reminders.findIndex(function (r) { return r.id === id; });
      if (idx < 0) return DB.err('NOT_FOUND', 'Không tìm thấy bản nhắc.');
      st.reminders.splice(idx, 1);
      DB._commit();
      return DB.ok({ deletedId: id });
    }
  });
})(window);


/**
 * @owner SV2
 * @spec §7.5, §10.1, §10.4 Notifications & Activity Timeline Domain API
 */
(function (window) {
  'use strict';
  const IP = window.IP;
  const DB = IP.DB;

  function notificationOwnerRole(n) {
    const route = String(n.targetRouteKey || '');
    const title = String(n.title || '').toLowerCase();
    if (route.indexOf('reconciliation') >= 0) return 'accountant';
    if (route.indexOf('sales.') === 0 || n.type === 'reminder') return 'sales';
    if (route.indexOf('manager.') === 0 || /quá hạn|rủi ro|dòng tiền|điều hành/.test(title)) return 'manager';
    if (route.indexOf('admin.') === 0 || n.type === 'system') return 'admin';
    if (n.type === 'payment') return 'accountant';
    if (/sắp đến hạn|khách hàng|phát hành/.test(title)) return 'sales';
    return 'accountant';
  }

  function notificationBelongsToRole(n, role) {
    return n.role === role || (n.role === 'all' && notificationOwnerRole(n) === role);
  }

  DB.extend('notifications', {
    listNotifications: function (filter) {
      const f = filter || {};
      const st = DB._rawState();
      let list = st.notifications.slice();

      if (f.role && f.role !== 'all') {
        list = list.filter(function (n) { return notificationBelongsToRole(n, f.role); });
      }

      if (f.type && f.type !== 'all' && f.type !== 'unread') {
        list = list.filter(function (n) { return n.type === f.type; });
      }
      if (f.type === 'unread' || f.unreadOnly) {
        list = list.filter(function (n) { return !n.read; });
      }
      if (f.readState === 'read') {
        list = list.filter(function (n) { return Boolean(n.read); });
      } else if (f.readState === 'unread') {
        list = list.filter(function (n) { return !n.read; });
      }
      return list;
    },

    addNotification: function (ntf) {
      const st = DB._rawState();
      const n = ntf || {};
      const type = ['invoice', 'payment', 'reminder', 'system'].includes(n.type) ? n.type : 'system';
      const baseTitle = String(n.title || 'Thông báo hệ thống').trim();
      const baseMessage = String(n.message || '').trim();
      const baseRoute = n.targetRouteKey || 'invoice.list';
      const baseParams = n.targetParams || {};
      let targets = [];

      if (!n.role || n.role === 'all') {
        if (type === 'invoice') {
          targets = [
            { role: 'accountant', prefix: 'Kế toán · ', suffix: 'Việc cần làm: kiểm tra thông tin hóa đơn, hạn thanh toán và số dư còn lại.', route: baseRoute, params: baseParams },
            { role: 'sales', prefix: 'Kinh doanh · ', suffix: 'Việc cần làm: theo dõi khách hàng, cập nhật cam kết thanh toán và lịch chăm sóc.', route: 'sales.balance', params: {} },

/**
 * @owner SV3
 * @spec §8.3, §10.1, §10.4 Overdue Follow-up & Owner Assignment Domain API
 */
(function (window) {
  'use strict';
  const IP = window.IP;
  const DB = IP.DB;

  function ensureFollowUp(inv) {
    if (!inv.followUp) {
      inv.followUp = { assignedTo: 'usr_sal', status: 'watching', notes: [] };
    }
    if (!Array.isArray(inv.followUp.notes)) {
      inv.followUp.notes = [];
    }
    return inv.followUp;
  }

  DB.extend('followup', {
    assignFollowUp: function (invoiceId, ownerId, reason) {
      const st = DB._rawState();
      const inv = st.invoices.find(function (x) { return x.id === invoiceId; });
      if (!inv) return DB.err('NOT_FOUND', 'Không tìm thấy hóa đơn cần giao phụ trách.');

      const user = st.users.find(function (u) { return u.id === ownerId; });
      if (!user || user.role !== 'sales' || user.status !== 'active') {
        return DB.err('VALIDATION', 'Chỉ được chọn nhân sự thuộc vai trò Kinh doanh đang hoạt động.', 'ownerId');
      }

      const fu = ensureFollowUp(inv);
      if (fu.assignedTo === ownerId && (!reason || !String(reason).trim())) {
        return DB.err('VALIDATION', 'Người phụ trách mới trùng với người hiện tại. Vui lòng chọn nhân sự khác hoặc nhập lý do ghi chú.', 'ownerId');
      }

      fu.assignedTo = ownerId;
      fu.updatedAt = new Date().toISOString();
      if (reason && String(reason).trim()) {
        fu.notes.unshift({
          id: IP.Utils.uid('fn'),
          text: 'Giao phụ trách cho ' + user.name + ': ' + String(reason).trim(),
          authorId: DB.currentActorId(),
          at: fu.updatedAt
        });
      }

      inv.updatedAt = fu.updatedAt;
      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'invoice',
          entityId: inv.id,
          type: 'assign',
          message: 'Đã phân công ' + user.name + ' phụ trách đôn đốc hóa đơn ' + inv.number + '.'
        });
      }
      if (DB.addNotification) {
        DB.addNotification({
          role: 'sales',
          type: 'invoice',
          title: 'Phân công theo dõi công nợ: ' + inv.number,
          message: user.name + ' được giao phụ trách thu hồi hóa đơn ' + inv.number + '.',
          targetRouteKey: 'invoice.view',
          targetParams: { id: inv.id }
        });
      }

      DB._commit();
      return DB.ok(inv);
    },

    bulkAssignFollowUp: function (invoiceIds, ownerId, reason) {
      if (!Array.isArray(invoiceIds) || invoiceIds.length === 0) {
        return DB.err('VALIDATION', 'Vui lòng chọn ít nhất 1 hóa đơn quá hạn.');
      }
      const updated = [];
      for (let i = 0; i < invoiceIds.length; i++) {
        const res = DB.assignFollowUp(invoiceIds[i], ownerId, reason || 'Phân công hàng loạt từ Quản lý');
        if (res.ok) updated.push(res.data);
      }
      return DB.ok({ count: updated.length, invoices: updated });
    },

    addFollowUpNote: function (invoiceId, text) {
      const st = DB._rawState();
      const inv = st.invoices.find(function (x) { return x.id === invoiceId; });
      if (!inv) return DB.err('NOT_FOUND', 'Không tìm thấy hóa đơn.');
      const clean = String(text || '').trim();
      if (!clean) return DB.err('VALIDATION', 'Vui lòng nhập nội dung ghi chú xử lý.', 'text');

      const fu = ensureFollowUp(inv);
      const note = {
        id: IP.Utils.uid('fn'),
        text: clean,
        authorId: DB.currentActorId(),
        at: new Date().toISOString()
      };
      fu.notes.unshift(note);
      fu.updatedAt = note.at;
      inv.updatedAt = note.at;

      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'invoice',
          entityId: inv.id,
          type: 'followup',
          message: 'Ghi chú xử lý quá hạn (' + inv.number + '): ' + clean
        });
      }
      DB._commit();
      return DB.ok(note);
    },

    closeFollowUp: function (invoiceId, reason) {
      const st = DB._rawState();
      const inv = st.invoices.find(function (x) { return x.id === invoiceId; });
      if (!inv) return DB.err('NOT_FOUND', 'Không tìm thấy hóa đơn.');
      const clean = String(reason || '').trim();
      if (!clean) return DB.err('VALIDATION', 'Vui lòng nhập lý do đóng theo dõi quá hạn.', 'reason');

      const fu = ensureFollowUp(inv);
      fu.status = 'closed';
      fu.closeReason = clean;
      fu.updatedAt = new Date().toISOString();
      fu.notes.unshift({
        id: IP.Utils.uid('fn'),
        text: 'Đã đóng theo dõi. Lý do: ' + clean,
        authorId: DB.currentActorId(),
        at: fu.updatedAt
      });
      inv.updatedAt = fu.updatedAt;

      if (DB.addActivity) {
        DB.addActivity({
          entityType: 'invoice',
          entityId: inv.id,
          type: 'followup',
          message: 'Đã đóng theo dõi quá hạn cho hóa đơn ' + inv.number + '. Lý do: ' + clean
        });
      }
      DB._commit();
      return DB.ok(inv);
    },

    reopenFollowUp: function (invoiceId) {
      const st = DB._rawState();
      const inv = st.invoices.find(function (x) { return x.id === invoiceId; });
      if (!inv) return DB.err('NOT_FOUND', 'Không tìm thấy hóa đơn.');
      const fu = ensureFollowUp(inv);
      fu.status = 'watching';
      fu.closeReason = '';
      fu.updatedAt = new Date().toISOString();
      inv.updatedAt = fu.updatedAt;
      DB._commit();
      return DB.ok(inv);
    }
  });
})(window);
