        return 'BÁO CÁO QUẢN TRỊ TÀI KHOẢN\n• Tổng số tài khoản: ' + users.length + ' (Hoạt động: ' + active + ', Đã mời: ' + invited + ', Tạm khóa: ' + disabled + ').\n• Chính sách phân quyền: Chỉ Quản trị viên (admin@hoabinhdigital.vn) được phép tạo mới, chỉnh sửa vai trò hoặc xóa tài khoản của các nghiệp vụ khác.';
      }
      const invs = IP.DB.listInvoices({ includeArchived: false });
      const ag = IP.Calc.aging(invs);
      const pendingPay = IP.DB.listPayments({ status: 'pending' }).length;
      return 'TỔNG HỢP SỐ LIỆU (' + IP.Fmt.roleLabel(key).toUpperCase() + ')\n• Tổng phải thu đang mở: ' + formatMoney(ag.totalReceivable) + '.\n• Tổng nợ quá hạn: ' + formatMoney(ag.totalOverdue) + ' (Trong đó >60 ngày: ' + formatMoney(ag.b61_90 + ag.b90plus) + ').\n• Giao dịch ngân hàng chờ đối chiếu: ' + pendingPay + ' giao dịch.\n• Khuyến nghị: Ưu tiên đối chiếu các khoản ủy nhiệm chi chờ xử lý và đôn đốc nhóm khách hàng quá hạn trên 60 ngày.';
    }

    function updateRoleContext() {
      const key = roleKey();
      const conf = roleConfig(key);
      const titleEl = document.getElementById('ip-chatbot-title');
      if (titleEl) titleEl.textContent = conf.title;
      const toggleLabel = toggle.querySelector('span:not(.ip-chatbot-toggle-pulse)');
      if (toggleLabel) toggleLabel.textContent = conf.buttonLabel || 'Trợ lý AI';
      input.placeholder = conf.placeholder;
      contextEl.textContent = conf.context;
      suggestionsEl.innerHTML = '';
      conf.prompts.forEach(function (item) {
        const b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('data-ip-chat-prompt', item[1]);
        b.textContent = item[0];
        suggestionsEl.appendChild(b);
      });
      if (activeRoleKey !== key) {
        activeRoleKey = key;
        messagesEl.innerHTML = '';
        appendMessage(conf.welcome, 'assistant');
      }
    }

    toggle.addEventListener('click', function () {
      const isHidden = panel.hidden;
      panel.hidden = !isHidden;
      panel.setAttribute('aria-hidden', isHidden ? 'false' : 'true');
      toggle.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
      if (isHidden) {
        updateRoleContext();
        input.focus();
      }
    });
    closeBtn.addEventListener('click', function () {
      panel.hidden = true;
      panel.setAttribute('aria-hidden', 'true');
      toggle.setAttribute('aria-expanded', 'false');
    });
    clearBtn.addEventListener('click', function () {
      messagesEl.innerHTML = '';
      appendMessage(roleConfig(roleKey()).welcome, 'assistant');
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      const q = String(input.value || '').trim();
      if (!q) return;
      appendMessage(q, 'user');
      input.value = '';
      setTimeout(function () {
        appendMessage(buildAnswer(q), 'assistant');
      }, 220);
    });
    suggestionsEl.addEventListener('click', function (ev) {
      const b = ev.target.closest('[data-ip-chat-prompt]');
      if (!b) return;
      const q = b.getAttribute('data-ip-chat-prompt');
      appendMessage(q, 'user');
      setTimeout(function () {
        appendMessage(buildAnswer(q), 'assistant');
      }, 220);
    });
    window.addEventListener('ip:role-changed', updateRoleContext);
    updateRoleContext();
  }

  document.addEventListener('DOMContentLoaded', mountFloatingChatbot);
})(window);


/**
 * @owner SV1
 * @spec §9.2 AI-1 Invoice Anomaly Check Engine (ai-anomaly.js)
 */
(function (window) {
  'use strict';
  const IP = window.IP;

  IP.AI.register('anomaly', {
    id: 'anomaly',
    label: 'Kiểm tra hóa đơn bất thường (AI-1)',
    description: 'Đối chiếu hóa đơn đang soạn với lịch sử khách hàng, hạn mức tín dụng, thuế suất GTGT và quy tắc ngày tháng.',
    ctaText: 'Kiểm tra hóa đơn bằng AI',

    run: function (ctx, scenarioMode) {
      if (scenarioMode === 'error') {
        return {
          status: 'error',
          title: 'Không thể xử lý yêu cầu lúc này',
          summary: 'Bộ kiểm tra hóa đơn tạm thời gián đoạn kết nối. Bạn có thể bấm Thử lại hoặc tự kiểm tra thủ công các trường trên biểu mẫu.'
        };
      }

      const d = (ctx && ctx.draft) ? ctx.draft : {};
      const validItems = (d.items || []).filter(function (it) {
        return it && String(it.description || '').trim() && Number(it.quantity) > 0;
      });

      if (scenarioMode === 'insufficient' || !d.customerId || validItems.length === 0) {
        return {
          status: 'insufficient',
          title: 'Chưa đủ dữ liệu để kiểm tra đáng tin cậy',
          summary: 'Vui lòng chọn Khách hàng và nhập ít nhất 1 dòng hàng hóa/dịch vụ có tên và số lượng > 0 trước khi chạy AI kiểm tra.'
        };
      }

      const settings = IP.DB.getSettings();
      const thresholdPct = (settings.ai && settings.ai.anomalyThreshold) ? Number(settings.ai.anomalyThreshold) : 250;
      const defaultVat = (settings.invoiceDefaults && settings.invoiceDefaults.defaultVat !== undefined) ? Number(settings.invoiceDefaults.defaultVat) : 10;
      const customer = IP.DB.getCustomer(d.customerId);
      const custHistory = IP.DB.listInvoices({ customerId: d.customerId }).filter(function (inv) {
        return inv.id !== d.id && !inv.voided && !inv.archived;
      });

      const findings = [];
      const totals = IP.Calc.computeTotals(d.items || []);
      const today = IP.Seed.todayISO();

      if (d.issueDate && d.dueDate && d.dueDate < d.issueDate) {
        const suggestedDue = IP.Seed.addDays(customer ? customer.paymentTermDays : 30, d.issueDate);
        findings.push({
          severity: 'danger',
          severityLabel: 'Lỗi',
          field: 'dueDate',
          fieldName: 'Hạn thanh toán',
          problem: 'Hạn thanh toán (' + IP.Fmt.date(d.dueDate) + ') đang sớm hơn ngày phát hành (' + IP.Fmt.date(d.issueDate) + ').',
          suggestion: 'Đặt lại hạn thanh toán thành ' + IP.Fmt.date(suggestedDue) + ' (+' + (customer ? customer.paymentTermDays : 30) + ' ngày).',
          fixType: 'dueDate',
          fixValue: suggestedDue
        });
      }

      if (d.number) {
        const dup = IP.DB.getState().invoices.some(function (inv) {
          return inv.id !== d.id && inv.number.trim().toLowerCase() === String(d.number).trim().toLowerCase();
        });
        if (dup) {
          findings.push({
            severity: 'danger',
            severityLabel: 'Lỗi',
            field: 'number',
            fieldName: 'Số hóa đơn',
            problem: 'Số hóa đơn "' + d.number + '" bị trùng với một hóa đơn đã có.',
            suggestion: 'Sử dụng mã tự động tiếp theo: ' + IP.DB.nextInvoiceNumberPreview()
          });
        }
      }

      (d.items || []).forEach(function (it, idx) {
        if (!String(it.description || '').trim() || Number(it.quantity) <= 0 || Number(it.unitPrice) < 0) {
          findings.push({
            severity: 'danger',
            severityLabel: 'Lỗi',
            field: 'items',
            fieldName: 'Dòng hàng thứ ' + (idx + 1),
            problem: 'Thiếu mô tả hoặc số lượng/đơn giá không hợp lệ.',
            suggestion: 'Điền đầy đủ mô tả và đơn giá lớn hơn 0 ₫.'
          });
        }
        if (Number(it.vatRate) !== defaultVat) {
          findings.push({
            severity: 'info',
            severityLabel: 'Gợi ý',
            field: 'items',
            fieldName: 'Thuế suất GTGT dòng ' + (idx + 1),
            problem: 'Thuế GTGT đang để ' + it.vatRate + '%, khác mức mặc định hệ thống (' + defaultVat + '%).',
            suggestion: 'Đồng bộ thuế suất về mức mặc định ' + defaultVat + '% nếu thuộc nhóm dịch vụ chuẩn.',
            fixType: 'vatRate',
            fixValue: defaultVat
          });
        }
      });

      const bal = customer ? IP.Calc.customerBalance(customer.id) : { totalReceivable: 0 };
      const projectedBalance = bal.totalReceivable + totals.total;
      if (customer && customer.creditLimit > 0 && projectedBalance > customer.creditLimit) {
        const overAmt = projectedBalance - customer.creditLimit;
        findings.push({
          severity: 'warning',
          severityLabel: 'Cảnh báo',
          field: 'customerId',
          fieldName: 'Hạn mức tín dụng khách hàng',
          problem: 'Tổng dư nợ sau phát hành (' + IP.Fmt.currency(projectedBalance) + ') vượt hạn mức tín dụng của ' + customer.name + ' (' + IP.Fmt.currency(customer.creditLimit) + ') là ' + IP.Fmt.currency(overAmt) + '.',
          suggestion: 'Đề nghị khách thanh toán bớt hóa đơn cũ hoặc rút ngắn hạn thanh toán xuống 15 ngày.'
        });
      }

      let avgHistory = 0;
      if (custHistory.length > 0) {
        avgHistory = Math.round(custHistory.reduce(function (s, i) { return s + Number(i.total || 0); }, 0) / custHistory.length);
        const ratioPct = avgHistory > 0 ? Math.round((totals.total / avgHistory) * 100) : 100;
        if (ratioPct >= thresholdPct) {
          findings.push({
            severity: 'warning',
            severityLabel: 'Cảnh báo',
            field: 'items',
            fieldName: 'Giá trị hóa đơn bất thường',
            problem: 'Tổng hóa đơn (' + IP.Fmt.currency(totals.total) + ') bằng ' + ratioPct + '% mức trung bình lịch sử của khách (' + IP.Fmt.currency(avgHistory) + '), vượt ngưỡng cảnh báo ' + thresholdPct + '%.',
            suggestion: 'Kiểm tra lại số lượng hoặc đơn giá xem có bị dư chữ số 0 hay không.'
          });
        }
      }

      if (d.issueDate && IP.Calc.diffDays(d.issueDate, today) > 7) {
        findings.push({
          severity: 'warning',
          severityLabel: 'Cảnh báo',
          field: 'issueDate',
          fieldName: 'Ngày phát hành',
          problem: 'Ngày phát hành (' + IP.Fmt.date(d.issueDate) + ') cách hôm nay hơn 7 ngày trong tương lai.',
          suggestion: 'Đặt lại ngày phát hành về hôm nay (' + IP.Fmt.date(today) + ') nếu phát hành ngay.'
        });
      }

      if (customer && (!customer.email || !customer.contactName)) {
        findings.push({
          severity: 'info',
          severityLabel: 'Gợi ý',
          field: 'customerId',
          fieldName: 'Thông tin liên hệ khách hàng',
          problem: 'Khách hàng thiếu email hoặc tên người nhận hóa đơn.',
          suggestion: 'Cập nhật email khách hàng trước khi bấm Lưu & gửi.'
        });
      }

      const confidence = custHistory.length >= 2 ? 'high' : 'low';
      const summaryText = findings.length > 0
        ? ('Có ' + findings.length + ' vấn đề cần chú ý trước khi phát hành hóa đơn.')
        : 'Không phát hiện bất thường rõ ràng. Bạn vẫn nên rà soát lại số tiền và điều khoản trước khi lưu.';

      return {
        status: 'ok',
        title: findings.length > 0 ? ('Có ' + findings.length + ' điểm cần lưu ý') : 'Không phát hiện bất thường rõ ràng',
        summary: summaryText,
        findings: findings,
        confidence: confidence,
        explanation: {
          dataUsed: [
            'Dự thảo hóa đơn (' + validItems.length + ' dòng hàng, tổng ' + IP.Fmt.currency(totals.total) + ')',
            'Khách hàng: ' + (customer ? customer.name : 'Chưa rõ') + ' (' + custHistory.length + ' hóa đơn lịch sử)'
          ],
          rules: [
            'Kiểm tra hạn thanh toán >= ngày phát hành, thuế suất mặc định ' + defaultVat + '%',
            'Ngưỡng cảnh báo giá trị cao bất thường: ' + thresholdPct + '% trung bình lịch sử',
            'Đối chiếu tổng dư nợ dự kiến với hạn mức tín dụng khách hàng'
          ],
          evidence: [
            'Dư nợ hiện tại của khách: ' + IP.Fmt.currency(bal.totalReceivable) + ' / Hạn mức: ' + IP.Fmt.currency(customer ? customer.creditLimit : 0),
            custHistory.length >= 2
              ? ('Trung bình ' + custHistory.length + ' hóa đơn trước của khách: ' + IP.Fmt.currency(avgHistory))
              : 'Chưa đủ lịch sử để so sánh sâu (ít hơn 2 hóa đơn lịch sử)'
          ]
        }
      };
    },

    renderResultBody: function (res) {
      if (!res.findings || res.findings.length === 0) {
        return '<div class="alert alert-success py-2 px-3 small mb-2">' +
          '<i class="bi bi-shield-check me-1"></i>' + IP.Utils.escapeHtml(res.summary) +
        '</div>';
      }
      const listHtml = res.findings.map(function (f) {
        const badgeCls = f.severity === 'danger' ? 'ip-badge-overdue' : (f.severity === 'warning' ? 'ip-badge-partial' : 'ip-badge-sent');
        return (
          '<div class="ip-ai-finding">' +
            '<div class="d-flex justify-content-between align-items-center mb-1">' +
              '<span class="ip-badge ' + badgeCls + '">' + IP.Utils.escapeHtml(f.severityLabel) + ' · ' + IP.Utils.escapeHtml(f.fieldName) + '</span>' +
              '<button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" data-ai-cmd="focus-field" data-ai-payload="' + IP.Utils.escapeHtml(f.field) + '">Tới trường này</button>' +
            '</div>' +
            '<div class="small fw-semibold mb-1">' + IP.Utils.escapeHtml(f.problem) + '</div>' +
            '<div class="small text-muted">Đề xuất: ' + IP.Utils.escapeHtml(f.suggestion) + '</div>' +
          '</div>'
        );
      }).join('');
      return '<div class="mb-2">' + listHtml + '</div>';
    },

    renderActions: function (res) {
      const hasSafeFix = (res.findings || []).some(function (f) { return Boolean(f.fixType); });
      return (
        (hasSafeFix ? '<button type="button" class="btn btn-primary btn-sm" data-ai-cmd="apply-fixes"><i class="bi bi-magic"></i> Áp dụng gợi ý</button>' : '') +
        '<button type="button" class="btn btn-outline-secondary btn-sm" data-ai-cmd="manual-edit">Tự chỉnh sửa</button>' +
        '<button type="button" class="btn btn-outline-secondary btn-sm" data-ai-cmd="dismiss">Bỏ qua</button>' +
        '<button type="button" class="btn btn-outline-secondary btn-sm" data-ai-cmd="run"><i class="bi bi-arrow-clockwise"></i> Kiểm tra lại</button>'
      );
    }
  });
})(window);

/**
 * @owner SV3
 * @spec §9.4 AI-3 Cashflow Summary & Scenario Analysis Engine (ai-cashflow.js)
 */
(function (window) {
  'use strict';
  const IP = window.IP;

  IP.AI.register('cashflow', {
    id: 'cashflow',
    label: 'Tóm tắt dòng tiền & Rủi ro công nợ (AI-3)',
    description: 'Phân tích độ tập trung công nợ, tuổi nợ quá hạn và dự báo dòng tiền theo kịch bản giả định đang chọn.',
    ctaText: 'Tạo tóm tắt bằng AI',

    run: function (ctx, scenarioMode) {
      if (scenarioMode === 'error') {
        return {
          status: 'error',
          title: 'Không thể xử lý lúc này',
          summary: 'Không thể tổng hợp báo cáo phân tích do gián đoạn tạm thời. Bạn có thể bấm Thử lại hoặc xem trực tiếp bảng số liệu.'
        };
      }

      const c = ctx || {};
      const openInvoices = IP.DB.listInvoices({ includeArchived: false }).filter(function (inv) {
        const eff = IP.Calc.effectiveStatus(inv);
        return ['sent', 'partial', 'overdue'].includes(eff) && IP.Calc.remaining(inv) > 0;
      });

      if (scenarioMode === 'insufficient' || openInvoices.length < 3) {
        return {
          status: 'insufficient',
          title: 'Không đủ dữ liệu để đưa ra đề xuất',
          summary: 'Cần tối thiểu 3 hóa đơn chưa thu trong kỳ phân tích để tạo bản tóm tắt có ý nghĩa thống kê. Vui lòng mở rộng kỳ lọc hoặc bổ sung dữ liệu.'
        };
      }

      const ag = IP.Calc.aging(openInvoices);
      const fc = IP.Calc.forecastCashflow({
        horizonDays: c.horizonDays || 60,
        scenario: c.scenario || 'base',
        recoveryRate: c.recoveryRate,
        delayDays: c.delayDays,
        includePending: c.includePending
      });

      const byCus = {};
      openInvoices.forEach(function (inv) {
        byCus[inv.customerId] = (byCus[inv.customerId] || 0) + IP.Calc.remaining(inv);
      });
      const sortedCus = Object.keys(byCus)
        .map(function (cid) {
          const cus = IP.DB.getCustomer(cid);
          return { id: cid, name: cus ? cus.name : cid, balance: byCus[cid] };
        })
        .sort(function (a, b) { return b.balance - a.balance; });

      const top2Sum = sortedCus.slice(0, 2).reduce(function (s, x) { return s + x.balance; }, 0);
      const top2Share = ag.totalReceivable > 0 ? Math.round((top2Sum / ag.totalReceivable) * 100) : 0;
      const over60Sum = ag.b61_90 + ag.b90plus;
      const over60Count = ag.counts.b61_90 + ag.counts.b90plus;
      const lowCashPeriods = fc.periods.filter(function (p) { return p.isLowCash; });

      const scenarioNames = { base: 'Cơ sở', conservative: 'Thận trọng', optimistic: 'Lạc quan' };
      const scenLabel = scenarioNames[fc.scenario] || 'Cơ sở';

      const summary = 'Trong tổng dư nợ phải thu ' + IP.Fmt.currency(ag.totalReceivable) + ' (' + openInvoices.length + ' hóa đơn mở), có ' +
        IP.Fmt.currency(ag.totalOverdue) + ' đang quá hạn. Ở kịch bản ' + scenLabel + ' (' + fc.horizonDays + ' ngày, tỷ lệ thu hồi quá hạn ' +
        fc.assumptions.recoveryRate + '%, độ trễ ' + fc.assumptions.delayDays + ' ngày), tổng dòng tiền dự kiến thu đạt ' +
        IP.Fmt.currency(fc.totals.cumulative) + '. Đáng chú ý, ' + top2Share + '% tổng công nợ đang tập trung ở 2 khách hàng lớn nhất.';

      const highlights = [
        {
          label: 'Mức độ tập trung khách hàng',
          value: top2Share + '% dư nợ ở 2 KH đầu',
          detail: (sortedCus[0] ? sortedCus[0].name : '') + (sortedCus[1] ? (' và ' + sortedCus[1].name) : '') + ' chiếm ' + IP.Fmt.currency(top2Sum) + '.'
        },
        {
          label: 'Công nợ quá hạn trên 60 ngày',
          value: over60Count + ' hóa đơn (' + IP.Fmt.currency(over60Sum) + ')',
          detail: 'Cần giao phụ trách Kinh doanh đôn đốc trực tiếp để giảm áp lực dòng tiền.'
        },
        {
          label: lowCashPeriods.length > 0 ? 'Cảnh báo kỳ thu thấp' : 'Nhịp thu dự kiến ổn định',
          value: lowCashPeriods.length > 0 ? (lowCashPeriods.length + ' kỳ dự kiến dưới ngưỡng') : ('Đạt ' + IP.Fmt.currency(fc.totals.cumulative)),
          detail: 'Thu từ hóa đơn trong hạn: ' + IP.Fmt.currency(fc.totals.dueExpected) + ' · Thu hồi quá hạn: ' + IP.Fmt.currency(fc.totals.overdueRecovery) + '.'
        }
      ];

      return {
        status: 'ok',
        title: 'Bản tóm tắt dòng tiền kịch bản ' + scenLabel + ' (' + fc.horizonDays + ' ngày)',
        summary: summary,
        highlights: highlights,
        reportPayload: {
          type: c.mode === 'forecast' ? 'forecast' : 'dashboard',
          period: c.period || (fc.horizonDays + 'd'),
          horizon: fc.horizonDays,
          scenario: fc.scenario,
          summary: summary,
          highlights: highlights,
          assumptions: fc.assumptions,
          confidence: openInvoices.length >= 10 ? 'high' : 'medium'
        },
        confidence: openInvoices.length >= 10 ? 'high' : 'medium',
        explanation: {
          dataUsed: [
            openInvoices.length + ' hóa đơn chưa tất toán (Tổng phải thu: ' + IP.Fmt.currency(ag.totalReceivable) + ')',
            'Phân bổ tuổi nợ: Trong hạn ' + IP.Fmt.currency(ag.current) + ', Quá hạn ' + IP.Fmt.currency(ag.totalOverdue)
          ],
          rules: [
            'Kịch bản: ' + scenLabel + ' · Tỷ lệ thu hồi nợ quá hạn: ' + fc.assumptions.recoveryRate + '% · Độ trễ bình quân: ' + fc.assumptions.delayDays + ' ngày',
            'Khoản chờ đối chiếu ngân hàng: ' + (fc.assumptions.includePending ? 'Có cộng vào kỳ đầu' : 'Không cộng (mặc định thận trọng)'),
            'Báo cáo dự báo dựa trên sổ theo dõi công nợ nội bộ, phục vụ điều hành dòng tiền'
          ],
          evidence: [
            '2 khách hàng dư nợ cao nhất chiếm ' + top2Share + '% (' + IP.Fmt.currency(top2Sum) + ')',
            'Dòng tiền lũy kế dự kiến ' + fc.horizonDays + ' ngày: ' + IP.Fmt.currency(fc.totals.cumulative)
          ]
        }
      };
    },

    renderResultBody: function (res) {
      const hlHtml = (res.highlights || []).map(function (h) {
        return (
          '<div class="ip-ai-finding">' +
            '<div class="d-flex justify-content-between align-items-center mb-1">' +
              '<span class="small fw-bold">' + IP.Utils.escapeHtml(h.label) + '</span>' +
              '<span class="badge bg-warning-subtle text-warning-emphasis ip-num">' + IP.Utils.escapeHtml(h.value) + '</span>' +
            '</div>' +
            '<div class="small text-muted">' + IP.Utils.escapeHtml(h.detail) + '</div>' +
          '</div>'
        );
      }).join('');

      return (
        '<p class="small mb-2">' + IP.Utils.escapeHtml(res.summary) + '</p>' +
        '<div class="mb-2">' + hlHtml + '</div>'
      );
    },

    renderActions: function () {
      return (
        '<button type="button" class="btn btn-primary btn-sm" data-ai-cmd="save-report"><i class="bi bi-bookmark-check"></i> Lưu báo cáo</button>' +
        '<button type="button" class="btn btn-outline-secondary btn-sm" data-ai-cmd="change-assumptions">Đổi giả định</button>' +
        '<button type="button" class="btn btn-outline-secondary btn-sm" data-ai-cmd="dismiss">Bỏ qua</button>' +
        '<button type="button" class="btn btn-outline-secondary btn-sm" data-ai-cmd="run"><i class="bi bi-arrow-clockwise"></i> Tạo lại</button>'
      );
    }
  });
})(window);

          currentSlide = Number(slideTo.getAttribute('data-slide-to')) || 0;
          renderSlideDeckOnly();
          if (IP.I18n && IP.I18n.getLang() === 'en') {
            IP.I18n.translateDOM(root.querySelector('#lnd-slide-deck-host'));
          }
          return;
        }
        const slideStep = ev.target.closest('[data-slide-step]');
        if (slideStep) {
          const delta = Number(slideStep.getAttribute('data-slide-step')) || 1;
          currentSlide = (currentSlide + delta + SLIDES.length) % SLIDES.length;
          renderSlideDeckOnly();
          if (IP.I18n && IP.I18n.getLang() === 'en') {
            IP.I18n.translateDOM(root.querySelector('#lnd-slide-deck-host'));

          return;
        }

        const btn = ev.target.closest('[data-lnd-action]');
        if (!btn) return;
        const act = btn.getAttribute('data-lnd-action');
        const targetRole = btn.getAttribute('data-role') || '';

        if (act === 'toggle-lang') {
          if (IP.I18n) IP.I18n.toggleLang();
        } else if (act === 'open-fx-modal') {
          if (IP.I18n) IP.I18n.openExchangeRateModal();
        } else if (act === 'skip-landing') {
          IP.Auth.setSkipRoleLanding(true);
          const curSess = IP.Auth.getSession();
          if (curSess && curSess.role) {
            IP.Auth.setRoleLandingDismissed(curSess.role, true, true);
            const dest = IP.Routes.homeForRole(curSess.role);
            if (typeof window.IP_CanvasNav === 'function') window.IP_CanvasNav(dest);
            else window.location.href = dest;
          } else {
            const activeRole = SLIDES[currentSlide] && SLIDES[currentSlide].roleKey ? SLIDES[currentSlide].roleKey : 'accountant';
            IP.Auth.openLoginModal({ mandatory: true, role: activeRole });
          }
        } else if (act === 'open-login-popup') {
          IP.Auth.openLoginModal({ mandatory: !IP.Auth.getSession() });
        } else if (act === 'login-role') {
          IP.Auth.setSkipRoleLanding(false);
          IP.Auth.openLoginModal({ mandatory: !IP.Auth.getSession(), role: targetRole });
        } else if (act === 'login-role-skip') {
          IP.Auth.setSkipRoleLanding(true);
          const preset = IP.Auth.ROLE_ACCOUNTS.find(function (a) { return a.role === targetRole; });
          if (preset) {
            const res = IP.Auth.login(preset.email, preset.password, true);

              const dest = IP.Routes.homeForRole(targetRole);
              if (typeof window.IP_CanvasNav === 'function') window.IP_CanvasNav(dest);
              else window.location.href = dest;
            } else {
              IP.Auth.openLoginModal({ mandatory: true, role: targetRole });
            }
          }
        }
      });

            IP.UI.toast({ title: 'Đã lưu hồ sơ cá nhân', message: 'Họ tên đã được đồng bộ trên thanh công cụ.', type: 'success' });
            render();
          });
        }

        const secForm = root.querySelector('#prf-sec-form');
        if (secForm) {
          secForm.addEventListener('submit', function (ev) {
            ev.preventDefault();
            const errEl = root.querySelector('#prf-sec-err');
            errEl.classList.add('d-none');
            const curP = root.querySelector('#prf-cur-pass').value;
            const newP = root.querySelector('#prf-new-pass').value;
            const cfmP = root.querySelector('#prf-cfm-pass').value;
            if (newP !== cfmP) {
              errEl.textContent = 'Mật khẩu xác nhận không khớp với mật khẩu mới.';
              errEl.classList.remove('d-none');
              return;
            }
            const res = IP.DB.changeOwnPassword(user.id, curP, newP);
            if (!res.ok) {
              errEl.textContent = res.error.message;
              errEl.classList.remove('d-none');
              return;
            }
            secForm.reset();
            IP.UI.toast({ title: 'Đã cập nhật mật khẩu', message: 'Mật khẩu mới đã được lưu trong trình duyệt này.', type: 'success' });
          });
        }

        if (IP.I18n && IP.I18n.getLang() === 'en') {
          IP.I18n.translateDOM(root);
        }
      }

      // Listen to global theme changes (e.g. clicking #ip-theme-toggle-btn in topbar)
      if (window.__ipProfileThemeHandler) {
        window.removeEventListener('ip:themechange', window.__ipProfileThemeHandler);
      }
      window.__ipProfileThemeHandler = function () {
        if (document.body.getAttribute('data-page') !== 'profile') return;
        if (currentTab === 'appearance' && !isDirty) {
          render();
        } else {
          syncThemeCardsInDOM();
        }
      };
      window.addEventListener('ip:themechange', window.__ipProfileThemeHandler);

      render();

      root.addEventListener('click', function (ev) {
        const togglePass = ev.target.closest('[data-toggle-pass]');
        if (togglePass) {
          const inp = root.querySelector(togglePass.getAttribute('data-toggle-pass'));
          if (inp) {
            inp.type = inp.type === 'password' ? 'text' : 'password';
          }
          return;
        }
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'switch-tab') {
          currentTab = btn.getAttribute('data-tab');
          isDirty = false;
          render();
        } else if (action === 'select-theme') {
          const ch = btn.getAttribute('data-theme-choice');
          IP.UI.applyTheme(ch);
          IP.UI.toast({
            title: IP.I18n && IP.I18n.getLang() === 'en' ? 'Theme Updated' : 'Đã đổi chế độ giao diện',
            message: IP.I18n && IP.I18n.getLang() === 'en'
              ? ('Switched to ' + ch + ' mode.')
              : ('Giao diện đã chuyển sang chế độ ' + ch + ' và đồng bộ với thanh công cụ.'),
            type: 'info'
          });
          render();
        } else if (action === 'select-lang') {
          const nextLang = btn.getAttribute('data-lang') || 'vi';
          if (IP.I18n) {
            IP.I18n.setLang(nextLang);
          }
          render();
        } else if (action === 'open-fx-modal') {
          if (IP.I18n) IP.I18n.openExchangeRateModal();
        } else if (action === 'export-json') {
          const jsonStr = IP.DB.exportJSON();
          const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'invoicepilot-backup-data-' + IP.Seed.todayISO() + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          IP.UI.toast({ title: 'Đã xuất JSON', message: 'Tệp sao lưu dữ liệu JSON đã được tải xuống.', type: 'success' });
        } else if (action === 'reset-system-db') {
          IP.UI.confirmModal({
            title: 'Khôi phục dữ liệu mẫu ban đầu?',
            message: 'Mọi hóa đơn mới tạo, giao dịch đối chiếu và báo cáo AI đã lưu sẽ được đặt lại về dữ liệu mẫu gốc và bạn sẽ được đưa về trang Đăng nhập.',
            confirmText: 'Khôi phục & Đăng xuất',
            variant: 'danger',
            onConfirm: function () {
              IP.DB.reset();
              IP.Auth.logout('login.html');
            }
          });
        } else if (action === 'logout') {
          IP.Auth.logout('login.html');
        }
      });
    }
  });
})(window);


/**
 * @owner SV2
 * @spec §7.5 Notification Centre Page Script (notifications.js)
 */
(function (window) {
  'use strict';
  const IP = window.IP;

  IP.Pages.register('notifications', {
    roles: ['accountant', 'sales', 'manager', 'admin'],
    init: function (ctx) {

      let currentTab = params.tab || 'all'; // 'all' | 'unread' | 'invoice' | 'payment' | 'reminder' | 'system'
      let readFilter = 'all'; // 'all' | 'unread' | 'read'

        payment: 'bi-cash-coin text-success',
        reminder: 'bi-envelope-paper text-warning',
        system: 'bi-gear text-info'

          unread: all.filter(function (n) { return !n.read; }).length,
          invoice: all.filter(function (n) { return n.type === 'invoice'; }).length,
          payment: all.filter(function (n) { return n.type === 'payment'; }).length,

          render();
        } else if (action === 'go-role-home') {

/**
 * @owner SV1
 * @spec §8.1 Accountant Invoice List Page Script (invoice-list.js)
 */
(function (window) {
  'use strict';
  const IP = window.IP;

  IP.Pages.register('accountant-invoice-list', {
    roles: ['accountant'],
    init: function () {
      const root = document.getElementById('main-content');
      if (!root) return;

      const params = IP.Utils.getQueryParams();
      const filterState = {
        q: params.q || '',
        status: params.status || 'all',
        customerId: params.customerId || 'all',
        period: params.period || 'all',
        due: params.due || '',
        sortBy: params.sort || 'dueDate_asc',
        page: Number(params.page || 1),
        perPage: 10
      };
      const selectedIds = new Set();

      function computeKPIs() {
        const allInvs = IP.DB.listInvoices({ includeArchived: false });
        let totalAR = 0;
        let overdueAmt = 0;
        let overdueCount = 0;
        let due7Amt = 0;
        let due7Count = 0;

        allInvs.forEach(function (inv) {
          const eff = IP.Calc.effectiveStatus(inv);
          if (['draft', 'paid', 'voided', 'archived'].includes(eff)) return;
          const rem = IP.Calc.remaining(inv);
          totalAR += rem;
          if (eff === 'overdue') {
            overdueAmt += rem;
            overdueCount++;
          } else {
            const d = IP.Calc.daysUntilDue(inv);
            if (d >= 0 && d <= 7) {
              due7Amt += rem;
              due7Count++;
            }
          }
        });

        const monthStart = IP.Seed.addDays(-30);
        const collectedMonth = IP.DB.listPayments({ status: 'confirmed' })
          .filter(function (p) { return p.paidAt >= monthStart; })
          .reduce(function (s, p) { return s + Number(p.allocatedAmount || p.amount || 0); }, 0);

        return {
          totalAR: totalAR,
          overdueAmt: overdueAmt,
          overdueCount: overdueCount,
          due7Amt: due7Amt,
          due7Count: due7Count,
          collectedMonth: collectedMonth
        };
      }

      function sortInvoices(list) {
        const parts = filterState.sortBy.split('_');
        const col = parts[0];
        const dir = parts[1] === 'desc' ? -1 : 1;
        return list.slice().sort(function (a, b) {
          if (col === 'total') return (a.total - b.total) * dir;
          if (col === 'remaining') return (IP.Calc.remaining(a) - IP.Calc.remaining(b)) * dir;
          return String(a.dueDate).localeCompare(String(b.dueDate)) * dir;
        });
      }

      function renderPage() {
        const kpi = computeKPIs();
        const customers = IP.DB.listCustomers({ includeArchived: true });
        const rawList = IP.DB.listInvoices({
          q: filterState.q,
          status: filterState.status,
          customerId: filterState.customerId,
          period: filterState.period,
          due: filterState.due,
          includeArchived: filterState.status === 'archived'
        });
        const sorted = sortInvoices(rawList);
        const total = sorted.length;
        const totalPages = Math.max(1, Math.ceil(total / filterState.perPage));
        if (filterState.page > totalPages) filterState.page = 1;
        const pageItems = sorted.slice((filterState.page - 1) * filterState.perPage, filterState.page * filterState.perPage);

        // Active filter chips
        const chips = [];
        if (filterState.q) chips.push({ key: 'q', label: 'Từ khóa: ' + filterState.q });
        if (filterState.status !== 'all') chips.push({ key: 'status', label: 'Trạng thái: ' + IP.Fmt.statusLabel(filterState.status) });
        if (filterState.customerId !== 'all') {
          const cObj = IP.DB.getCustomer(filterState.customerId);
          chips.push({ key: 'customerId', label: 'Khách hàng: ' + (cObj ? cObj.name : filterState.customerId) });
        }

              else selectedIds.delete(inv.id);

      root.addEventListener('click', function (ev) {
        const el = ev.target.closest('[data-action]');
        if (!el) return;
        const action = el.getAttribute('data-action');
        const id = el.getAttribute('data-id');

        if (action === 'open-drawer') {
          ev.preventDefault();
          openDetailDrawer(id);
        } else if (action === 'close-drawer') {
          const host = document.getElementById('acc-invoice-drawer-host');
          if (host) host.innerHTML = '';
          IP.Utils.setQueryParams({ open: null });
        } else if (action === 'kpi-filter') {
          const f = el.getAttribute('data-filter');
          if (f === 'overdue') { filterState.status = 'overdue'; filterState.due = ''; }
          else if (f === 'due7d') { filterState.status = 'all'; filterState.due = '7d'; }
          else if (f === 'paid') { filterState.status = 'paid'; filterState.due = ''; }
          else { filterState.status = 'all'; filterState.due = ''; }
          filterState.page = 1;
          renderPage();
        } else if (action === 'remove-chip') {
          const k = el.getAttribute('data-chip');
          if (k === 'q') filterState.q = '';
          if (k === 'status') filterState.status = 'all';
          if (k === 'customerId') filterState.customerId = 'all';
          if (k === 'due') filterState.due = '';
          if (k === 'period') filterState.period = 'all';
          filterState.page = 1;
          renderPage();
        } else if (action === 'clear-filters') {
          filterState.q = '';
          filterState.status = 'all';
          filterState.customerId = 'all';
          filterState.period = 'all';
          filterState.due = '';
          filterState.page = 1;
          IP.Utils.setQueryParams({ state: null, status: null, due: null, customerId: null, q: null });
          renderPage();
        } else if (action === 'sort-col') {
          const col = el.getAttribute('data-col');
          const cur = filterState.sortBy;
          filterState.sortBy = (cur === col + '_asc') ? (col + '_desc') : (col + '_asc');
          renderPage();
        } else if (action === 'page-change') {
          filterState.page = Number(el.getAttribute('data-page') || 1);
          renderPage();
        } else if (action === 'toggle-row') {
          if (el.checked) selectedIds.add(id);
          else selectedIds.delete(id);
          renderPage();

          IP.UI.openPaymentModal({
            invoiceId: id,

          IP.UI.confirmModal({
            title: 'Lưu trữ hóa đơn này?',
            message: 'Hóa đơn sẽ được chuyển vào danh mục Đã lưu trữ và ẩn khỏi bảng công nợ mặc định.',

                IP.UI.toast({ title: 'Không thể lưu trữ', message: res.error.message, type: 'danger' });

              }
              IP.UI.toast({ title: 'Đã lưu trữ', message: 'Hóa đơn ' + res.data.number + ' đã được lưu trữ.', type: 'success' });
              renderPage();
            }
          });
        } else if (action === 'export-all-csv' || action === 'bulk-csv') {
          const targetList = action === 'bulk-csv'
            ? Array.from(selectedIds).map(function (x) { return IP.DB.getInvoice(x); }).filter(Boolean)
            : IP.DB.listInvoices({ q: filterState.q, status: filterState.status, customerId: filterState.customerId });

          const rows = targetList.map(function (inv) {
            const cus = IP.DB.getCustomer(inv.customerId);

            ];

          IP.UI.downloadCSV('danh-sach-hoa-don', headers, rows);
        } else if (action === 'bulk-archive') {
          IP.UI.confirmModal({
            title: 'Lưu trữ ' + selectedIds.size + ' hóa đơn đã chọn?',
            message: 'Các hóa đơn chưa phát sinh thanh toán đã chọn sẽ được chuyển sang trạng thái Đã lưu trữ.',

            '<div class="acc-recon-grid">' +

        }

            render();

        }
        const invSel = root.querySelector('#recon-invoice-select');
        if (invSel) {
          invSel.addEventListener('change', function () {
            selectedInvoiceId = invSel.value;
            render();
          });
        }
      }

      IP.UI.withLoading(root, render);

      root.addEventListener('click', function (ev) {
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        const id = btn.getAttribute('data-id');

        if (action === 'switch-tab') {
          currentTab = btn.getAttribute('data-tab');
          selectedPayId = '';
          selectedInvoiceId = '';
          render();
        } else if (action === 'select-tx') {
          selectedPayId = id;
          selectedInvoiceId = '';
          render();
        } else if (action === 'pick-suggestion') {
          selectedInvoiceId = btn.getAttribute('data-inv-id');
          render();
        } else if (action === 'refresh-recon') {
          IP.UI.toast({ title: 'Đã đồng bộ sao kê', message: 'Danh sách giao dịch ngân hàng đã được làm mới.', type: 'info' });
          render();
        } else if (action === 'confirm-reconcile') {
          const invSel = root.querySelector('#recon-invoice-select');
          const allocEl = root.querySelector('#recon-alloc-amount');
          const noteEl = root.querySelector('#recon-note');
          const errBox = root.querySelector('#recon-err-box');
          if (errBox) errBox.classList.add('d-none');

          const res = IP.DB.reconcilePayment(
            id,
            invSel ? invSel.value : selectedInvoiceId,
            allocEl ? Number(allocEl.value) : undefined,
            noteEl ? noteEl.value : ''
          );
          if (!res.ok) {
            if (errBox) {
              errBox.textContent = res.error.message;
              errBox.classList.remove('d-none');
            }
            if (res.error.field === 'note' && noteEl) noteEl.focus();
            return;
          }
          IP.UI.toast({
            title: 'Đã xác nhận đối chiếu',
            message: 'Giao dịch đã được khớp với hóa đơn ' + res.data.invoice.number + '.',
            type: 'success'
          });
          selectedPayId = '';
          render();
        } else if (action === 'mark-discrepancy') {
          const noteEl = root.querySelector('#recon-note');
          const noteVal = noteEl ? noteEl.value.trim() : '';
          if (!noteVal) {
            const errBox = root.querySelector('#recon-err-box');
            if (errBox) {
              errBox.textContent = 'Vui lòng nhập ghi chú mô tả sai lệch trước khi đánh dấu Sai lệch.';
              errBox.classList.remove('d-none');
            }
            if (noteEl) noteEl.focus();
            return;
          }
          const res = IP.DB.markPaymentDiscrepancy(id, noteVal);
          if (res.ok) {
            IP.UI.toast({ title: 'Đã chuyển sang tab Sai lệch', message: 'Giao dịch đã được ghi nhận sai lệch cần xử lý.', type: 'warning' });
            currentTab = 'discrepancy';
            render();
          }
        } else if (action === 'reject-tx') {
          IP.UI.confirmModal({
            title: 'Từ chối giao dịch ngân hàng này?',
            message: 'Giao dịch sẽ được chuyển sang trạng thái Đã từ chối và không cộng vào công nợ hóa đơn.',
            requireReason: true,
            reasonLabel: 'Lý do từ chối giao dịch (bắt buộc)',
            confirmText: 'Từ chối giao dịch',
            variant: 'danger',
            onConfirm: function (reason) {
              const res = IP.DB.rejectPayment(id, reason);
              if (res.ok) {
                IP.UI.toast({ title: 'Đã từ chối giao dịch', message: 'Đã lưu lý do từ chối.', type: 'info' });
                currentTab = 'discrepancy';
                render();
              }
            }
          });
        } else if (action === 'undo-reconcile') {
          IP.UI.confirmModal({
            title: 'Hoàn tác đối chiếu giao dịch này?',
            message: 'Số tiền đã phân bổ sẽ được trừ khỏi hóa đơn liên quan và giao dịch sẽ quay về trạng thái Chờ đối chiếu.',
            confirmText: 'Hoàn tác đối chiếu',
            variant: 'danger',
            onConfirm: function () {
              const res = IP.DB.unreconcilePayment(id);
              if (res.ok) {
                IP.UI.toast({ title: 'Đã hoàn tác đối chiếu', message: 'Giao dịch ' + res.data.reference + ' đã trở về Chờ đối chiếu.', type: 'warning' });
                currentTab = 'pending';
                selectedPayId = res.data.id;
                render();
              }
            }
          });
        }
      });
    }
  });
})(window);

(function (window) {

  const IP = window.IP;

  IP.Pages.register('sales-customer-balance', {
    roles: ['sales'],
    init: function () {
      const root = document.getElementById('main-content');
      if (!root) return;

      const params = IP.Utils.getQueryParams();
      const filterState = {
        q: params.q || '',
        bucket: params.bucket || 'all', // 'all' | '0-30' | '31-60' | '61-90' | '90+'
        owner: params.owner || 'all',
        status: params.status || 'active',
        sort: params.sort || 'balance_desc',
        page: Number(params.page || 1),
        perPage: 10
      };

      function buildCustomerRows() {
        const list = IP.DB.listCustomers({
          q: filterState.q,
          ownerId: filterState.owner,
          status: filterState.status,
          includeArchived: filterState.status === 'archived' || filterState.status === 'all'
        });

        let enriched = list.map(function (c) {
          const bal = IP.Calc.customerBalance(c.id);
          const owner = IP.DB.getUser(c.ownerId);
          const utilRatio = c.creditLimit > 0 ? (bal.totalReceivable / c.creditLimit) : 0;
          const isHighRisk = bal.maxOverdueDays > 45 || utilRatio >= 0.8 || c.latePaymentCount >= 3;
          return {
            customer: c,
            balance: bal,
            ownerName: owner ? owner.name : 'Trần Minh Quân',
            isHighRisk: isHighRisk
          };
        });

        if (filterState.bucket !== 'all') {
          enriched = enriched.filter(function (row) {
            const b = row.balance.buckets;
            if (filterState.bucket === '0-30') return b.current > 0 || b.b1_30 > 0;
            if (filterState.bucket === '31-60') return b.b31_60 > 0;
            if (filterState.bucket === '61-90') return b.b61_90 > 0;
            if (filterState.bucket === '90+') return b.b90plus > 0;
            return true;
          });
        }

        enriched.sort(function (a, b) {
          if (filterState.sort === 'overdue_desc') return b.balance.overdueAmount - a.balance.overdueAmount;
          if (filterState.sort === 'name_asc') return a.customer.name.localeCompare(b.customer.name, 'vi');
          return b.balance.totalReceivable - a.balance.totalReceivable;
        });

        return enriched;
      }

      function render() {
        const allActiveCus = IP.DB.listCustomers({ status: 'active' });
        let totalAR = 0;
        let totalOverdue = 0;
        let highRiskCount = 0;
        allActiveCus.forEach(function (c) {
          const b = IP.Calc.customerBalance(c.id);
          totalAR += b.totalReceivable;
          totalOverdue += b.overdueAmount;
          if (b.maxOverdueDays > 45 || (c.creditLimit > 0 && b.totalReceivable / c.creditLimit >= 0.8) || c.latePaymentCount >= 3) {

        const salesUsers = IP.DB.listUsers({ role: 'sales', status: 'active' });
        const rows = buildCustomerRows();

      function initComposerFromParams() {
        if (!params.customerId && !params.invoiceId && !params.open) return;

        if (params.open) {
          const existing = IP.DB.getReminder(params.open);
          if (existing) {
            editingReminderId = existing.id;
            composer.customerId = existing.customerId;
            composer.invoiceIds = existing.invoiceIds.slice();
            composer.channel = existing.channel;
            composer.tone = existing.tone;
            composer.subject = existing.subject;
            composer.body = existing.body;
            composer.Open = true;
            composerOpen = true;
            return;
          }
        }

        let validCus = params.customerId ? IP.DB.getCustomer(params.customerId) : null;
        const validInv = params.invoiceId ? IP.DB.getInvoice(params.invoiceId) : null;

        if (!validCus && validInv) {
          validCus = IP.DB.getCustomer(validInv.customerId);
        }

        if (params.customerId && !validCus) {
          composer.notice = 'Mã khách hàng trên đường dẫn không tồn tại nên hệ thống đã chọn mặc định khách hàng đầu tiên.';
        }

        if (validCus) {
          composer.customerId = validCus.id;
        }
        const openInvs = IP.DB.listInvoices({ customerId: composer.customerId }).filter(function (inv) {
          return !inv.voided && !inv.archived && IP.Calc.remaining(inv) > 0;
        });
        if (validInv && validInv.customerId === composer.customerId && IP.Calc.remaining(validInv) > 0) {
          composer.invoiceIds = [validInv.id];
        } else {
          composer.invoiceIds = openInvs.slice(0, 2).map(function (i) { return i.id; });
        }
        applyManualTemplate();
        composerOpen = true;
      }

      function applyManualTemplate(templateId) {
        const settings = IP.DB.getSettings();
        const templates = settings.reminderTemplates || [];
        const tpl = (templateId && templates.find(function (t) { return t.id === templateId; })) ||
          templates.find(function (t) { return t.channel === composer.channel && t.isDefault; }) ||
          templates[0];
        if (!tpl) return;

        const cus = IP.DB.getCustomer(composer.customerId) || { name: 'Quý khách hàng' };
        const invs = composer.invoiceIds.map(function (id) { return IP.DB.getInvoice(id); }).filter(Boolean);
        const codes = invs.length ? invs.map(function (i) { return i.number; }).join(', ') : 'IP-2026-XXXX';
        const sumAmt = invs.reduce(function (s, i) { return s + IP.Calc.remaining(i); }, 0);
        const dueStr = invs[0] ? IP.Fmt.date(invs[0].dueDate) : IP.Fmt.date(IP.Seed.todayISO());
        const comp = settings.company || {};
        const sess = IP.Auth.getSession();

        function replaceVars(text) {
          return String(text || '')
            .replace(/\{ten_khach_hang\}/g, cus.name)
            .replace(/\{ma_hoa_don\}/g, codes)
            .replace(/\{so_tien\}/g, IP.Fmt.currency(sumAmt))
            .replace(/\{han_thanh_toan\}/g, dueStr)
            .replace(/\{ngan_hang\}/g, (comp.bankName || 'Vietcombank') + ' - ' + (comp.bankAccount || ''))
            .replace(/\{nguoi_gui\}/g, (sess && sess.name) ? sess.name : 'Bộ phận Công nợ');
        }

        composer.subject = replaceVars(tpl.subject);
        composer.body = replaceVars(tpl.body);
        composer.aiGenerated = false;

                    '<div class="col-sm-6">' +
                      '<label class="form-label" for="comp-sched">Thời gian hẹn gửi (Nếu chọn Lên lịch)</label>' +

              '<div class="d-flex gap-2">' +
                '<button type="button" class="btn btn-outline-primary btn-sm" data-action="save-rem-mode" data-mode="scheduled"><i class="bi bi-clock"></i> Lên lịch gửi</button>' +
                '<button type="button" class="btn btn-primary btn-sm" data-action="save-rem-mode" data-mode="sent"><i class="bi bi-send-check"></i> Gửi thông báo ngay</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="offcanvas-backdrop fade show" data-action="close-composer"></div>';

        const aiSlot = host.querySelector('#sal-ai-reminder-slot');
        IP.AI.mountPanel(aiSlot, {
          id: 'reminder',
          manualActionLabel: 'Dùng mẫu thủ công',
          getContext: function () {
            syncComposerInputs(host);
            return composer;
          },
          onAction: function (cmd, result) {
            if ((cmd === 'use-draft' || cmd === 'edit-draft') && result && result.content) {
              composer.subject = result.content.subject;
              composer.body = result.content.body;
              composer.aiGenerated = true;
              const subEl = host.querySelector('#comp-subject');
              const bodyEl = host.querySelector('#comp-body');
              const prevEl = host.querySelector('#comp-live-preview');
              if (subEl) subEl.value = composer.subject;
              if (bodyEl) {
                bodyEl.value = composer.body;
                if (cmd === 'edit-draft') bodyEl.focus();
              }
              if (prevEl) prevEl.textContent = composer.body;
              IP.UI.toast({ title: 'Đã đưa bản nháp AI vào trình soạn thảo', message: 'Bạn có thể chỉnh sửa thêm trước khi Lưu hoặc Gửi.', type: 'success' });
            } else if (cmd === 'manual') {
              applyManualTemplate();
              renderComposerDrawer();
            }
          }
        });

        // Bind composer inputs
        const cusSel = host.querySelector('#comp-customer');
        if (cusSel) {
          cusSel.addEventListener('change', function () {
            composer.customerId = cusSel.value;
            const openInvs = IP.DB.listInvoices({ customerId: composer.customerId }).filter(function (i) {
              return !i.voided && !i.archived && IP.Calc.remaining(i) > 0;
            });
            composer.invoiceIds = openInvs.slice(0, 2).map(function (i) { return i.id; });
            applyManualTemplate();
            renderComposerDrawer();
          });
        }
        host.querySelectorAll('[data-comp-inv]').forEach(function (chk) {
          chk.addEventListener('change', function () {
            const invId = chk.getAttribute('data-comp-inv');
            if (chk.checked) {
              if (!composer.invoiceIds.includes(invId)) composer.invoiceIds.push(invId);
            } else {
              composer.invoiceIds = composer.invoiceIds.filter(function (x) { return x !== invId; });
            }
            renderComposerDrawer();
          });
        });
        const chSel = host.querySelector('#comp-channel');
        if (chSel) {
          chSel.addEventListener('change', function () {
            composer.channel = chSel.value;
            applyManualTemplate();
            renderComposerDrawer();
          });
        }
        const toneSel = host.querySelector('#comp-tone');
        if (toneSel) {
          toneSel.addEventListener('change', function () {
            composer.tone = toneSel.value;
          });
        }
        const tplSel = host.querySelector('#comp-tpl');
        if (tplSel) {
          tplSel.addEventListener('change', function () {
            if (tplSel.value) {
              applyManualTemplate(tplSel.value);
              renderComposerDrawer();
            }
          });
        }
        const bodyEl = host.querySelector('#comp-body');
        if (bodyEl) {
          bodyEl.addEventListener('input', function () {
            composer.body = bodyEl.value;
            const prev = host.querySelector('#comp-live-preview');
            if (prev) prev.textContent = bodyEl.value;
          });
        }
      }

      function syncComposerInputs(host) {
        const subEl = host.querySelector('#comp-subject');
        const bodyEl = host.querySelector('#comp-body');
        const schedEl = host.querySelector('#comp-sched');
        const chEl = host.querySelector('#comp-channel');
        const toneEl = host.querySelector('#comp-tone');
        if (subEl) composer.subject = subEl.value;
        if (bodyEl) composer.body = bodyEl.value;
        if (schedEl) composer.scheduledAt = schedEl.value;
        if (chEl) composer.channel = chEl.value;
        if (toneEl) composer.tone = toneEl.value;
      }

      initComposerFromParams();
      IP.UI.withLoading(root, render);

      root.addEventListener('click', function (ev) {
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        const id = btn.getAttribute('data-id');

        if (action === 'switch-tab') {
          currentTab = btn.getAttribute('data-tab');
          render();
        } else if (action === 'open-composer') {
          editingReminderId = null;
          composer.notice = '';
          const openInvs = IP.DB.listInvoices({ customerId: composer.customerId }).filter(function (i) {
            return !i.voided && !i.archived && IP.Calc.remaining(i) > 0;
          });
          composer.invoiceIds = openInvs.slice(0, 2).map(function (i) { return i.id; });
          applyManualTemplate();
          composerOpen = true;
          render();
        } else if (action === 'close-composer') {
          composerOpen = false;
          IP.Utils.setQueryParams({ customerId: null, invoiceId: null, open: null });
          render();
        } else if (action === 'edit-reminder') {
          const rem = IP.DB.getReminder(id);
          if (!rem) return;
          editingReminderId = rem.id;
          composer.customerId = rem.customerId;
          composer.invoiceIds = (rem.invoiceIds || []).slice();
          composer.channel = rem.channel;
          composer.tone = rem.tone;
          composer.subject = rem.subject;
          composer.body = rem.body;
          composerOpen = true;
          render();
        } else if (action === 'save-rem-mode') {
          const host = document.getElementById('sal-composer-host');
          syncComposerInputs(host);
          const mode = btn.getAttribute('data-mode');
          const errBox = host.querySelector('#comp-err-box');
          if (errBox) errBox.classList.add('d-none');

          let res;
          if (editingReminderId) {
            res = IP.DB.updateReminder(editingReminderId, Object.assign({}, composer, { status: mode }));
            if (res.ok && mode === 'sent') {
              res = IP.DB.sendReminder(editingReminderId);
            }
          } else {
            res = IP.DB.createReminder(Object.assign({}, composer, { mode: mode }));
          }

          if (!res.ok) {
            if (errBox) {
              errBox.textContent = res.error.message;
              errBox.classList.remove('d-none');
            }
            return;
          }

          composerOpen = false;
          IP.UI.toast({
            title: mode === 'sent' ? 'Đã gửi thông báo nhắc thanh toán' : (mode === 'scheduled' ? 'Đã lên lịch gửi nhắc' : 'Đã lưu bản nháp'),
            message: res.data.subject,
            type: 'success'
          });
          render();
        } else if (action === 'retry-send' || action === 'send-now-row') {
          IP.UI.confirmModal({
            title: action === 'retry-send' ? 'Gửi lại thông báo nhắc này?' : 'Xác nhận gửi thông báo nhắc thanh toán ngay?',
            message: 'Hệ thống sẽ phát hành thông báo nhắc thanh toán và ghi nhận vào lịch sử hoạt động của các hóa đơn liên quan.',
            confirmText: 'Gửi ngay',
            onConfirm: function () {
              const res = IP.DB.sendReminder(id, false);
              if (!res.ok) {
                IP.UI.toast({ title: 'Không thể gửi', message: res.error.message, type: 'danger' });
                return;
              }
              IP.UI.toast({ title: 'Đã gửi thành công', message: 'Trạng thái bản nhắc đã chuyển sang Đã gửi.', type: 'success' });
              render();
            }
          });
        } else if (action === 'cancel-reminder') {
          IP.UI.confirmModal({
            title: 'Hủy lịch gửi bản nhắc này?',
            message: 'Bản nhắc sẽ chuyển sang trạng thái Đã hủy và không tự động gửi nữa.',
            confirmText: 'Hủy lịch gửi',
            variant: 'warning',
            onConfirm: function () {
              IP.DB.cancelReminder(id);
              IP.UI.toast({ title: 'Đã hủy lịch nhắc', message: 'Đã cập nhật trạng thái.', type: 'info' });
              render();
            }
          });
        } else if (action === 'delete-reminder') {
          IP.UI.confirmModal({
            title: 'Xóa bản nhắc thanh toán?',
            message: 'Bản nhắc này sẽ bị xóa khỏi danh sách.',
            confirmText: 'Xóa bản nhắc',
            variant: 'danger',
            onConfirm: function () {
              IP.DB.deleteReminder(id);
              IP.UI.toast({ title: 'Đã xóa bản nhắc', message: 'Danh sách đã được cập nhật.', type: 'success' });
              render();
            }
          });
        }
      });
    }
  });
})(window);

      function openUpdateDueDateModal() {
        const inv = IP.DB.getInvoice(currentId);
        if (!inv) return;
        const mId = 'sal-due-modal';
        let mEl = document.getElementById(mId);
        if (mEl) mEl.remove();
        mEl = document.createElement('div');
        mEl.id = mId;
        mEl.className = 'modal fade';
        mEl.tabIndex = -1;
        mEl.innerHTML =
          '<div class="modal-dialog modal-dialog-centered">' +
            '<div class="modal-content">' +
              '<form id="sal-due-form" novalidate>' +
                '<div class="modal-header">' +

                  '<div id="sal-due-err" class="alert alert-danger py-2 small d-none" role="alert"></div>' +

                  '<div class="mb-1">' +
                    '<label class="form-label" for="sal-due-reason">Lý do điều chỉnh hạn (Bắt buộc) <span class="text-danger">*</span></label>' +
                    '<textarea id="sal-due-reason" class="form-control" rows="2" placeholder="VD: Gia hạn thêm 10 ngày theo phụ lục hợp đồng..." required></textarea>' +
                  '</div>' +
                '</div>' +
                '<div class="modal-footer">' +
                  '<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>' +
                  '<button type="submit" class="btn btn-primary">Lưu hạn mới</button>' +
                '</div>' +
              '</form>' +
            '</div>' +
          '</div>';
        document.body.appendChild(mEl);
        const bsModal = window.bootstrap && window.bootstrap.Modal ? new window.bootstrap.Modal(mEl) : null;
        mEl.querySelector('#sal-due-form').addEventListener('submit', function (ev) {
          ev.preventDefault();
          const newDue = mEl.querySelector('#sal-new-due').value;
          const reason = mEl.querySelector('#sal-due-reason').value.trim();
          const errEl = mEl.querySelector('#sal-due-err');
          if (!reason) {
            errEl.textContent = 'Vui lòng nhập lý do cập nhật hạn thanh toán.';
            errEl.classList.remove('d-none');
            return;

          const res = IP.DB.updateInvoice(inv.id, { dueDate: newDue, dueChangeReason: reason });
          if (!res.ok) {
            errEl.textContent = res.error.message;
            errEl.classList.remove('d-none');
            return;

          if (bsModal) bsModal.hide();
          else mEl.remove();
          IP.UI.toast({ title: 'Đã cập nhật hạn thanh toán', message: 'Hạn mới: ' + IP.Fmt.date(newDue), type: 'success' });
          renderDetail();
        });
        if (bsModal) bsModal.show();
      }

      IP.UI.withLoading(root, renderDetail);

      root.addEventListener('click', function (ev) {
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'pick-invoice') {
          currentId = btn.getAttribute('data-id');
          IP.Utils.setQueryParams({ id: currentId });
          renderDetail();
        } else if (action === 'switch-picker') {
          currentId = '';

          renderDetail();
        } else if (action === 'record-payment') {
          IP.UI.openPaymentModal({
            invoiceId: currentId,
            onSaved: function () { renderDetail(); }
          });
        } else if (action === 'print-invoice') {
          window.print();
        } else if (action === 'update-due-date') {
          openUpdateDueDateModal();
        } else if (action === 'save-internal-note') {
          const noteEl = root.querySelector('#sal-internal-note');
          const res = IP.DB.updateInvoice(currentId, { internalNote: noteEl ? noteEl.value : '' });
          if (res.ok) {
            IP.UI.toast({ title: 'Đã lưu ghi chú nội bộ', message: 'Ghi chú đã được cập nhật vào hồ sơ hóa đơn.', type: 'success' });
            renderDetail();
          }
        } else if (action === 'archive-inv') {
          IP.UI.confirmModal({
            title: 'Lưu trữ hóa đơn này?',
            message: 'Hóa đơn chưa có thanh toán sẽ được chuyển vào danh mục lưu trữ.',
            confirmText: 'Lưu trữ',
            variant: 'danger',
            onConfirm: function () {
              const res = IP.DB.archiveInvoice(currentId);
              if (res.ok) {
                IP.UI.toast({ title: 'Đã lưu trữ hóa đơn', message: res.data.number, type: 'success' });
                renderDetail();
              } else {
                IP.UI.toast({ title: 'Không thể lưu trữ', message: res.error.message, type: 'danger' });
              }
            }
          });
        } else if (action === 'void-inv') {
          IP.UI.confirmModal({
            title: 'Hủy hóa đơn này?',
            message: 'Hóa đơn đã hủy sẽ không nhận thêm bất kỳ khoản thanh toán nào.',
            requireReason: true,
            reasonLabel: 'Lý do hủy hóa đơn (bắt buộc)',
            confirmText: 'Xác nhận hủy hóa đơn',
            variant: 'danger',
            onConfirm: function (reason) {
              const res = IP.DB.voidInvoice(currentId, reason);
              if (res.ok) {
                IP.UI.toast({ title: 'Đã hủy hóa đơn', message: res.data.number, type: 'warning' });
                renderDetail();
              } else {
                IP.UI.toast({ title: 'Không thể hủy', message: res.error.message, type: 'danger' });
              }
            }
          });
        }
      });
    }
  });
})(window);

(function (window) {
  'use strict';
  const IP = window.IP;

  IP.Pages.register('manager-overdue-invoices', {
    roles: ['manager'],
    init: function () {
      const root = document.getElementById('main-content');
      if (!root) return;

      const params = IP.Utils.getQueryParams();
      const filterState = {
        q: params.q || '',
        bucket: params.bucket || 'all', // 'all' | '1-30' | '31-60' | '61-90' | '90+'
        owner: params.owner || 'all',
        risk: params.risk || 'all', // 'all' | 'high' | 'medium' | 'low'
        followUpStatus: 'all', // 'all' | 'watching' | 'closed'
        sort: 'overdue_desc'
      };
      const selectedIds = new Set();

      function getOverdueList() {
        const allInvs = IP.DB.listInvoices({ q: filterState.q, includeArchived: false })
          .filter(function (inv) { return IP.Calc.effectiveStatus(inv) === 'overdue'; });

        return allInvs
          .map(function (inv) {
            const cus = IP.DB.getCustomer(inv.customerId);
            const ov = IP.Calc.overdueDays(inv);
            const rem = IP.Calc.remaining(inv);
            const risk = IP.Calc.riskOf(inv, cus);
            const fu = inv.followUp || { assignedTo: (cus && cus.ownerId) || 'usr_sal', status: 'watching', notes: [] };
            const ownerUser = IP.DB.getUser(fu.assignedTo);
            const reminders = IP.DB.listReminders({ invoiceId: inv.id });
            const lastRem = reminders.find(function (r) { return r.status === 'sent'; }) || reminders[0] || null;
            return {
              invoice: inv,
              customer: cus,
              overdueDays: ov,
              remaining: rem,
              risk: risk,
              followUp: fu,
              ownerName: ownerUser ? ownerUser.name : 'Trần Minh Quân',
              lastReminder: lastRem
            };
          })
          .filter(function (item) {
            if (filterState.bucket === '1-30' && !(item.overdueDays >= 1 && item.overdueDays <= 30)) return false;
            if (filterState.bucket === '31-60' && !(item.overdueDays >= 31 && item.overdueDays <= 60)) return false;
            if (filterState.bucket === '61-90' && !(item.overdueDays >= 61 && item.overdueDays <= 90)) return false;
            if (filterState.bucket === '90+' && !(item.overdueDays > 90)) return false;
            if (filterState.owner !== 'all' && item.followUp.assignedTo !== filterState.owner) return false;
            if (filterState.risk !== 'all' && item.risk.level !== filterState.risk) return false;
            if (filterState.followUpStatus !== 'all' && item.followUp.status !== filterState.followUpStatus) return false;
            return true;
          })
          .sort(function (a, b) {
            if (filterState.sort === 'amount_desc') return b.remaining - a.remaining;
            return b.overdueDays - a.overdueDays;
          });
      }

              '<div>' +
                '<div class="d-flex align-items-center gap-2">' +

                  '<div id="drw-assign-err" class="alert alert-danger py-1 small d-none" role="alert"></div>' +
                  '<div class="mb-2">' +

                    '<label class="form-label small" for="drw-assign-reason">Ghi chú / Lý do bàn giao</label>' +

                  '</div>' +

              '<div class="ip-card mb-3">' +

        const action = btn.getAttribute('data-action');

        if (action === 'open-drawer' || action === 'assign-owner') {

          openOverdueDrawer(id);

          openOverdueDrawer(id);

            title: 'Đóng theo dõi hóa đơn quá hạn này?',
            message: 'Vui lòng nhập lý do đóng theo dõi (ví dụ: Đã có biên bản giãn nợ). Bạn có thể mở lại bất cứ lúc nào.',
            requireReason: true,
            confirmText: 'Đóng theo dõi',
            variant: 'danger',
            onConfirm: function (reason) {
              const res = IP.DB.closeFollowUp(id, reason);
              if (res.ok) {
                IP.UI.toast({ title: 'Đã đóng theo dõi', message: 'Trạng thái theo dõi đã chuyển sang Đã đóng.', type: 'info' });
                render();
                openOverdueDrawer(id);
              }
            }
          });
        } else if (action === 'reopen-followup') {
          IP.DB.reopenFollowUp(id);
          IP.UI.toast({ title: 'Đã mở lại theo dõi', message: 'Hóa đơn đã quay lại trạng thái Đang theo dõi.', type: 'success' });
          render();
          openOverdueDrawer(id);
        } else if (action === 'handoff-reminder') {
          const cusId = btn.getAttribute('data-cus');
          const invId = btn.getAttribute('data-inv');
          IP.UI.confirmModal({
            title: 'Chuyển sang vai trò Kinh doanh để soạn nhắc?',
            message: 'Trang Nhắc thanh toán thuộc phân hệ Kinh doanh. Hệ thống sẽ chuyển nhanh sang vai trò Kinh doanh và mở sẵn bộ soạn thảo cho hóa đơn này.',
            confirmText: 'Chuyển & Mở trình soạn nhắc',
            onConfirm: function () {
              IP.Auth.switchRole('sales', false);
              window.location.href = 'sales-payment-reminders.html?customerId=' + cusId + '&invoiceId=' + invId;
            }
          });
        } else if (action === 'toggle-row') {
          if (btn.checked) selectedIds.add(id);
          else selectedIds.delete(id);
          render();
        } else if (action === 'bulk-assign') {
          const salesUsers = IP.DB.listUsers({ role: 'sales', status: 'active' });
          const defaultSales = salesUsers[0] ? salesUsers[0].id : 'usr_sal';
          IP.UI.confirmModal({
            title: 'Giao phụ trách hàng loạt (' + selectedIds.size + ' hóa đơn)',
            message: 'Hệ thống sẽ giao ' + selectedIds.size + ' hóa đơn đã chọn cho ' + (salesUsers[0] ? salesUsers[0].name : 'Trần Minh Quân') + '.',
            requireReason: true,
            reasonLabel: 'Ghi chú chỉ đạo chung (bắt buộc)',
            confirmText: 'Xác nhận phân công',
            onConfirm: function (reason) {
              IP.DB.bulkAssignFollowUp(Array.from(selectedIds), defaultSales, reason);
              selectedIds.clear();
              IP.UI.toast({ title: 'Đã phân công hàng loạt', message: 'Danh sách phụ trách đã được cập nhật.', type: 'success' });
              render();
            }
          });
        } else if (action === 'clear-filters') {
          filterState.q = '';
          filterState.bucket = 'all';
          filterState.owner = 'all';
          filterState.risk = 'all';
          filterState.followUpStatus = 'all';
          IP.Utils.setQueryParams({ state: null, bucket: null, risk: null, owner: null });
          render();
        } else if (action === 'export-csv') {
          const list = getOverdueList();
          const headers = ['Số hóa đơn', 'Khách hàng', 'Hạn thanh toán', 'Số ngày quá hạn', 'Còn phải thu (VND)', 'Phụ trách', 'Mức rủi ro', 'Trạng thái theo dõi'];
          const rows = list.map(function (r) {
            return [r.invoice.number, r.customer ? r.customer.name : '', r.invoice.dueDate, r.overdueDays, r.remaining, r.ownerName, r.risk.label, IP.Fmt.statusLabel(r.followUp.status)];
          });
          IP.UI.downloadCSV('hoa-don-qua-han', headers, rows);
        }
      });
    }
  });
})(window);

          getContext: function () {
            return {
              mode: 'forecast',
              horizonDays: horizonDays,
              scenario: scenario,
              recoveryRate: customAssumptions.recoveryRate,
              delayDays: customAssumptions.delayDays,
              includePending: customAssumptions.includePending
            };
          },
          onAction: function (cmd, result) {
            if (cmd === 'save-report' && result && result.reportPayload) {
              const saved = IP.DB.saveAIReport(result.reportPayload);
              if (saved.ok) {
                IP.UI.toast({ title: 'Đã lưu báo cáo kịch bản', message: 'Kịch bản dự báo đã được lưu kèm các giả định hiện tại.', type: 'success' });

        drawForecastChart(fc);
        bindAssumptionInputs();

      function drawForecastChart(fc) {
        const ctx = document.getElementById('mgr-forecast-chart');
        if (!ctx || !window.Chart) return;
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const textColor = isDark ? '#EAF2EF' : '#152521';
        const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';

        const labels = fc.historical.map(function (h) { return h.label; })
          .concat(fc.periods.map(function (p) { return p.label; }));
        const histData = fc.historical.map(function (h) { return h.actual; })
          .concat(fc.periods.map(function () { return null; }));
        const forecastData = fc.historical.map(function () { return null; })
          .concat(fc.periods.map(function (p) { return p.totalExpected; }));

        chartInstance = new window.Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                type: 'bar',
                label: 'Thực thu lịch sử (VND)',
                data: histData,
                backgroundColor: '#7FB5A8',
                borderRadius: 6
              },
              {
                type: 'line',
                label: 'Dự báo thu kỳ tới (VND)',
                data: forecastData,
                borderColor: '#0E7A68',
                backgroundColor: 'rgba(14, 122, 104, 0.16)',
                fill: true,
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { ticks: { color: textColor }, grid: { display: false } },
              y: { ticks: { color: textColor }, grid: { color: gridColor } }
            }
          }
        });
      }

      function bindAssumptionInputs() {
        const recEl = root.querySelector('#fc-recovery');
        const delEl = root.querySelector('#fc-delay');
        const pendEl = root.querySelector('#fc-pending');
        const errEl = root.querySelector('#fc-assump-err');

        function validateAndUpdate() {
          const rec = Number(recEl.value);
          const del = Number(delEl.value);
          if (isNaN(rec) || rec < 0 || rec > 100) {
            errEl.textContent = 'Tỷ lệ thu hồi nợ quá hạn phải từ 0% đến 100%.';
            errEl.classList.remove('d-none');
            return;
          }
          if (isNaN(del) || del < 0 || del > 60) {
            errEl.textContent = 'Độ trễ thanh toán bình quân phải từ 0 đến 60 ngày.';
            errEl.classList.remove('d-none');
            return;
          }
          errEl.classList.add('d-none');
          customAssumptions.recoveryRate = Math.round(rec);
          customAssumptions.delayDays = Math.round(del);
          customAssumptions.includePending = Boolean(pendEl.checked);
          isCustomModified = true;
          render();
        }

        if (recEl) recEl.addEventListener('change', validateAndUpdate);
        if (delEl) delEl.addEventListener('change', validateAndUpdate);
        if (pendEl) pendEl.addEventListener('change', validateAndUpdate);
      }

      window.addEventListener('ip:themechange', function () {
        render();
      });

      IP.UI.withLoading(root, render);

      root.addEventListener('click', function (ev) {
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'set-horizon') {
          horizonDays = Number(btn.getAttribute('data-days'));
          render();
        } else if (action === 'set-scenario') {
          scenario = btn.getAttribute('data-scenario');
          customAssumptions = Object.assign({}, SCENARIO_PRESETS[scenario]);
          isCustomModified = false;
          render();
        } else if (action === 'reset-assumptions') {
          customAssumptions = Object.assign({}, SCENARIO_PRESETS[scenario]);
          isCustomModified = false;
          IP.UI.toast({ title: 'Đã khôi phục giả định mặc định', message: 'Kịch bản ' + SCENARIO_PRESETS[scenario].label + ' đã về thông số chuẩn.', type: 'info' });
          render();
        } else if (action === 'export-csv') {
          const fc = IP.Calc.forecastCashflow({
            horizonDays: horizonDays,
            scenario: scenario,
            recoveryRate: customAssumptions.recoveryRate,
            delayDays: customAssumptions.delayDays,
            includePending: customAssumptions.includePending
          });
          const headers = ['Kỳ dự báo', 'Từ ngày', 'Đến ngày', 'Thu từ HĐ đến hạn (VND)', 'Thu hồi quá hạn (VND)', 'Đã xác nhận/Chờ khớp (VND)', 'Tổng dự kiến (VND)', 'Lũy kế (VND)'];
          const rows = fc.periods.map(function (p) {
            return [p.label, p.startDate, p.endDate, p.dueExpected, p.overdueRecovery, p.confirmedAmount + p.pendingAmount, p.totalExpected, p.cumulative];
          });
          IP.UI.downloadCSV('du-bao-dong-tien-' + scenario, headers, rows);
        } else if (action === 'print-forecast') {
          window.print();
        } else if (action === 'delete-saved-rpt') {
          const rId = btn.getAttribute('data-id');
          IP.DB.deleteAIReport(rId);
          IP.UI.toast({ title: 'Đã xóa kịch bản đã lưu', message: 'Danh sách đã được cập nhật.', type: 'info' });
          render();
        }
      });
    }
  });
})(window);

                    '</div>' +
                    '<div class="col-sm-5">' +
                      '<label class="form-label" for="uf-password">Mật khẩu <span class="text-danger">*</span></label>' +
                      '<input type="text" id="uf-password" class="form-control font-monospace" value="' + IP.Utils.escapeHtml(existing ? (existing.password || 'Hoabinh@2026') : 'Hoabinh@2026') + '" required minlength="6">' +

                          return '<option value="' + r + '" ' + (existing && existing.role === r ? 'selected' : '') + '>' + IP.Fmt.roleLabel(r) + '</option>';

                      '</select>' +
                    '</div>' +
                    '<div class="col-sm-6">' +
                      '<label class="form-label" for="uf-phone">Số điện thoại</label>' +

            name: mEl.querySelector('#uf-name').value,
            email: mEl.querySelector('#uf-email').value,
            password: mEl.querySelector('#uf-password').value,

          };

            errEl.textContent = res.error.message;
            errEl.classList.remove('d-none');

          else mEl.remove();

            title: existing ? 'Đã cập nhật tài khoản' : 'Đã tạo tài khoản mới',

          });
          render();
        });
