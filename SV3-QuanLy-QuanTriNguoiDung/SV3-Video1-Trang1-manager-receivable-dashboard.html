/**
 * @owner CORE
 * @spec §4.2, §8.1, §8.2, §8.3, §10.1, §10.4 Business Calculation Engine (IP.Calc)
 */
(function (window) {
  'use strict';
  const IP = (window.IP = window.IP || {});

  function diffDays(dateStrA, dateStrB) {
    // Returns (A - B) in whole days
    const a = new Date(String(dateStrA).slice(0, 10) + 'T12:00:00');
    const b = new Date(String(dateStrB).slice(0, 10) + 'T12:00:00');
    return Math.round((a.getTime() - b.getTime()) / (1000 * 3600 * 24));
  }

  function effectiveStatus(invoice, asOfDate) {
    if (!invoice) return 'draft';
    if (invoice.voided) return 'voided';
    if (invoice.archived) return 'archived';
    if (!invoice.sentAt) return 'draft';

    const total = Number(invoice.total || 0);
    const paid = Number(invoice.paidAmount || 0);
    if (paid >= total && total > 0) return 'paid';

    const today = asOfDate || (IP.Seed ? IP.Seed.todayISO() : new Date().toISOString().slice(0, 10));
    if (invoice.dueDate && invoice.dueDate < today && (total - paid) > 0) {
      return 'overdue';
    }
    if (paid > 0) return 'partial';
    return 'sent';
  }

  function remaining(invoice) {
    if (!invoice || invoice.voided || invoice.archived) return 0;
    return Math.max(0, Math.round(Number(invoice.total || 0) - Number(invoice.paidAmount || 0)));
  }

  function overdueDays(invoice, asOfDate) {
    if (!invoice || invoice.voided || invoice.archived || !invoice.sentAt) return 0;
    const rem = remaining(invoice);
    if (rem <= 0) return 0;
    const today = asOfDate || IP.Seed.todayISO();
    const d = diffDays(today, invoice.dueDate);
    return d > 0 ? d : 0;
  }

  function daysUntilDue(invoice, asOfDate) {
    if (!invoice || !invoice.dueDate) return 0;
    const today = asOfDate || IP.Seed.todayISO();
    return diffDays(invoice.dueDate, today);
  }

  function computeTotals(items) {
    let subtotal = 0;
    let discountTotal = 0;
    let vatTotal = 0;
    const computed = (items || []).map(function (it) {
      const qty = Math.max(0, Number(it.quantity || 0));
      const price = Math.max(0, Number(it.unitPrice || 0));
      const disc = Math.min(100, Math.max(0, Number(it.discountPercent || 0)));
      const vat = [0, 5, 8, 10].includes(Number(it.vatRate)) ? Number(it.vatRate) : 10;
      const gross = Math.round(qty * price);
      const discAmt = Math.round((gross * disc) / 100);
      const afterDisc = gross - discAmt;
      const vatAmt = Math.round((afterDisc * vat) / 100);
      const lineTotal = afterDisc + vatAmt;
      subtotal += gross;
      discountTotal += discAmt;
      vatTotal += vatAmt;
      return Object.assign({}, it, {
        quantity: qty,
        unitPrice: price,
        discountPercent: disc,
        vatRate: vat,
        lineTotal: lineTotal
      });
    });
    return {
      items: computed,
      subtotal: subtotal,
      discountTotal: discountTotal,
      vatTotal: vatTotal,
      total: subtotal - discountTotal + vatTotal
    };
  }

  function customerBalance(customerId) {
    const st = IP.DB.getState();
    const invs = st.invoices.filter(function (inv) {
      return inv.customerId === customerId && !inv.voided && !inv.archived && inv.sentAt;
    });
    let totalReceivable = 0;
    let overdueAmount = 0;
    let openInvoiceCount = 0;
    let overdueInvoiceCount = 0;
    let maxOverdueDays = 0;
    const buckets = { current: 0, b1_30: 0, b31_60: 0, b61_90: 0, b90plus: 0 };

    invs.forEach(function (inv) {
      const rem = remaining(inv);
      if (rem <= 0) return;
      openInvoiceCount++;
      totalReceivable += rem;
      const ov = overdueDays(inv);
      if (ov > 0) {
        overdueInvoiceCount++;
        overdueAmount += rem;
        if (ov > maxOverdueDays) maxOverdueDays = ov;
        if (ov <= 30) buckets.b1_30 += rem;
        else if (ov <= 60) buckets.b31_60 += rem;
        else if (ov <= 90) buckets.b61_90 += rem;
        else buckets.b90plus += rem;
      } else {
        buckets.current += rem;
      }
    });

    const custPayments = st.payments
      .filter(function (p) { return p.customerId === customerId && p.status === 'confirmed'; })
      .sort(function (a, b) { return String(b.paidAt).localeCompare(String(a.paidAt)); });

    return {
      customerId: customerId,
      totalReceivable: totalReceivable,
      overdueAmount: overdueAmount,
      openInvoiceCount: openInvoiceCount,
      overdueInvoiceCount: overdueInvoiceCount,
      maxOverdueDays: maxOverdueDays,
      buckets: buckets,
      lastPaymentAt: custPayments.length > 0 ? custPayments[0].paidAt : null
    };
  }

  function aging(invoicesInput, asOfDate) {
    const list = invoicesInput || IP.DB.listInvoices({ includeArchived: false });
    const res = {
      current: 0,
      b1_30: 0,
      b31_60: 0,
      b61_90: 0,
      b90plus: 0,
      counts: { current: 0, b1_30: 0, b31_60: 0, b61_90: 0, b90plus: 0 },
      totalOverdue: 0,
      totalReceivable: 0
    };

    list.forEach(function (inv) {
      const st = effectiveStatus(inv, asOfDate);
      if (['draft', 'paid', 'voided', 'archived'].includes(st)) return;
      const rem = remaining(inv);
      if (rem <= 0) return;
      res.totalReceivable += rem;
      const ov = overdueDays(inv, asOfDate);
      if (ov <= 0) {
        res.current += rem;
        res.counts.current++;
      } else {
        res.totalOverdue += rem;
        if (ov <= 30) { res.b1_30 += rem; res.counts.b1_30++; }
        else if (ov <= 60) { res.b31_60 += rem; res.counts.b31_60++; }
        else if (ov <= 90) { res.b61_90 += rem; res.counts.b61_90++; }
        else { res.b90plus += rem; res.counts.b90plus++; }
      }
    });
    return res;
  }

  function dso(periodDays) {
    const days = Number(periodDays || 90);
    const st = IP.DB.getState();
    const minDate = IP.Seed.addDays(-days);
    const issued = st.invoices.filter(function (inv) {
      return !inv.voided && !inv.archived && inv.sentAt && inv.issueDate >= minDate;
    });
    const totalCreditSales = issued.reduce(function (s, i) { return s + Number(i.total || 0); }, 0);
    const totalAR = issued.reduce(function (s, i) { return s + remaining(i); }, 0);
    const dsoDays = totalCreditSales > 0 ? Math.round((totalAR / totalCreditSales) * days) : 34;
    const prevDays = Math.max(18, dsoDays + 4);
    return {
      days: dsoDays,
      previousDays: prevDays,
      delta: dsoDays - prevDays,
      formulaText: 'DSO = (Tổng phải thu còn lại trong kỳ / Tổng doanh thu phát hành tín dụng trong kỳ) × ' + days + ' ngày'
    };
  }

  function riskOf(invoice, customerObj) {
    const inv = invoice || {};
    const cus = customerObj || (inv.customerId ? IP.DB.getCustomer(inv.customerId) : null) || {};
    const ov = overdueDays(inv);
    const bal = inv.customerId ? customerBalance(inv.customerId).totalReceivable : remaining(inv);
    const limit = Number(cus.creditLimit || 200000000);
    const utilRatio = limit > 0 ? (bal / limit) : 0;
    const lateHist = Number(cus.latePaymentCount || 0);

    let score = 0;
    const reasons = [];

    if (ov > 60) { score += 50; reasons.push('Quá hạn ' + ov + ' ngày (> 60 ngày)'); }
    else if (ov > 30) { score += 35; reasons.push('Quá hạn ' + ov + ' ngày (31–60 ngày)'); }
    else if (ov > 0) { score += 15; reasons.push('Quá hạn ' + ov + ' ngày (1–30 ngày)'); }

    if (utilRatio >= 0.85) {
      score += 30;
      reasons.push('Dư nợ đạt ' + Math.round(utilRatio * 100) + '% hạn mức tín dụng');
    } else if (utilRatio >= 0.6) {
      score += 15;
      reasons.push('Dư nợ chiếm ' + Math.round(utilRatio * 100) + '% hạn mức');
    }

    if (lateHist >= 3) {
      score += 25;
      reasons.push('Lịch sử trễ hạn ' + lateHist + ' lần');
    } else if (lateHist >= 1) {
      score += 10;
      reasons.push('Lịch sử trễ hạn ' + lateHist + ' lần');
    }

    let level = 'low';
    let label = 'Thấp';
    if (score >= 60) { level = 'high'; label = 'Cao'; }
    else if (score >= 30) { level = 'medium'; label = 'Trung bình'; }

    return {
      level: level,
      label: label,
      score: score,
      reasons: reasons.length ? reasons : ['Trong hạn, tỷ lệ sử dụng hạn mức an toàn'],
      formula: 'Điểm rủi ro = Điểm ngày quá hạn (0–50) + Điểm tỷ lệ Dư nợ/Hạn mức (0–30) + Điểm lịch sử trễ hạn (0–25). Cao >= 60, Trung bình 30–59, Thấp < 30.'
    };
  }

  function reconciliationSuggestions(payment) {
    if (!payment) return [];
    const st = IP.DB.getState();
    const candidates = st.invoices.filter(function (inv) {
      const eff = effectiveStatus(inv);
      return ['sent', 'partial', 'overdue'].includes(eff) && remaining(inv) > 0;
    });

    const scored = candidates.map(function (inv) {
      const rem = remaining(inv);
      const cus = IP.DB.getCustomer(inv.customerId);
      let score = 0;
      const reasons = [];

      const sameCus = (payment.customerId && payment.customerId === inv.customerId) ||
        (payment.suggestedCustomerId && payment.suggestedCustomerId === inv.customerId);
      if (sameCus) {
        score += 45;
        reasons.push('Cùng khách hàng');
      }

      if (payment.transferContent && payment.transferContent.toUpperCase().includes(inv.number.toUpperCase())) {
        score += 40;
        reasons.push('Nội dung CK chứa mã ' + inv.number);
      }

      const diff = Math.abs(rem - Number(payment.amount || 0));
      const diffPct = rem > 0 ? (diff / rem) : 1;
      if (diff === 0) {
        score += 45;
        reasons.push('Khớp chính xác 100% số còn phải thu');
      } else if (diffPct <= 0.15) {
        score += 25;
        reasons.push('Số tiền gần khớp (lệch ' + IP.Fmt.currency(diff) + ')');
      } else if (payment.amount < rem) {
        score += 10;
        reasons.push('Thanh toán một phần (' + Math.round((payment.amount / rem) * 100) + '%)');
      }

      const dayGap = Math.abs(diffDays(payment.paidAt || IP.Seed.todayISO(), inv.dueDate));
      if (dayGap <= 15) {
        score += 10;
        reasons.push('Gần hạn thanh toán');
      }

      return {
        invoice: inv,
        customer: cus,
        remaining: rem,
        score: Math.min(100, score),
        reasons: reasons
      };
    });

    return scored
      .filter(function (x) { return x.score >= 25; })
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, 6);
  }

  function forecastCashflow(opts) {
    const o = opts || {};
    const horizon = Number(o.horizonDays || 60);
    const scenario = o.scenario || 'base'; // 'base' | 'conservative' | 'optimistic'
    const scenarioDefaults = {
      base: { recoveryRate: 65, delayDays: 7 },
      conservative: { recoveryRate: 45, delayDays: 16 },
      optimistic: { recoveryRate: 85, delayDays: 2 }
    };
    const def = scenarioDefaults[scenario] || scenarioDefaults.base;
    const recoveryRate = o.recoveryRate !== undefined ? Number(o.recoveryRate) : def.recoveryRate;
    const delayDays = o.delayDays !== undefined ? Number(o.delayDays) : def.delayDays;
    const includePending = Boolean(o.includePending);

    const st = IP.DB.getState();
    const openInvoices = st.invoices.filter(function (inv) {
      const eff = effectiveStatus(inv);
      return ['sent', 'partial', 'overdue'].includes(eff) && remaining(inv) > 0;
    });
    const pendingTotal = st.payments
      .filter(function (p) { return p.status === 'pending' && !p.discrepancy; })
      .reduce(function (s, p) { return s + Number(p.amount || 0); }, 0);

    const bucketCount = horizon === 30 ? 4 : (horizon === 60 ? 6 : 6);
    const stepDays = Math.round(horizon / bucketCount);
    const today = IP.Seed.todayISO();

    const totalOverduePool = openInvoices
      .filter(function (inv) { return overdueDays(inv) > 0; })
      .reduce(function (s, inv) { return s + remaining(inv); }, 0);
    const recoverableOverdueTotal = Math.round((totalOverduePool * recoveryRate) / 100);
    const perPeriodOverdueRecovery = Math.round(recoverableOverdueTotal / bucketCount);

    let cumulative = 0;
    const periods = [];
    for (let i = 0; i < bucketCount; i++) {
      const startOffset = i * stepDays;
      const endOffset = (i + 1) * stepDays;
      const startDate = IP.Seed.addDays(startOffset, today);
      const endDate = IP.Seed.addDays(endOffset, today);

      const dueExpected = openInvoices
        .filter(function (inv) {
          if (overdueDays(inv) > 0) return false;
          const shiftedDue = IP.Seed.addDays(delayDays, inv.dueDate);
          return shiftedDue >= startDate && shiftedDue <= endDate;
        })
        .reduce(function (s, inv) { return s + remaining(inv); }, 0);

      const pendingAdd = (i === 0 && includePending) ? pendingTotal : 0;
      const confirmedAdd = i === 0 ? Math.round(st.payments
        .filter(function (p) { return p.status === 'confirmed' && p.paidAt >= IP.Seed.addDays(-7, today); })
        .reduce(function (s, p) { return s + Number(p.allocatedAmount || p.amount || 0); }, 0) * 0.35) : 0;

      const totalExpected = dueExpected + perPeriodOverdueRecovery + pendingAdd + confirmedAdd;
      cumulative += totalExpected;

      periods.push({
        index: i + 1,
        label: 'Kỳ ' + (i + 1) + ' (' + IP.Fmt.date(startDate).slice(0, 5) + '–' + IP.Fmt.date(endDate).slice(0, 5) + ')',
        startDate: startDate,
        endDate: endDate,
        dueExpected: dueExpected,
        overdueRecovery: perPeriodOverdueRecovery,
        confirmedAmount: confirmedAdd,
        pendingAmount: pendingAdd,
        totalExpected: totalExpected,
        cumulative: cumulative,
        isLowCash: totalExpected < 45000000
      });
    }

    const historical = [
      { label: 'Tháng T-2', actual: 195000000 },
      { label: 'Tháng T-1', actual: 242000000 },
      { label: 'Tháng này (Đã thu)', actual: st.payments.filter(function (p) { return p.status === 'confirmed' && p.paidAt >= IP.Seed.addDays(-30, today); }).reduce(function (s, p) { return s + Number(p.allocatedAmount || p.amount || 0); }, 0) }
    ];

    return {
      horizonDays: horizon,
      scenario: scenario,
      assumptions: {
        recoveryRate: recoveryRate,
        delayDays: delayDays,
        includePending: includePending
      },
      periods: periods,
      historical: historical,
      totals: {
        dueExpected: periods.reduce(function (s, p) { return s + p.dueExpected; }, 0),
        overdueRecovery: periods.reduce(function (s, p) { return s + p.overdueRecovery; }, 0),
        confirmedAmount: periods.reduce(function (s, p) { return s + p.confirmedAmount; }, 0),
        pendingAmount: periods.reduce(function (s, p) { return s + p.pendingAmount; }, 0),
        cumulative: cumulative
      }
    };
  }

  IP.Calc = {
    diffDays: diffDays,
    effectiveStatus: effectiveStatus,
    remaining: remaining,
    overdueDays: overdueDays,
    daysUntilDue: daysUntilDue,
    computeTotals: computeTotals,
    customerBalance: customerBalance,
    aging: aging,
    dso: dso,
    riskOf: riskOf,
    reconciliationSuggestions: reconciliationSuggestions,
    forecastCashflow: forecastCashflow
  };
})(window);

        parsed.name = u.name;
        parsed.email = u.email;
        parsed.role = u.role;
        parsed.title = u.title;
      }
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function writeSession(sess) {
    try {
      window.localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
    } catch (e) {}
  }

  function getSkipRoleLanding() {
    try {
      return window.localStorage.getItem(SKIP_ROLE_LANDING_KEY) === 'true';
    } catch (e) {
      return false;
    }
  }

  function setSkipRoleLanding(val) {
    try {
      window.localStorage.setItem(SKIP_ROLE_LANDING_KEY, val ? 'true' : 'false');
    } catch (e) {}
  }

  function isRoleLandingHiddenForever(role) {
    if (getSkipRoleLanding()) return true;
    if (!role) return false;
    try {
      const raw = window.localStorage.getItem(HIDE_ROLE_LANDING_MAP_KEY);
      if (!raw) return false;
      const map = JSON.parse(raw);
      return Boolean(map && map[role]);
    } catch (e) {
      return false;
    }
  }

  function setRoleLandingHiddenForever(role, hidden) {
    if (!role) return;
    try {
      const raw = window.localStorage.getItem(HIDE_ROLE_LANDING_MAP_KEY);
      const map = raw ? JSON.parse(raw) : {};
      map[role] = Boolean(hidden);
      window.localStorage.setItem(HIDE_ROLE_LANDING_MAP_KEY, JSON.stringify(map));
    } catch (e) {}
  }

  function isRoleLandingDismissed(role) {
    if (isRoleLandingHiddenForever(role)) return true;
    try {
      const raw = window.sessionStorage.getItem(DISMISSED_ROLE_LANDING_KEY);
      if (!raw) return false;
      const map = JSON.parse(raw);
      return Boolean(map && map[role]);
    } catch (e) {
      return false;
    }
  }

  function setRoleLandingDismissed(role, dismissed, rememberForever) {
    if (rememberForever !== undefined) {
      setRoleLandingHiddenForever(role, Boolean(rememberForever));
      if (!rememberForever) {
        setSkipRoleLanding(false);
      }
    }
    try {
      const raw = window.sessionStorage.getItem(DISMISSED_ROLE_LANDING_KEY);
      const map = raw ? JSON.parse(raw) : {};
      map[role] = Boolean(dismissed);
      window.sessionStorage.setItem(DISMISSED_ROLE_LANDING_KEY, JSON.stringify(map));
    } catch (e) {}
  }

  function openLoginModal(opts) {
    IP.DB.init();
    const o = opts || {};
    const existingSession = readSession();
    const isMandatory = o.mandatory !== undefined ? Boolean(o.mandatory) : !existingSession;
    const prefillRole = o.role || '';
    const redirectUrl = o.redirectUrl || '';

    const activeUsers = IP.DB.listUsers({ status: 'active' });

        label: IP.Fmt.roleLabel(preset.role),
        name: dbUser ? dbUser.name : preset.name,

        password: dbUser ? dbUser.password : preset.password,

        badgeClass: preset.badgeClass,
        desc: isEn ? preset.descEn : preset.desc

    });

    const defaultAcc = roleAccounts.find(function (a) { return a.role === prefillRole; }) || roleAccounts[0];
    const skipLandingChecked = getSkipRoleLanding() ? 'checked' : '';

    const cardsHtml = roleAccounts.map(function (acc) {

      return (

          '<div class="d-flex justify-content-between align-items-center mb-1">' +
            '<span class="badge ' + acc.badgeClass + ' fw-bold">' + IP.Utils.escapeHtml(acc.label) + '</span>' +

          '<div class="p-2 rounded bg-body-tertiary border small font-monospace mb-2" style="font-size:0.75rem;">' +

          '</div>' +
          '<div class="d-flex gap-1">' +
            '<button type="button" class="btn btn-sm btn-outline-secondary flex-grow-1 py-1" style="font-size:0.76rem;min-height:30px;" data-popup-action="fill-account" data-email="' + IP.Utils.escapeHtml(acc.email) + '" data-pass="' + IP.Utils.escapeHtml(acc.password) + '" data-role="' + acc.role + '">' +
              '<i class="bi bi-input-cursor-text"></i> ' + (isEn ? 'Fill Credentials' : 'Điền thông tin') +
            '</button>' +
            '<button type="button" class="btn btn-sm btn-primary flex-grow-1 py-1" style="font-size:0.76rem;min-height:30px;" data-popup-action="instant-login" data-email="' + IP.Utils.escapeHtml(acc.email) + '" data-pass="' + IP.Utils.escapeHtml(acc.password) + '" data-role="' + acc.role + '">' +
              '<i class="bi bi-box-arrow-in-right"></i> ' + (isEn ? 'Sign In Now' : 'Đăng nhập ngay') +
            '</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    modalEl = document.createElement('div');
    modalEl.id = modalId;
    modalEl.className = 'modal fade';
    modalEl.tabIndex = -1;
    modalEl.setAttribute('aria-labelledby', 'ip-mandatory-login-title');
    modalEl.setAttribute('aria-modal', 'true');

    modalEl.innerHTML =

        '<div class="modal-content border-0 shadow-lg overflow-hidden" style="border-radius:18px;">' +
          '<div class="modal-header text-white py-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-2" style="background:var(--ip-sidebar);border-bottom:1px solid rgba(255,255,255,0.1);">' +
            '<div class="d-flex align-items-center gap-3">' +
              '<span style="width:34px;height:34px;display:inline-block">' + (IP.Layout ? IP.Layout.LOGO_SVG : '') + '</span>' +
              '<div>' +
                '<div class="d-flex align-items-center gap-2 flex-wrap">' +
                  '<h2 class="modal-title fs-5 fw-bold mb-0 text-white" id="ip-mandatory-login-title">' +
                    (isEn ? 'Sign In to InvoicePilot B2B Receivables Suite' : 'Đăng nhập Hệ thống Quản trị Hóa đơn & Công nợ InvoicePilot') +
                  '</h2>' +
                  '<span class="badge bg-warning text-dark">' + (isEn ? 'Mandatory Authentication' : 'Yêu cầu xác thực bắt buộc') + '</span>' +
                '</div>' +
                '<div class="small text-white-50">' +
                  (isEn
                    ? 'Select a pre-issued role account below or enter credentials issued by the System Administrator.'
                    : 'Chọn tài khoản của từng nghiệp vụ bên dưới hoặc nhập thông tin tài khoản do Quản trị viên cấp.') +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="d-flex align-items-center gap-2">' +
              '<button type="button" class="btn btn-sm btn-outline-light py-1 px-2" data-popup-action="toggle-lang">' +
                '<i class="bi bi-translate"></i> ' + (isEn ? 'EN · USD' : 'VI · VND') +
              '</button>' +
              (!isMandatory
                ? '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>'
                : '') +
            '</div>' +
          '</div>' +
          '<div class="modal-body p-4">' +
            '<div class="row g-4 align-items-stretch">' +
              '<div class="col-lg-7">' +
                '<div class="d-flex justify-content-between align-items-center mb-2">' +
                  '<span class="ip-label-sm text-primary"><i class="bi bi-person-vcard me-1"></i>' + (isEn ? '4 Issued Business Role Accounts' : 'Tài khoản 4 Nghiệp vụ được cấp sẵn') + '</span>' +
                  '<span class="small text-muted">' + (isEn ? 'Click "Fill Credentials" or "Sign In Now"' : 'Bấm "Điền thông tin" hoặc "Đăng nhập ngay"') + '</span>' +
                '</div>' +
                '<div class="auth-role-grid mb-3">' + cardsHtml + '</div>' +
                '<div class="p-3 rounded border bg-body-tertiary small">' +
                  '<div class="fw-bold mb-1"><i class="bi bi-shield-lock text-primary me-1"></i>' + (isEn ? 'Strict Role Account Governance:' : 'Chính sách phân quyền tài khoản nghiêm ngặt:') + '</div>' +
                  '<ul class="mb-0 ps-3 text-muted">' +
                    '<li>' + (isEn
                      ? 'Only the <strong>System Administrator (Admin - admin@hoabinhdigital.vn)</strong> is permitted to <strong>create, edit, suspend, or delete accounts</strong> for other business roles.'
                      : 'Chỉ duy nhất <strong>Quản trị viên (Admin - admin@hoabinhdigital.vn)</strong> mới có quyền <strong>tạo mới, chỉnh sửa, khóa hoặc xóa tài khoản</strong> của các nghiệp vụ khác.') + '</li>' +
                    '<li>' + (isEn
                      ? 'Accountant, Sales, and Manager accounts are restricted strictly to their assigned business modules.'
                      : 'Các vai trò Kế toán, Kinh doanh, Quản lý chỉ được phép truy cập đúng phân hệ nghiệp vụ được phân quyền.') + '</li>' +
                  '</ul>' +
                '</div>' +
              '</div>' +
              '<div class="col-lg-5">' +
                '<div class="p-3 p-md-4 rounded border bg-body h-100 d-flex flex-column justify-content-between">' +
                  '<div>' +
                    '<h3 class="fs-5 fw-bold mb-1">' + (isEn ? 'Authentication Credentials' : 'Thông tin xác thực') + '</h3>' +
                    '<p class="small text-muted mb-3">' + (isEn ? 'Sign in to access your role workspace.' : 'Đăng nhập để mở không gian làm việc theo vai trò nghiệp vụ.') + '</p>' +
                    '<div id="ip-popup-login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>' +
                    '<form id="ip-popup-login-form" novalidate>' +
                      '<div class="mb-3">' +
                        '<label class="form-label" for="ip-popup-email">' + (isEn ? 'Work Email' : 'Email công việc') + ' <span class="text-danger">*</span></label>' +
                        '<input type="email" id="ip-popup-email" class="form-control" value="' + IP.Utils.escapeHtml(defaultAcc.email) + '" placeholder="ten@hoabinhdigital.vn" required>' +
                      '</div>' +
                      '<div class="mb-3">' +
                        '<div class="d-flex justify-content-between align-items-center">' +
                          '<label class="form-label" for="ip-popup-password">' + (isEn ? 'Password' : 'Mật khẩu') + ' <span class="text-danger">*</span></label>' +
                          '<a href="forgot-password.html" class="small text-decoration-none">' + (isEn ? 'Forgot password?' : 'Quên mật khẩu?') + '</a>' +
                        '</div>' +
                        '<div class="input-group">' +
                          '<input type="password" id="ip-popup-password" class="form-control" value="' + IP.Utils.escapeHtml(defaultAcc.password) + '" required>' +
                          '<button type="button" class="btn btn-outline-secondary" id="ip-popup-toggle-pass" aria-label="Show/hide password"><i class="bi bi-eye"></i></button>' +
                        '</div>' +
                      '</div>' +
                      '<div class="form-check mb-2">' +
                        '<input class="form-check-input" type="checkbox" id="ip-popup-remember" checked>' +
                        '<label class="form-check-label small" for="ip-popup-remember">' + (isEn ? 'Remember session on this browser' : 'Ghi nhớ phiên đăng nhập trên trình duyệt này') + '</label>' +
                      '</div>' +
                      '<div class="form-check p-2 rounded border bg-warning-subtle mb-3">' +
                        '<input class="form-check-input ms-0 me-2" type="checkbox" id="ip-popup-skip-role-landing" ' + skipLandingChecked + '>' +
                        '<label class="form-check-label small fw-semibold text-dark" for="ip-popup-skip-role-landing">' +
                          (isEn
                            ? 'Do not show role intro landing page upon login (jump straight to task workspace)'
                            : 'Không hiển thị trang giới thiệu nghiệp vụ (Landing Page) khi đăng nhập, nhảy thẳng vào trang tác vụ') +
                        '</label>' +
                      '</div>' +
                      '<button type="submit" class="btn btn-primary w-100 py-2" id="ip-popup-submit-btn">' +
                        '<i class="bi bi-box-arrow-in-right"></i> ' + (isEn ? 'Sign In to System' : 'Đăng nhập hệ thống') +
                      '</button>' +
                    '</form>' +
                  '</div>' +
                  '<div class="small text-muted border-top pt-3 mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">' +
                    '<span>' + (isEn ? 'Entity: <strong>Hoa Binh Digital Solutions JSC</strong>' : 'Đơn vị: <strong>CTCP Giải pháp Số hóa Hòa Bình</strong>') + '</span>' +
                    '<span class="badge bg-secondary-subtle text-body-secondary">NĐ 123 & TT 78</span>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.body.appendChild(modalEl);

    const bsModal = window.bootstrap && window.bootstrap.Modal
      ? new window.bootstrap.Modal(modalEl, {
          backdrop: isMandatory ? 'static' : true,
          keyboard: !isMandatory
        })
      : null;

    const emailInput = modalEl.querySelector('#ip-popup-email');
    const passInput = modalEl.querySelector('#ip-popup-password');
    const skipInput = modalEl.querySelector('#ip-popup-skip-role-landing');
    const rememberInput = modalEl.querySelector('#ip-popup-remember');
    const alertBox = modalEl.querySelector('#ip-popup-login-alert');
    const togglePassBtn = modalEl.querySelector('#ip-popup-toggle-pass');
    const form = modalEl.querySelector('#ip-popup-login-form');

    if (togglePassBtn) {
      togglePassBtn.addEventListener('click', function () {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        togglePassBtn.innerHTML = '<i class="bi ' + (isPass ? 'bi-eye-slash' : 'bi-eye') + '"></i>';
      });
    }

    function executeLogin(emailVal, passVal) {
      alertBox.classList.add('d-none');
      const skipLanding = Boolean(skipInput && skipInput.checked);
      setSkipRoleLanding(skipLanding);

      const res = IP.Auth.login(emailVal, passVal, rememberInput ? rememberInput.checked : true);
      if (!res.ok) {
        alertBox.textContent = res.error.message;
        alertBox.classList.remove('d-none');
        return;
      }

      if (!skipLanding && !isRoleLandingHiddenForever(res.data.role)) {
        setRoleLandingDismissed(res.data.role, false);
      } else {
        setRoleLandingDismissed(res.data.role, true, skipLanding ? true : undefined);
      }

      if (bsModal) bsModal.hide();
      modalEl.remove();
      document.querySelectorAll('.modal-backdrop').forEach(function (b) { b.remove(); });
      document.body.classList.remove('modal-open');
      document.body.style.removeProperty('overflow');
      document.body.style.removeProperty('padding-right');

      const role = res.data.role;
      try {
        window.dispatchEvent(new CustomEvent('ip:role-changed', { detail: { role: role } }));
      } catch (e) {}

      if (typeof o.onSuccess === 'function') {
        o.onSuccess(res.data);
        return;
      }

      if (redirectUrl && IP.Auth.isRedirectPermitted(redirectUrl, role)) {
        if (typeof window.IP_CanvasNav === 'function') window.IP_CanvasNav(redirectUrl);
        else window.location.href = redirectUrl;
      } else {
        const targetHome = IP.Routes.homeForRole(role);
        if (typeof window.IP_CanvasNav === 'function') window.IP_CanvasNav(targetHome);
        else window.location.href = targetHome;
      }
    }

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      executeLogin(emailInput.value.trim(), passInput.value);
    });

    modalEl.addEventListener('click', function (ev) {
      const btn = ev.target.closest('[data-popup-action]');
      if (!btn) return;
      const act = btn.getAttribute('data-popup-action');
      if (act === 'toggle-lang') {
        if (bsModal) bsModal.hide();
        modalEl.remove();
        document.querySelectorAll('.modal-backdrop').forEach(function (b) { b.remove(); });
        if (IP.I18n) IP.I18n.toggleLang();
        setTimeout(function () {
          openLoginModal(o);
        }, 60);
        return;
      }
      const em = btn.getAttribute('data-email');
      const pw = btn.getAttribute('data-pass');
      const r = btn.getAttribute('data-role');

      modalEl.querySelectorAll('.auth-role-card').forEach(function (c) {
        c.classList.toggle('active', c.getAttribute('data-role-card') === r);
      });

      if (act === 'fill-account') {
        emailInput.value = em;
        passInput.value = pw;
        alertBox.classList.add('d-none');
        emailInput.focus();
      } else if (act === 'instant-login') {
        emailInput.value = em;
        passInput.value = pw;
        executeLogin(em, pw);
      }
    });

    if (bsModal) bsModal.show();
    else {
      modalEl.classList.add('show');
      modalEl.style.display = 'block';
    }
  }

  IP.Auth = {
    SESSION_KEY: SESSION_KEY,
    ROLE_ACCOUNTS: ROLE_ACCOUNTS,

    getSession: function () {
      return readSession();
    },

    getSkipRoleLanding: getSkipRoleLanding,
    setSkipRoleLanding: setSkipRoleLanding,
    isRoleLandingHiddenForever: isRoleLandingHiddenForever,
    setRoleLandingHiddenForever: setRoleLandingHiddenForever,
    isRoleLandingDismissed: isRoleLandingDismissed,
    setRoleLandingDismissed: setRoleLandingDismissed,
    openLoginModal: openLoginModal,

    login: function (email, password, remember) {
      IP.DB.init();
      const cleanEmail = String(email || '').trim().toLowerCase();
      const cleanPass = String(password || '');

      if (!cleanEmail || !IP.Utils.isValidEmail(cleanEmail)) {
        return { ok: false, error: { code: 'VALIDATION', message: 'Vui lòng nhập địa chỉ email công việc hợp lệ.', field: 'email' } };
      }
      if (!cleanPass) {
        return { ok: false, error: { code: 'VALIDATION', message: 'Vui lòng nhập mật khẩu xác thực.', field: 'password' } };
      }

      const st = IP.DB.getState();
      const user = st.users.find(function (u) { return u.email.toLowerCase() === cleanEmail; });

      const genericAuthErr = {
        ok: false,
        error: {
          code: 'AUTH_FAILED',
          message: 'Email hoặc mật khẩu không chính xác, hoặc tài khoản đã bị Quản trị viên tạm khóa.'
        }
      };

      if (!user) return genericAuthErr;
      if (user.status === 'disabled') return genericAuthErr;
      if (String(user.password || '') !== cleanPass) return genericAuthErr;

      if (user.status === 'invited') {
        user.status = 'active';
      }
      user.lastLoginAt = new Date().toISOString();
      IP.DB._commit();

      const session = {
        userId: user.id,
        name: user.name,
        email: user.email,
        role: user.role,
        title: user.title || IP.Fmt.roleLabel(user.role),
        remember: Boolean(remember),
        loggedInAt: user.lastLoginAt
      };
      writeSession(session);
      return { ok: true, data: session };
    },

    logout: function (redirectUrl) {
      try {
        window.localStorage.removeItem(SESSION_KEY);
      } catch (e) {}
      try {
        window.dispatchEvent(new CustomEvent('ip:role-changed', { detail: { role: 'public' } }));
      } catch (e) {}
      if (redirectUrl !== false) {
        const target = redirectUrl || 'index.html';
        if (typeof window.IP_CanvasNav === 'function') window.IP_CanvasNav(target);
        else window.location.href = target;
      }
    },

    switchRole: function (role, navigateImmediately) {
      IP.DB.init();
      const preset = ROLE_ACCOUNTS.find(function (d) { return d.role === role; }) || ROLE_ACCOUNTS[0];
      const st = IP.DB.getState();
      const user = st.users.find(function (u) { return u.email.toLowerCase() === preset.email.toLowerCase() && u.status !== 'disabled'; }) ||
        st.users.find(function (u) { return u.role === preset.role && u.status === 'active'; });

      const session = {
        userId: user ? user.id : ('usr_' + preset.role.slice(0, 3)),
        name: user ? user.name : preset.name,
        email: user ? user.email : preset.email,
        role: preset.role,
        title: user ? user.title : preset.label,
        remember: true,
        loggedInAt: new Date().toISOString()
      };
      writeSession(session);
      if (!isRoleLandingHiddenForever(preset.role)) {
        setRoleLandingDismissed(preset.role, false);
      }
      try { window.dispatchEvent(new CustomEvent('ip:role-changed', { detail: { role: preset.role } })); } catch (e) {}
      if (navigateImmediately !== false) {
        const dest = IP.Routes.homeForRole(preset.role);
        if (typeof window.IP_CanvasNav === 'function') window.IP_CanvasNav(dest);
        else window.location.href = dest;
      }
      return session;
    },

    isRedirectPermitted: function (redirectUrl, role) {
      if (!redirectUrl) return false;
      const cleanFile = String(redirectUrl).split('?')[0].split('#')[0].replace(/^\/+/, '');
      const entries = Object.values(IP.Routes.PAGE_META);
      const found = entries.find(function (m) { return m.file === cleanFile; });
      if (!found) return false;
      if (found.roles.includes('public')) return true;
      return found.roles.includes(role);
    },

    guard: function (allowedRolesAttr) {
      const session = readSession();
      if (!allowedRolesAttr || allowedRolesAttr === 'public') {
        return { allowed: true, session: session };
      }
      const allowed = String(allowedRolesAttr)
        .split(',')
        .map(function (s) { return s.trim(); })
        .filter(Boolean);

      if (allowed.includes('public')) {
        return { allowed: true, session: session };
      }

      const currentFile = (window.__IP_VIRTUAL_PATH || window.location.pathname || '/index.html').split('/').pop() || 'index.html';

      if (!session) {
        return {
          allowed: false,
          reason: 'unauthenticated',
          redirectTarget: currentFile + (window.__IP_VIRTUAL_SEARCH || window.location.search || '')
        };
      }

      if (!allowed.includes(session.role)) {
        const errUrl = '403.html?from=' + encodeURIComponent(currentFile) + '&requiredRole=' + encodeURIComponent(allowed.join(','));
        if (typeof window.IP_CanvasNav === 'function') window.IP_CanvasNav(errUrl);
        else window.location.href = errUrl;
        return { allowed: false, reason: 'forbidden', session: session };
      }

      return { allowed: true, session: session };
    }
  };
})(window);

(function (window) {
  'use strict';
  const IP = (window.IP = window.IP || {});
  const THEME_KEY = 'invoicepilot.theme.v1';

  function getThemeChoice() {
    try {
      return window.localStorage.getItem(THEME_KEY) || 'light';
    } catch (e) {
      return 'light';
    }
  }

  function resolveEffectiveTheme(choice) {
    if (choice === 'dark') return 'dark';
    if (choice === 'system') {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return 'light';
  }

  function applyTheme(choice) {
    const c = choice || getThemeChoice();
    try {
      window.localStorage.setItem(THEME_KEY, c);
    } catch (e) {}
    const eff = resolveEffectiveTheme(c);
    document.documentElement.setAttribute('data-theme', eff);
    document.documentElement.setAttribute('data-bs-theme', eff);
    window.dispatchEvent(new CustomEvent('ip:themechange', { detail: { choice: c, theme: eff } }));
    return eff;
  }

  function ensureToastContainer() {
    let el = document.getElementById('ip-toast-container');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ip-toast-container';
      el.className = 'ip-toast-container';
      el.setAttribute('aria-live', 'polite');
      el.setAttribute('aria-atomic', 'true');
      document.body.appendChild(el);
    }
    return el;
  }

  function toast(opts) {
    const o = typeof opts === 'string' ? { message: opts } : (opts || {});
    const type = o.type || 'success';
    const iconMap = {
      success: 'bi-check-circle-fill text-success',
      danger: 'bi-exclamation-octagon-fill text-danger',
      warning: 'bi-exclamation-triangle-fill text-warning',
      info: 'bi-info-circle-fill text-primary'
    };
    const container = ensureToastContainer();
    const item = document.createElement('div');
    item.className = 'ip-toast ip-toast-' + type;
    item.setAttribute('role', 'status');
    item.innerHTML =
      '<i class="bi ' + (iconMap[type] || iconMap.info) + ' fs-5 mt-1"></i>' +
      '<div class="flex-grow-1">' +
        (o.title ? '<div class="fw-bold small mb-1">' + IP.Utils.escapeHtml(o.title) + '</div>' : '') +
        '<div class="small">' + IP.Utils.escapeHtml(o.message || '') + '</div>' +
      '</div>' +
      '<button type="button" class="btn-close btn-sm" aria-label="Đóng thông báo"></button>';

    const closeBtn = item.querySelector('.btn-close');
    closeBtn.addEventListener('click', function () {
      item.remove();
    });
    container.appendChild(item);
    setTimeout(function () {
      if (item.parentNode) item.remove();
    }, o.duration || 3500);
  }

  function statusBadge(status, customLabel) {
    const s = status || 'draft';
    const label = customLabel || IP.Fmt.statusLabel(s);
    return '<span class="ip-badge ip-badge-' + IP.Utils.escapeHtml(s) + '">' +
      '<span class="ip-badge-dot" aria-hidden="true"></span>' +
      IP.Utils.escapeHtml(label) +
    '</span>';
  }

  function riskBadge(riskObj) {
    const r = typeof riskObj === 'string'
      ? { level: riskObj, label: IP.Fmt.statusLabel(riskObj), formula: '' }
      : (riskObj || { level: 'low', label: 'Thấp', formula: '' });
    const tip = r.reasons ? (r.reasons.join(' · ') + ' | ' + r.formula) : (r.formula || '');
    return '<span class="ip-badge ip-badge-' + IP.Utils.escapeHtml(r.level) + '" title="' + IP.Utils.escapeHtml(tip) + '">' +
      '<span class="ip-badge-dot" aria-hidden="true"></span>Rủi ro ' + IP.Utils.escapeHtml(r.label) +
    '</span>';
  }

  function roleBadge(role) {
    const label = IP.Fmt.roleLabel(role);
    return '<span class="ip-badge ip-badge-sent">' + IP.Utils.escapeHtml(label) + '</span>';
  }

  function confirmModal(opts) {
    const o = opts || {};
    const modalId = 'ip-confirm-modal';
    let modalEl = document.getElementById(modalId);
    if (modalEl) modalEl.remove();

    const variant = o.variant || 'primary';
    const reqReason = Boolean(o.requireReason);

    modalEl = document.createElement('div');
    modalEl.id = modalId;
    modalEl.className = 'modal fade';
    modalEl.tabIndex = -1;
    modalEl.setAttribute('aria-hidden', 'true');
    modalEl.innerHTML =
      '<div class="modal-dialog modal-dialog-centered">' +
        '<div class="modal-content">' +
          '<div class="modal-header">' +
            '<h2 class="modal-title fs-5 fw-bold">' + IP.Utils.escapeHtml(o.title || 'Xác nhận thao tác') + '</h2>' +
            '<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<p class="mb-2">' + IP.Utils.escapeHtml(o.message || 'Bạn có chắc chắn muốn thực hiện thao tác này?') + '</p>' +
            (reqReason
              ? '<div class="mt-3">' +
                  '<label class="form-label" for="ip-confirm-reason">' + IP.Utils.escapeHtml(o.reasonLabel || 'Lý do thực hiện (bắt buộc)') + '</label>' +
                  '<textarea id="ip-confirm-reason" class="form-control" rows="2" placeholder="' + IP.Utils.escapeHtml(o.reasonPlaceholder || 'Nhập lý do cụ thể...') + '"></textarea>' +
                  '<div id="ip-confirm-reason-err" class="invalid-feedback d-none" role="alert">Vui lòng nhập lý do trước khi xác nhận.</div>' +
                '</div>'
              : '') +
          '</div>' +
          '<div class="modal-footer">' +
            '<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">' + IP.Utils.escapeHtml(o.cancelText || 'Hủy bỏ') + '</button>' +
            '<button type="button" class="btn btn-' + IP.Utils.escapeHtml(variant) + '" id="ip-confirm-submit-btn">' + IP.Utils.escapeHtml(o.confirmText || 'Xác nhận') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.body.appendChild(modalEl);
    const bsModal = window.bootstrap && window.bootstrap.Modal ? new window.bootstrap.Modal(modalEl) : null;
    const submitBtn = modalEl.querySelector('#ip-confirm-submit-btn');

    submitBtn.addEventListener('click', function () {
      let reasonVal = '';
      if (reqReason) {
        const input = modalEl.querySelector('#ip-confirm-reason');
        const errEl = modalEl.querySelector('#ip-confirm-reason-err');
        reasonVal = String(input.value || '').trim();
        if (!reasonVal) {
          input.classList.add('is-invalid');
          errEl.classList.remove('d-none');
          input.focus();
          return;
        }
      }
      if (bsModal) bsModal.hide();
      else modalEl.remove();
      if (typeof o.onConfirm === 'function') {
        o.onConfirm(reasonVal);
      }
    });

    if (bsModal) bsModal.show();
    else modalEl.style.display = 'block';
  }

  function viewStateMode() {
    const params = IP.Utils.getQueryParams();
    const d = String(params.state || params.view || '').toLowerCase();
    if (['loading', 'empty', 'error'].includes(d)) return d;
    return null;
  }

  function renderEmptyState(opts) {
    const o = opts || {};
    return (
      '<div class="ip-state-box">' +
        '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
          '<rect x="10" y="8" width="44" height="48" rx="8" stroke="currentColor" stroke-width="2.5"/>' +
          '<path d="M20 22H44M20 32H44M20 42H32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>' +
        '</svg>' +
        '<h3 class="fs-5 fw-bold mb-2">' + IP.Utils.escapeHtml(o.title || 'Không có dữ liệu phù hợp') + '</h3>' +
        '<p class="text-muted small mb-3">' + IP.Utils.escapeHtml(o.description || 'Chưa có bản ghi nào khớp với điều kiện đang chọn.') + '</p>' +
        (o.actionText
          ? '<button type="button" class="btn btn-primary btn-sm" data-action="' + IP.Utils.escapeHtml(o.actionAttr || 'clear-filters') + '">' +
              IP.Utils.escapeHtml(o.actionText) +
            '</button>'
          : '') +
      '</div>'
    );
  }

  function renderErrorState(opts) {
    const o = opts || {};
    return (
      '<div class="ip-state-box" role="alert">' +
        '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
          '<circle cx="32" cy="32" r="24" stroke="var(--ip-danger)" stroke-width="2.5"/>' +
          '<path d="M32 20V35" stroke="var(--ip-danger)" stroke-width="3" stroke-linecap="round"/>' +
          '<circle cx="32" cy="43" r="2" fill="var(--ip-danger)"/>' +
        '</svg>' +
        '<h3 class="fs-5 fw-bold mb-2">' + IP.Utils.escapeHtml(o.title || 'Không thể tải dữ liệu lúc này') + '</h3>' +
        '<p class="text-muted small mb-2">' + IP.Utils.escapeHtml(o.description || 'Đã xảy ra sự cố kết nối khi truy xuất dữ liệu. Bạn có thể bấm Thử lại để khôi phục hiển thị bình thường.') + '</p>' +
        '<div class="small text-muted mb-3">Mã trạng thái: <code>' + IP.Utils.escapeHtml(o.code || 'ERR_DATA_SYNC') + '</code></div>' +
        '<button type="button" class="btn btn-primary btn-sm" data-action="' + IP.Utils.escapeHtml(o.retryAction || 'exit-view-state') + '">' +
          '<i class="bi bi-arrow-clockwise"></i> Thử lại ngay' +
        '</button>' +
      '</div>'
    );
  }

  function renderSkeletonBlock(rows) {
    const count = rows || 5;
    let html = '<div class="p-4" aria-busy="true" aria-label="Đang tải dữ liệu">';
    for (let i = 0; i < count; i++) {
      html += '<div class="ip-skeleton mb-3" style="height: 42px; width: 100%;"></div>';
    }
    html += '</div>';
    return html;
  }

  function withLoading(containerEl, renderFn) {
    if (!containerEl || typeof renderFn !== 'function') return;
    const mode = viewStateMode();
    if (mode === 'loading') {
      containerEl.innerHTML = renderSkeletonBlock(6);
      setTimeout(function () {
        renderFn();
      }, 1450);
      return;
    }
    if (mode === 'error') {
      containerEl.innerHTML = renderErrorState({
        title: 'Gián đoạn truy xuất dữ liệu',
        description: 'Đang hiển thị trạng thái kiểm thử lỗi kết nối. Nhấn Thử lại để khôi phục dữ liệu bình thường.',
        code: 'ERR_SYNC_TIMEOUT'
      });
      bindStateExit(containerEl, renderFn);
      return;
    }
    if (mode === 'empty') {
      containerEl.innerHTML = renderEmptyState({
        title: 'Danh sách trống',
        description: 'Đang hiển thị trạng thái danh sách rỗng. Dữ liệu sổ kế toán trong trình duyệt vẫn được bảo toàn.',
        actionText: 'Tải lại danh sách đầy đủ',
        actionAttr: 'exit-view-state'
      });
      bindStateExit(containerEl, renderFn);
      return;
    }
    renderFn();
  }

  function bindStateExit(containerEl, renderFn) {
    const btn = containerEl.querySelector('[data-action="exit-view-state"]');
    if (btn) {
      btn.addEventListener('click', function () {
        IP.Utils.setQueryParams({ state: null, view: null });
        renderFn();
      });
    }
  }

  function renderPagination(opts) {
    const total = Number(opts.total || 0);
    const page = Number(opts.page || 1);
    const perPage = Number(opts.perPage || 10);
    const totalPages = Math.max(1, Math.ceil(total / perPage));
    if (total === 0) return '';

    const startIdx = (page - 1) * perPage + 1;
    const endIdx = Math.min(total, page * perPage);

    let btns = '';
    btns += '<button type="button" class="btn btn-sm btn-outline-secondary" data-action="page-change" data-page="' + (page - 1) + '" ' + (page <= 1 ? 'disabled' : '') + ' aria-label="Trang trước"><i class="bi bi-chevron-left"></i></button>';
    for (let p = 1; p <= totalPages; p++) {
      btns += '<button type="button" class="btn btn-sm ' + (p === page ? 'btn-primary' : 'btn-outline-secondary') + '" data-action="page-change" data-page="' + p + '">' + p + '</button>';
    }
    btns += '<button type="button" class="btn btn-sm btn-outline-secondary" data-action="page-change" data-page="' + (page + 1) + '" ' + (page >= totalPages ? 'disabled' : '') + ' aria-label="Trang sau"><i class="bi bi-chevron-right"></i></button>';

    return (
      '<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 px-3 py-3 border-top">' +
        '<div class="small text-muted">Hiển thị <strong>' + startIdx + '–' + endIdx + '</strong> trong <strong>' + total + '</strong> bản ghi</div>' +
        '<div class="d-flex align-items-center gap-1">' + btns + '</div>' +
      '</div>'
    );
  }

  function downloadCSV(filenamePrefix, headers, rows) {
    const today = IP.Seed ? IP.Seed.todayISO() : new Date().toISOString().slice(0, 10);
    const fname = (filenamePrefix || 'invoicepilot-export') + '-' + today + '.csv';
    const escapeCell = function (val) {
      const s = val === null || val === undefined ? '' : String(val);
      return '"' + s.replace(/"/g, '""') + '"';
    };
    const lines = [];
    if (Array.isArray(headers) && headers.length) {
      lines.push(headers.map(escapeCell).join(','));
    }
    (rows || []).forEach(function (r) {
      lines.push(r.map(escapeCell).join(','));
    });
    const csvContent = '\uFEFF' + lines.join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast({ title: 'Đã xuất tệp CSV', message: 'Tệp ' + fname + ' đã được tải xuống (UTF-8 BOM).', type: 'success' });
  }

  function openPaymentModal(opts) {
    const o = opts || {};
    const inv = IP.DB.getInvoice(o.invoiceId);

      toast({ title: 'Không tìm thấy hóa đơn', message: 'Vui lòng chọn một hóa đơn hợp lệ.', type: 'danger' });
      return;
    }
    const rem = IP.Calc.remaining(inv);
    if (rem <= 0) {
      toast({ title: 'Hóa đơn đã thu đủ', message: 'Hóa đơn ' + inv.number + ' không còn số dư phải thu.', type: 'info' });
      return;
    }
    const cus = IP.DB.getCustomer(inv.customerId);
    const today = IP.Seed.todayISO();

    const modalId = 'ip-payment-modal';
    let modalEl = document.getElementById(modalId);
    if (modalEl) modalEl.remove();

    modalEl = document.createElement('div');
    modalEl.id = modalId;
    modalEl.className = 'modal fade';
    modalEl.tabIndex = -1;
    modalEl.innerHTML =
      '<div class="modal-dialog modal-dialog-centered">' +
        '<div class="modal-content">' +
          '<form id="ip-payment-form" novalidate>' +
            '<div class="modal-header">' +
              '<div>' +
                '<h2 class="modal-title fs-5 fw-bold">Ghi nhận thanh toán · ' + IP.Utils.escapeHtml(inv.number) + '</h2>' +
                '<div class="small text-muted">' + IP.Utils.escapeHtml(cus ? cus.name : '') + ' · Còn phải thu: <strong class="ip-num">' + IP.Fmt.currency(rem) + '</strong></div>' +

              '<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>' +
            '</div>' +
            '<div class="modal-body">' +
              '<div id="ip-pay-err-box" class="alert alert-danger py-2 small d-none" role="alert"></div>' +
              '<div class="mb-3">' +
                '<label class="form-label" for="ip-pay-amount">Số tiền nhận (VND) <span class="text-danger">*</span></label>' +
                '<input type="number" id="ip-pay-amount" class="form-control ip-num" value="' + rem + '" min="1" max="' + rem + '" required>' +
                '<div class="form-text">Tối đa bằng số còn phải thu: ' + IP.Fmt.currency(rem) + '</div>' +
              '</div>' +
              '<div class="row g-3 mb-3">' +
                '<div class="col-sm-6">' +
                  '<label class="form-label" for="ip-pay-method">Phương thức thanh toán</label>' +
                  '<select id="ip-pay-method" class="form-select">' +
                    '<option value="transfer">Chuyển khoản ngân hàng</option>' +
                    '<option value="cash">Tiền mặt</option>' +
                    '<option value="ewallet">Ví điện tử doanh nghiệp</option>' +
                  '</select>' +
                '</div>' +
                '<div class="col-sm-6">' +
                  '<label class="form-label" for="ip-pay-date">Ngày nhận tiền <span class="text-danger">*</span></label>' +
                  '<input type="date" id="ip-pay-date" class="form-control" value="' + today + '" min="' + inv.issueDate + '" max="' + today + '" required>' +
                '</div>' +
              '</div>' +
              '<div class="mb-3">' +
                '<label class="form-label" for="ip-pay-ref">Mã tham chiếu / Ủy nhiệm chi</label>' +
                '<input type="text" id="ip-pay-ref" class="form-control" value="UNC-' + inv.number.slice(-4) + '-' + String(Date.now()).slice(-3) + '" placeholder="VD: VCB20260988">' +
              '</div>' +
              '<div class="mb-1">' +
                '<label class="form-label" for="ip-pay-note">Ghi chú kế toán</label>' +
                '<textarea id="ip-pay-note" class="form-control" rows="2" placeholder="Nhập ghi chú đợt thu tiền..."></textarea>' +
              '</div>' +
            '</div>' +
            '<div class="modal-footer">' +
              '<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>' +
              '<button type="submit" class="btn btn-primary" id="ip-pay-submit"><i class="bi bi-check2-circle"></i> Lưu thanh toán</button>' +
            '</div>' +
          '</form>' +
        '</div>' +
      '</div>';

    document.body.appendChild(modalEl);
    const bsModal = window.bootstrap && window.bootstrap.Modal ? new window.bootstrap.Modal(modalEl) : null;
    const form = modalEl.querySelector('#ip-payment-form');
    const errBox = modalEl.querySelector('#ip-pay-err-box');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errBox.classList.add('d-none');
      const amount = Number(modalEl.querySelector('#ip-pay-amount').value);
      const method = modalEl.querySelector('#ip-pay-method').value;
      const paidAt = modalEl.querySelector('#ip-pay-date').value;
      const reference = modalEl.querySelector('#ip-pay-ref').value;
      const note = modalEl.querySelector('#ip-pay-note').value;

      const res = IP.DB.addPayment({
        invoiceId: inv.id,
        amount: amount,
        method: method,
        paidAt: paidAt,
        reference: reference,
        note: note

      if (!res.ok) {
        errBox.textContent = res.error.message;
        errBox.classList.remove('d-none');
        if (res.error.field === 'amount') modalEl.querySelector('#ip-pay-amount').focus();
        if (res.error.field === 'paidAt') modalEl.querySelector('#ip-pay-date').focus();
        return;
      }

      if (bsModal) bsModal.hide();
      else modalEl.remove();
      toast({
        title: 'Đã ghi nhận thanh toán',
        message: 'Đã thu ' + IP.Fmt.currency(amount) + ' cho hóa đơn ' + inv.number + '.',
        type: 'success'
      });
      if (typeof o.onSaved === 'function') {
        o.onSaved(res.data);
      }
    });

    if (bsModal) bsModal.show();
    else modalEl.style.display = 'block';
  }

  function openCustomerPicker(opts) {
    const o = opts || {};
    const customers = IP.DB.listCustomers({ status: 'active' });
    const modalId = 'ip-customer-picker-modal';
    let modalEl = document.getElementById(modalId);
    if (modalEl) modalEl.remove();

    modalEl = document.createElement('div');
    modalEl.id = modalId;
    modalEl.className = 'modal fade';
    modalEl.tabIndex = -1;
    modalEl.innerHTML =
      '<div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">' +
        '<div class="modal-content">' +
          '<div class="modal-header">' +
            '<h2 class="modal-title fs-5 fw-bold">Chọn khách hàng (Chỉ hiển thị doanh nghiệp đang hoạt động)</h2>' +
            '<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="mb-3">' +
              '<label class="form-label visually-hidden" for="ip-cus-picker-q">Tìm khách hàng</label>' +
              '<input type="search" id="ip-cus-picker-q" class="form-control" placeholder="Tìm theo tên công ty, mã KH, MST hoặc người liên hệ...">' +
            '</div>' +
            '<div id="ip-cus-picker-list" class="list-group"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.body.appendChild(modalEl);
    const bsModal = window.bootstrap && window.bootstrap.Modal ? new window.bootstrap.Modal(modalEl) : null;
    const listEl = modalEl.querySelector('#ip-cus-picker-list');
    const searchInput = modalEl.querySelector('#ip-cus-picker-q');

    function renderList(q) {
      const term = String(q || '').trim().toLowerCase();
      const filtered = customers.filter(function (c) {
        if (!term) return true;
        return c.name.toLowerCase().includes(term) ||
          c.code.toLowerCase().includes(term) ||
          (c.taxCode && c.taxCode.toLowerCase().includes(term)) ||
          (c.contactName && c.contactName.toLowerCase().includes(term));
      });
      if (!filtered.length) {
        listEl.innerHTML = '<div class="text-center text-muted py-4">Không tìm thấy khách hàng khớp từ khóa.</div>';
        return;
      }
      listEl.innerHTML = filtered.map(function (c) {
        const bal = IP.Calc.customerBalance(c.id);
        const activeCls = c.id === o.selectedId ? 'active' : '';
        return (
          '<button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center ' + activeCls + '" data-cus-id="' + c.id + '">' +
            '<div>' +
              '<div class="fw-bold">' + IP.Utils.escapeHtml(c.name) + ' <span class="badge bg-secondary ms-1">' + IP.Utils.escapeHtml(c.code) + '</span></div>' +
              '<div class="small opacity-75">Liên hệ: ' + IP.Utils.escapeHtml(c.contactName) + ' · ' + IP.Utils.escapeHtml(c.email) + ' · Hạn chuẩn: ' + c.paymentTermDays + ' ngày</div>' +

  function buildNotificationDropdown(role) {
    const isEn = IP.I18n && IP.I18n.getLang() === 'en';
    const unread = IP.DB.listNotifications({ role: role, unreadOnly: true });
    const recent = IP.DB.listNotifications({ role: role }).slice(0, 5);
    const countBadge = unread.length > 0
      ? '<span class="ip-notif-dot" id="ip-topbar-notif-count">' + unread.length + '</span>'
      : '<span class="ip-notif-dot d-none" id="ip-topbar-notif-count">0</span>';

    const itemsHtml = recent.length
      ? recent.map(function (n) {
          const href = n.link || IP.Routes.url(n.targetRouteKey || 'notifications', n.targetParams || {}, role);
          return (
            '<li>' +
              '<a class="dropdown-item py-2 border-bottom text-wrap ' + (!n.read ? 'fw-semibold' : '') + '" href="' + IP.Utils.escapeHtml(href) + '" data-notif-id="' + n.id + '">' +
                '<div class="d-flex justify-content-between align-items-center mb-1">' +
                  '<span class="small">' + IP.Utils.escapeHtml(n.title) + '</span>' +
                  (!n.read ? '<span class="badge bg-primary rounded-pill" style="font-size:0.65rem">' + (isEn ? 'New' : 'Mới') + '</span>' : '') +
                '</div>' +
                '<div class="small text-muted">' + IP.Utils.escapeHtml(n.message) + '</div>' +
                '<div class="small text-muted mt-1" style="font-size:0.72rem">' + IP.Fmt.relative(n.createdAt) + '</div>' +
              '</a>' +
            '</li>'
          );
        }).join('')
      : '<li class="px-3 py-3 text-center text-muted small">' + (isEn ? 'No new notifications.' : 'Không có thông báo mới.') + '</li>';

    return (
      '<div class="dropdown">' +
        '<button type="button" class="ip-icon-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="' + (isEn ? 'System Notifications' : 'Thông báo hệ thống') + '">' +
          '<i class="bi bi-bell"></i>' + countBadge +
        '</button>' +
        '<ul class="dropdown-menu dropdown-menu-end shadow border p-0" style="width: 340px; max-width: 92vw;">' +
          '<li class="px-3 py-2 border-bottom d-flex justify-content-between align-items-center bg-body-tertiary">' +

  let _roleScrollHandler = null;
  let _roleGateTimer = null;

  function cleanupRoleLandingListeners() {
    if (_roleScrollHandler) {
      window.removeEventListener('scroll', _roleScrollHandler);
      _roleScrollHandler = null;
    }
    if (_roleGateTimer) {
      clearInterval(_roleGateTimer);
      _roleGateTimer = null;
    }
  }

  function computeRoleLiveSnapshot(role) {
    const st = IP.DB.getState();
    const openInvs = st.invoices.filter(function (i) { return !i.voided && !i.archived && i.sentAt && IP.Calc.remaining(i) > 0; });
    const totalAR = openInvs.reduce(function (s, i) { return s + IP.Calc.remaining(i); }, 0);
    const overdueInvs = openInvs.filter(function (i) { return IP.Calc.overdueDays(i) > 0; });
    const overdueAR = overdueInvs.reduce(function (s, i) { return s + IP.Calc.remaining(i); }, 0);
    const pendingBank = st.payments.filter(function (p) { return p.status === 'pending' && !p.discrepancy; }).length;
    const activeCustomers = st.customers.filter(function (c) { return c.status === 'active'; }).length;
    const activeUsers = st.users.filter(function (u) { return u.status === 'active'; }).length;

    if (role === 'accountant') {
      return [
        { label: 'Tổng phải thu đang mở', labelEn: 'Open Receivables', val: IP.Fmt.currency(totalAR, true), sub: openInvs.length + ' hóa đơn 1C26TAA' },
        { label: 'Sao kê chờ đối chiếu', labelEn: 'Pending Bank Feeds', val: pendingBank + ' giao dịch', sub: 'Vietcombank tự động' },
        { label: 'Kiểm soát trước phát hành', labelEn: 'Pre-Issue Audit', val: 'AI-1 Bật', sub: 'Ngưỡng cảnh báo 250%' }
      ];
    }
    if (role === 'sales') {
      return [
        { label: 'Khách hàng B2B hoạt động', labelEn: 'Active B2B Clients', val: activeCustomers + ' doanh nghiệp', sub: 'Quản lý hạn mức & kỳ hạn' },
        { label: 'Dư nợ quá hạn cần nhắc', labelEn: 'Overdue to Follow Up', val: IP.Fmt.currency(overdueAR, true), sub: overdueInvs.length + ' hóa đơn quá hạn' },
        { label: 'Trình soạn nhắc thanh toán', labelEn: 'Reminder Composer', val: 'AI-2 Bật', sub: 'Email & SMS 3 giọng điệu' }
      ];
    }
    if (role === 'manager') {
      const dsoObj = IP.Calc.dso(90);
      return [
        { label: 'Tổng công nợ phải thu', labelEn: 'Total AR Exposure', val: IP.Fmt.currency(totalAR, true), sub: 'Quá hạn: ' + IP.Fmt.currency(overdueAR, true) },
        { label: 'Kỳ thu tiền bình quân (DSO)', labelEn: 'Average DSO (90d)', val: dsoObj.days + ' ngày', sub: 'Giảm ' + Math.abs(dsoObj.delta) + ' ngày so với kỳ trước' },
        { label: 'Dự báo dòng tiền 3 kịch bản', labelEn: '3-Scenario Forecast', val: 'AI-3 Bật', sub: 'Cơ sở · Thận trọng · Lạc quan' }
      ];
    }
    return [
      { label: 'Tài khoản nhân sự hoạt động', labelEn: 'Active Staff Accounts', val: activeUsers + ' / ' + st.users.length, sub: '4 vai trò phân quyền' },
      { label: 'Hồ sơ doanh nghiệp B2B', labelEn: 'B2B Client Profiles', val: st.customers.length + ' đối tác', sub: 'Chặn lưu trữ khi còn nợ' },
      { label: 'Quy chuẩn đánh số & AI', labelEn: 'Numbering & AI Switches', val: '1C26TAA', sub: '3 công tắc AI đang bật' }
    ];
  }

            '<i class="bi bi-eye-slash"></i> ' + (isEn ? 'Enter & Don\'t Show Again on Future Visits' : 'Vào trang tác vụ & Không hiển thị lại lần sau') +
          '</button>' +
        '</div>' +
      '</div>';

    mainEl.insertBefore(section, mainEl.firstChild);

    let isTransitioning = false;

    function completeRoleLandingTransition(rememberForever, reasonText) {
      if (isTransitioning) return;
      isTransitioning = true;
      cleanupRoleLandingListeners();

      const neverChk = section.querySelector('#ip-never-show-role-landing-chk');
      const persistHide = rememberForever !== undefined ? Boolean(rememberForever) : Boolean(neverChk && neverChk.checked);
      IP.Auth.setRoleLandingDismissed(role, true, persistHide);

      section.classList.add('ximi-collapsing');
      setTimeout(function () {
        if (section.parentNode) section.remove();
        const anchor = document.getElementById('ip-role-workspace-anchor');
        if (anchor) {
          anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        if (IP.UI && typeof IP.UI.toast === 'function') {
          IP.UI.toast({
            title: isEn ? ('Entered ' + roleLabel + ' Workspace') : ('Đã vào trang tác vụ ' + roleLabel),
            message: reasonText || (persistHide
              ? (isEn ? 'Role intro hidden for future visits. You can reopen it anytime from the topbar.' : 'Đã lưu tùy chọn không hiển thị lại khi vào lần mới. Bạn có thể mở lại từ thanh công cụ.')
              : (isEn ? 'You are now in the operational workspace. Click "Role Intro" in the topbar to view again.' : 'Bạn đang ở trang tác vụ chính. Có thể bấm "Giới thiệu nghiệp vụ" trên thanh công cụ nếu muốn xem lại.')),
            type: 'success'
          });
        }
      }, 280);
    }

    // Bind buttons inside section
    const skipBtn = section.querySelector('#ip-skip-role-landing-btn');
    const neverBtn = section.querySelector('#ip-never-show-role-landing-btn');
    const neverChk = section.querySelector('#ip-never-show-role-landing-chk');

    if (neverChk) {
      neverChk.addEventListener('change', function () {
        IP.Auth.setRoleLandingHiddenForever(role, Boolean(neverChk.checked));
      });
    }

    if (skipBtn) {
      skipBtn.addEventListener('click', function () {
        completeRoleLandingTransition(Boolean(neverChk && neverChk.checked));
      });
    }

    if (neverBtn) {
      neverBtn.addEventListener('click', function () {
        if (neverChk) neverChk.checked = true;
        completeRoleLandingTransition(true);
      });
    }

    section.addEventListener('click', function (ev) {
      const jumpBtn = ev.target.closest('[data-ximi-jump]');
      if (jumpBtn) {
        const targetId = jumpBtn.getAttribute('data-ximi-jump');
        const targetEl = section.querySelector('#' + targetId);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        return;
      }

      const navOther = ev.target.closest('[data-ximi-nav-other]');
      if (navOther) {
        const persist = Boolean(neverChk && neverChk.checked);
        IP.Auth.setRoleLandingDismissed(role, true, persist);
        return;
      }

      const actBtn = ev.target.closest('[data-ximi-action]');
      if (actBtn) {
        const act = actBtn.getAttribute('data-ximi-action');
        if (act === 'enter-workspace-now') {
          completeRoleLandingTransition(Boolean(neverChk && neverChk.checked));
        } else if (act === 'enter-workspace-never-show') {
          if (neverChk) neverChk.checked = true;
          completeRoleLandingTransition(true);
        }
      }
    });

    // Scroll tracking: update active chapter pill, progress bar, and auto-transition when reaching end gate!
    let gateProgress = 0;
    _roleScrollHandler = function () {
      const secEl = document.getElementById('ip-role-landing-section');
      if (!secEl || isTransitioning) return;

      const rect = secEl.getBoundingClientRect();
      const viewportH = window.innerHeight || document.documentElement.clientHeight;
      const totalScrollable = Math.max(1, rect.height - viewportH * 0.55);
      const scrolled = Math.max(0, -rect.top);
      const pct = Math.min(100, Math.max(10, Math.round((scrolled / totalScrollable) * 100)));

      const progBar = secEl.querySelector('#ximi-scroll-progress-bar');
      if (progBar) progBar.style.width = pct + '%';

      // Highlight current chapter pill
      const chapters = secEl.querySelectorAll('[data-ximi-chapter]');
      let activeIdx = 0;
      chapters.forEach(function (ch, idx) {
        const cRect = ch.getBoundingClientRect();
        if (cRect.top <= viewportH * 0.45) {
          activeIdx = idx;
        }
      });
      const pills = secEl.querySelectorAll('.ximi-chapter-pill');
      pills.forEach(function (p, idx) {
        p.classList.toggle('active', idx === activeIdx);
      });

      // Check if user scrolled to the end gate (#ximi-ch-05) or past the bottom of the landing section
      const gateEl = secEl.querySelector('#ximi-ch-05');
      if (gateEl) {
        const gateRect = gateEl.getBoundingClientRect();
        // If user scrolls past the bottom of the gate into the workspace below, jump immediately
        if (gateRect.bottom <= viewportH * 0.65) {
          completeRoleLandingTransition(Boolean(neverChk && neverChk.checked));
          return;
        }
        // If the end gate is clearly visible in viewport, start filling the auto-transition bar
        if (gateRect.top <= viewportH * 0.78 && scrolled > 120) {
          if (!_roleGateTimer) {
            const gateBar = secEl.querySelector('#ximi-gate-auto-bar');
            _roleGateTimer = setInterval(function () {
              if (!document.getElementById('ip-role-landing-section') || isTransitioning) {
                clearInterval(_roleGateTimer);
                _roleGateTimer = null;
                return;
              }
              const gRectNow = gateEl.getBoundingClientRect();
              if (gRectNow.top > viewportH * 0.85) {
                gateProgress = 0;
                if (gateBar) gateBar.style.width = '0%';
                clearInterval(_roleGateTimer);
                _roleGateTimer = null;
                return;
              }
              gateProgress += 20;
              if (gateBar) gateBar.style.width = Math.min(100, gateProgress) + '%';
              if (gateProgress >= 100) {
                clearInterval(_roleGateTimer);
                _roleGateTimer = null;
                completeRoleLandingTransition(Boolean(neverChk && neverChk.checked));
              }
            }, 160);
          }
        }
      }
    };

    window.addEventListener('scroll', _roleScrollHandler, { passive: true });
  }

  function updateTopbarThemeAndLangIcons() {

    const fxDate = IP.I18n ? IP.I18n.getSelectedRateDate() : '';

      themeBtn.innerHTML = '<i class="bi ' + (effTheme === 'dark' ? 'bi-sun' : 'bi-moon-stars') + '"></i>';
      themeBtn.setAttribute('aria-pressed', effTheme === 'dark' ? 'true' : 'false');
      themeBtn.setAttribute('title', isEn ? ('Switch Light / Dark (' + effTheme + ')') : ('Chuyển chế độ Sáng / Tối (Đang dùng: ' + (effTheme === 'dark' ? 'Tối' : 'Sáng') + ')'));

      fxBtn.setAttribute('title', isEn ? ('Daily FX Rate (' + IP.Fmt.date(fxDate) + '): 1 USD = ' + fxRate.toLocaleString('en-US') + ' VND') : ('Bảng tỷ giá ngày (' + IP.Fmt.date(fxDate) + '): 1 USD = ' + fxRate.toLocaleString('en-US') + ' VND'));

                '<span class="ip-avatar" style="width:28px;height:28px;font-size:0.75rem;">' + IP.Utils.escapeHtml(IP.Utils.initials(userName)) + '</span>' +

                '<li><button type="button" class="dropdown-item" data-shell-action="open-login-modal"><i class="bi bi-box-arrow-in-right me-2"></i>' + (isEn ? 'Sign in with another role account' : 'Đăng nhập tài khoản nghiệp vụ khác') + '</button></li>' +
                (role === 'admin'

          IP.Auth.openLoginModal({ mandatory: false });
        } else if (action === 'show-role-landing') {
          IP.Auth.setRoleLandingDismissed(role, false, false);
          const curPage = document.body.getAttribute('data-page') || '';
          const defPage = ROLE_DEFAULT_PAGES[role] || 'accountant-invoice-list';
          if (curPage !== defPage) {

    if (oldShell && mainEl) {
      oldShell.parentNode.insertBefore(mainEl, oldShell);
      oldShell.remove();
    }
    if (mainEl) {
      mainEl.innerHTML = '';
    }
    IP.Layout.boot();

  IP.Layout = {
    LOGO_SVG: LOGO_SVG,
    ROLE_DEFAULT_PAGES: ROLE_DEFAULT_PAGES,
    ROLE_LANDING_CONTENT: ROLE_LANDING_CONTENT,
    mount: mountShell,
    mountRoleLandingBanner: mountRoleLandingBanner,
    boot: function () {
      IP.DB.init();
      cleanupRoleLandingListeners();
      const body = document.body;
      const pageId = body.getAttribute('data-page') || '';
      const rolesAttr = body.getAttribute('data-roles') || 'public';

      const guardRes = IP.Auth.guard(rolesAttr);
      if (!guardRes.allowed) {
        if (guardRes.reason === 'unauthenticated') {
          const landingDef = IP.Pages.get('landing');
          if (landingDef && typeof landingDef.init === 'function') {
            landingDef.init({ pageId: 'landing', session: null });
          }
          IP.Auth.openLoginModal({
            mandatory: true,
            redirectUrl: guardRes.redirectTarget
          });
        }
        return;
      }

      const noShellPages = ['landing', 'login', 'forgot-password', 'error-403', 'error-404'];
      if (!noShellPages.includes(pageId)) {
        mountShell(pageId, guardRes.session);
      }

      const pageDef = IP.Pages.get(pageId);
      if (pageDef && typeof pageDef.init === 'function') {
        pageDef.init({ pageId: pageId, session: guardRes.session });
      }

      // Mount Ximitech-style Role Landing Page ONLY on the default first page of the role
      if (!noShellPages.includes(pageId) && guardRes.session) {
        const role = guardRes.session.role;
        const defaultPageForRole = ROLE_DEFAULT_PAGES[role] || 'accountant-invoice-list';
        if (pageId === defaultPageForRole) {
          mountRoleLandingBanner(role, guardRes.session.name, false);
          const mainEl = document.getElementById('main-content');

            o.onResult(lastResult);
