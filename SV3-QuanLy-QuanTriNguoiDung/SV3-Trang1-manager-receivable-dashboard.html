<!DOCTYPE html>
<!-- =========================================================================
     SV3 · VIDEO 1 (TRANG 1 - QUẢN LÝ CFO): DASHBOARD CÔNG NỢ, DSO, CHART.JS & AI-3
     Kiến trúc chuẩn InvoicePilot: IIFE Namespace window.IP (Calc, AI, DB, Pages)
     ========================================================================= -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SV3 · Trang 1 — Dashboard Tổng quan Công nợ CFO, DSO & AI-3 | InvoicePilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --ip-bg: #F7F6F2; --ip-surface: #FFFFFF; --ip-sidebar: #0F1F1C; --ip-primary: #0B5D50; --ip-accent: #E8B44A; --ip-border: #E4E2DC; }
    body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--ip-bg); color: #14201D; margin: 0; }
    .ip-shell { display: flex; min-height: 100vh; }
    .ip-sidebar { width: 250px; background: var(--ip-sidebar); color: #EAF2EF; padding: 1.25rem 1rem; flex-shrink: 0; }
    .ip-brand { font-weight: 700; font-size: 1.15rem; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
    .ip-nav-link { display: flex; align-items: center; gap: 10px; color: rgba(234,242,239,0.75); padding: 9px 12px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; margin-bottom: 4px; }
    .ip-nav-link:hover, .ip-nav-link.active { background: rgba(232,180,74,0.16); color: var(--ip-accent); font-weight: 600; }
    .ip-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .ip-topbar { height: 60px; background: var(--ip-surface); border-bottom: 1px solid var(--ip-border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .ip-content { padding: 1.5rem; max-width: 1360px; }
    .ip-card { background: var(--ip-surface); border: 1px solid var(--ip-border); border-radius: 12px; padding: 1.25rem; }
    .ip-kpi-val { font-family: 'JetBrains Mono', monospace; font-size: 1.35rem; font-weight: 700; }
    .mgr-chart-box { position: relative; height: 240px; width: 100%; }
    #ip-toast-box { position: fixed; bottom: 20px; right: 20px; z-index: 3000; }
  </style>
</head>
<body data-page="manager-receivable-dashboard" data-roles="manager">
  <div class="ip-shell">
    <aside class="ip-sidebar">
      <a class="ip-brand" href="#"><i class="bi bi-receipt-cutoff text-warning fs-4"></i> InvoicePilot</a>
      <div class="small text-uppercase text-white-50 mb-2 px-2" style="font-size:0.72rem;">SV3 · Phân hệ Quản lý & Admin</div>
      <a class="ip-nav-link active" href="SV3-Trang1-manager-receivable-dashboard.html"><i class="bi bi-bar-chart-line"></i> 1. Dashboard CFO & AI-3</a>
      <a class="ip-nav-link" href="SV3-Trang2-manager-overdue-invoices.html"><i class="bi bi-exclamation-octagon"></i> 2. HĐ Quá hạn & Dự báo</a>
      <a class="ip-nav-link" href="SV3-Trang3-admin-user-management.html"><i class="bi bi-shield-lock"></i> 3. [Admin] Quản trị Tài khoản</a>
      <hr class="border-secondary my-3">
      <div class="small text-white-50 px-2">Đăng nhập: <strong>Lê Hoàng Anh</strong><br><span class="text-warning">Giám đốc Tài chính (CFO)</span></div>
    </aside>

    <div class="ip-main">
      <header class="ip-topbar">
        <div class="small text-muted">Quản lý Điều hành / <strong class="text-dark">Bảng điều khiển Tổng quan Công nợ CFO, Chỉ số DSO, 3 Biểu đồ Chart.js & AI-3</strong></div>
        <a class="btn btn-sm btn-warning fw-bold" href="SV3-Trang2-manager-overdue-invoices.html"><i class="bi bi-arrow-right-circle"></i> Điều phối Nợ Quá hạn & Dự báo</a>
      </header>
      <main id="main-content" class="ip-content"></main>
    </div>
  </div>
  <div id="ip-toast-box"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
  /**
   * @owner SV3
   * @spec §8.3, §9.4 Công thức DSO (Days Sales Outstanding), 3 Biểu đồ Chart.js & Động cơ AI-3
   */
  (function (window) {
    'use strict';
    const IP = (window.IP = window.IP || {});
    const REPORT_KEY = 'invoicepilot.sv3.reports.v1';

    IP.Fmt = { vnd: (n) => Math.round(Number(n || 0)).toLocaleString('vi-VN') + ' ₫' };

    const DATA_BY_PERIOD = {
      30: { creditSales: 980000000, openReceivables: 533000000, overdue: 260000000, aging: [163, 110, 95, 165], cashActual: [120, 145, 160, 190], cashExpected: [140, 155, 185, 220] },
      60: { creditSales: 1850000000, openReceivables: 690000000, overdue: 340000000, aging: [210, 140, 130, 210], cashActual: [210, 250, 290, 340], cashExpected: [240, 280, 320, 390] },
      90: { creditSales: 2640000000, openReceivables: 825000000, overdue: 415000000, aging: [250, 160, 155, 260], cashActual: [310, 380, 420, 490], cashExpected: [350, 410, 470, 560] }
    };

    const TOP_DEBTORS = [
      { name: 'CTCP Dược phẩm Tâm Bình', amount: 260000000 },
      { name: 'Tập đoàn Bán lẻ Phú Thái', amount: 205000000 },
      { name: 'CTCP Xây dựng Hòa Phát Mới', amount: 155000000 },
      { name: 'CTCP Logistics Sao Việt', amount: 115000000 },
      { name: 'Bệnh viện Quốc tế Minh Tâm', amount: 90000000 }
    ];

    // 1. CÔNG THỨC TÍNH CHỈ SỐ DSO — SỐ NGÀY THU TIỀN BÌNH QUÂN (IP.Calc.computeDSO)
    // Công thức chuẩn CFO: DSO = round((Tổng phải thu đang mở / Tổng doanh thu bán chịu trong kỳ) * Số ngày kỳ)
    IP.Calc = {
      computeDSO: function (openReceivables, creditSales, periodDays) {
        if (!creditSales || creditSales <= 0) return 0;
        return Math.round((openReceivables / creditSales) * periodDays);
      }
    };

    // 2. ĐỘNG CƠ TRỢ LÝ AI-3: PHÂN TÍCH ĐỘ TẬP TRUNG CÔNG NỢ & CẢNH BÁO DÒNG TIỀN (IP.AI.summarizeCashflow)
    IP.AI = {
      summarizeCashflow: function (periodDays, data) {
        const dso = IP.Calc.computeDSO(data.openReceivables, data.creditSales, periodDays);
        const top1 = TOP_DEBTORS[0];
        const topSharePct = Math.round((top1.amount / data.openReceivables) * 100);
        const severeOverdue = (data.aging[2] + data.aging[3]) * 1000000;

        return {
          headline: `Kỳ ${periodDays} ngày: Chỉ số DSO đạt ${dso} ngày · Rủi ro tập trung công nợ ở mức ${topSharePct >= 22 ? 'CAO' : 'KIỂM SOÁT'} (${topSharePct}%).`,
          bullets: [
            `Rủi ro tập trung: "${top1.name}" đang chiếm ${topSharePct}% tổng phải thu (${IP.Fmt.vnd(top1.amount)}). Ngưỡng an toàn B2B là < 22%.`,
            `Cảnh báo tuổi nợ sâu (>60 ngày): Nhóm nợ 61–90 ngày và >90 ngày đang kẹt ${IP.Fmt.vnd(severeOverdue)}, cần giao chuyên viên Kinh doanh thu hồi ngay.`,
            `Khuyến nghị CFO: Giảm DSO từ ${dso} ngày về mục tiêu 25 ngày bằng cách siết hạn mức các khách hàng quá hạn trên 60 ngày.`
          ]
        };
      }
    };

    // 3. QUẢN LÝ VÒNG ĐỜI CHART.JS (CHỐNG RÒ RỈ BỘ NHỚ KHI ĐỔI KỲ) & LƯU BÁO CÁO AI-3
    let period = 90;
    let charts = [];

    function destroyCharts() {
      charts.forEach((c) => { try { c.destroy(); } catch (e) {} });
      charts = [];
    }

    function getSavedReports() {
      const raw = localStorage.getItem(REPORT_KEY);
      return raw ? JSON.parse(raw) : [{ id: 'rp1', time: '2026-10-23 16:00', period: 90, summary: 'Kỳ 90 ngày: DSO đạt 28 ngày · Cần ưu tiên thu hồi nhóm >90 ngày.' }];
    }

    function toast(title, msg) {
      const el = document.createElement('div');
      el.className = 'alert alert-success shadow border-0 py-2 px-3 mb-2';
      el.innerHTML = `<div class="fw-bold small">${title}</div><div class="small">${msg}</div>`;
      document.getElementById('ip-toast-box').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function renderDashboard() {
      destroyCharts();
      const root = document.getElementById('main-content');
      const d = DATA_BY_PERIOD[period];
      const dso = IP.Calc.computeDSO(d.openReceivables, d.creditSales, period);
      const ai3 = IP.AI.summarizeCashflow(period, d);
      const savedReports = getSavedReports();

      root.innerHTML = `
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
          <div>
            <h5 class="fw-bold mb-0">Bảng điều khiển Tổng quan Công nợ Phải thu (CFO Executive View)</h5>
            <div class="small text-muted">Công thức DSO = (Phải thu đang mở / Doanh thu kỳ) × Số ngày kỳ</div>
          </div>
          <div class="btn-group">
            ${[30, 60, 90].map((p) => `<button class="btn btn-sm ${period === p ? 'btn-primary fw-bold' : 'btn-outline-secondary'}" data-period="${p}">Kỳ ${p} ngày</button>`).join('')}
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-3"><div class="ip-card"><div class="small text-muted">Doanh thu phát hành (${period}n)</div><div class="ip-kpi-val text-dark">${IP.Fmt.vnd(d.creditSales)}</div></div></div>
          <div class="col-md-3"><div class="ip-card"><div class="small text-muted">Tổng phải thu đang mở</div><div class="ip-kpi-val text-primary">${IP.Fmt.vnd(d.openReceivables)}</div></div></div>
          <div class="col-md-3"><div class="ip-card"><div class="small text-muted">Nợ quá hạn chưa thu</div><div class="ip-kpi-val text-danger">${IP.Fmt.vnd(d.overdue)}</div></div></div>
          <div class="col-md-3"><div class="ip-card border-warning"><div class="small text-muted">Chỉ số DSO (Kỳ ${period} ngày)</div><div class="ip-kpi-val text-warning-emphasis">${dso} ngày</div></div></div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-lg-4"><div class="ip-card"><h6 class="fw-bold small mb-2">1. Phân bổ Tuổi nợ 4 Nhóm (Triệu ₫)</h6><div class="mgr-chart-box"><canvas id="ch-aging"></canvas></div></div></div>
          <div class="col-lg-4"><div class="ip-card"><h6 class="fw-bold small mb-2">2. Xu hướng Dòng tiền Thực thu vs Dự kiến</h6><div class="mgr-chart-box"><canvas id="ch-cash"></canvas></div></div></div>
          <div class="col-lg-4"><div class="ip-card"><h6 class="fw-bold small mb-2">3. Top 5 Doanh nghiệp Dư nợ Cao nhất</h6><div class="mgr-chart-box"><canvas id="ch-top5"></canvas></div></div></div>
        </div>

        <div class="row g-3">
          <div class="col-lg-7">
            <div class="ip-card border-success h-100">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-success"><i class="bi bi-stars"></i> Trợ lý AI-3 · Tóm tắt Điều hành & Độ tập trung Công nợ</span>
                <button class="btn btn-sm btn-outline-success" id="btn-save-ai3"><i class="bi bi-bookmark-check"></i> Lưu bản chụp báo cáo</button>
              </div>
              <div class="fw-bold text-primary mb-2">${ai3.headline}</div>
              <ul class="small mb-0">${ai3.bullets.map((b) => `<li class="mb-1">${b}</li>`).join('')}</ul>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="ip-card h-100">
              <h6 class="fw-bold small mb-2">Bản chụp Báo cáo Điều hành AI-3 đã lưu (${savedReports.length})</h6>
              ${savedReports.map((r) => `<div class="p-2 border rounded bg-light small mb-2"><div class="fw-bold text-muted">${r.time} · Kỳ ${r.period} ngày</div><div>${r.summary}</div></div>`).join('')}
            </div>
          </div>
        </div>`;

      // Khởi tạo 3 biểu đồ Chart.js
      if (window.Chart) {
        charts.push(new Chart(document.getElementById('ch-aging'), {
          type: 'bar',
          data: { labels: ['0-30 ngày', '31-60 ngày', '61-90 ngày', '>90 ngày'], datasets: [{ label: 'Dư nợ (Triệu ₫)', data: d.aging, backgroundColor: ['#1E7E5A', '#D9822B', '#E05A2B', '#C83E3B'] }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        }));
        charts.push(new Chart(document.getElementById('ch-cash'), {
          type: 'line',
          data: { labels: ['Tuần 1', 'Tuần 2', 'Tuần 3', 'Tuần 4'], datasets: [
            { label: 'Thực thu', data: d.cashActual, borderColor: '#0B5D50', tension: 0.3 },
            { label: 'Dự kiến', data: d.cashExpected, borderColor: '#E8B44A', borderDash: [5, 5], tension: 0.3 }
          ]},
          options: { responsive: true, maintainAspectRatio: false }
        }));
        charts.push(new Chart(document.getElementById('ch-top5'), {
          type: 'bar',
          data: { labels: TOP_DEBTORS.map((x) => x.name.replace('CTCP ', '')), datasets: [{ label: 'Triệu ₫', data: TOP_DEBTORS.map((x) => x.amount / 1000000), backgroundColor: '#0B5D50' }] },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        }));
      }

      root.querySelectorAll('[data-period]').forEach((b) => b.addEventListener('click', () => { period = Number(b.dataset.period); renderDashboard(); }));
      root.querySelector('#btn-save-ai3').addEventListener('click', () => {
        const list = getSavedReports();
        list.unshift({ id: 'rp_' + Date.now(), time: '2026-10-24 10:30', period, summary: ai3.headline });
        localStorage.setItem(REPORT_KEY, JSON.stringify(list));
        renderDashboard();
        toast('Đã lưu bản chụp báo cáo AI-3', `Báo cáo kỳ ${period} ngày đã được lưu vào lịch sử CFO.`);
      });
    }

    document.addEventListener('DOMContentLoaded', renderDashboard);
  })(window);
  </script>
</body>
</html>
